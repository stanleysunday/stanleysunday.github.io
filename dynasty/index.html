<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  /* Aurora: put "Aurora Condensed Bold.otf" next to this file. Anton is the fallback. */
  @font-face { font-family: 'Aurora'; src: url('Aurora%20Condensed%20Bold.otf') format('opentype'); font-weight: 700; font-style: normal; }
  html, body { margin: 0; height: 100%; background: #8a1622; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #panel { position: fixed; left: 12px; bottom: 12px; display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px;
    background: rgba(0,0,0,0.78); color: #fed200; font: 13px/1.3 system-ui, sans-serif; min-width: 240px; }
  #panel[hidden] { display: none; }
  #panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
  #panel input { grid-column: 1 / -1; width: 100%; accent-color: #fed200; }
  #panel small { opacity: 0.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel" hidden>
  <label>Separación de puntos <span id="gapV"></span><input type="range" id="gap" min="60" max="280" step="5"></label>
  <label>Tamaño de nombres <span id="textV"></span><input type="range" id="text" min="0.6" max="1.6" step="0.05"></label>
  <label>Velocidad <span id="speedV"></span><input type="range" id="speed" min="0.3" max="1.3" step="0.05"></label>
  <small>Tecla A: mostrar / ocultar</small>
</div>
<script>
(() => {
// ═════════════════════════════════════════════════════════════════
//  CAST, RELATIONSHIPS AND ENCOUNTERS — edit here
// ═════════════════════════════════════════════════════════════════

const CAST = ['KRYSTLE', 'ALEXIS', 'BLAKE', 'STEVEN', 'FALLON', 'JEFF', 'SAMMY\nJO', 'CECIL'];

// While wandering, who drifts toward whom (+) and who keeps away from whom (−).
const AFF = {
  JEFF:        { FALLON: 1 },
  FALLON:      { JEFF: 1, ALEXIS: -0.6 },
  'SAMMY\nJO': { STEVEN: 0.8 },
  STEVEN:      { BLAKE: -0.5 },
  BLAKE:       { KRYSTLE: 0.5, STEVEN: 0.3, CECIL: -0.3 },
  KRYSTLE:     { BLAKE: 0.4 },
  CECIL:       { ALEXIS: 0.6 },
  ALEXIS:      {},
};

// Encounters: when a pair is free and close, they hang side by side and say their lines.
// 'a' / 'b' = who speaks. '|' splits a line into successive bubbles. cd = cooldown in seconds.
const SCENES = [
  { id: 'date', a: 'FALLON', b: 'JEFF', low: true, baby: true, cd: [80, 110],
    lines: [['a', 'I NEED\nYOU'], ['b', "I'M\nHERE"], ['a', 'KISS ME,\nJEFF!'], ['b', 'OH,\nFALLON!'], ['a', "I'M\nPREGNANT"]] },
  { id: 'man', a: 'BLAKE', b: 'STEVEN', cd: [35, 50],
    lines: [['a', 'BE A\nMAN!'], ['b', "I'M\nGAY."]] },
  { id: 'marry', a: 'SAMMY\nJO', b: 'STEVEN', cd: [35, 50],
    lines: [['a', 'MARRY\nME?'], ['b', 'OK…|STRAIGHT|TILL|SEASON\nTHREE']] },
  { id: 'auntie', a: 'SAMMY\nJO', b: 'KRYSTLE', cd: [40, 55],
    lines: [['a', "AUNTIE,|I'M MARRYING\nSTEVEN"], ['b', 'STEVEN\nIS GAY'], ['a', 'STRAIGHT|UNTIL|NEXT\nSEASON']] },
  { id: 'love', a: 'BLAKE', b: 'KRYSTLE', cd: [35, 50],
    lines: [['a', 'I LOVE YOU,\nKRYSTLE'], ['b', 'I LOVE YOU,\nBLAKE']] },
  { id: 'daughter', a: 'BLAKE', b: 'FALLON', cd: [30, 45],
    lines: [['a', 'OH, MY\nDAUGHTER!']] },
  { id: 'teeth', a: 'ALEXIS', b: 'FALLON', cd: [35, 50],
    lines: [['a', "I'M GLAD TO SEE YOUR FATHER\nHAD YOUR TEETH FIXED…|IF NOT\nYOUR TONGUE."]] },
  // Blake says his line, shoves Alexis: her rope vanishes and she tumbles down the dots like a staircase
  // Alexis and Cecil, no ropes, in bed on the floor; Cecil flips over backwards with a heart attack; everyone freezes
  { id: 'cecil', a: 'ALEXIS', b: 'CECIL', love: true, cd: [60, 80],
    lines: [['a', 'CALL AN\nAMBULANCE!|CECIL IS HAVING\nA HEART ATTACK!']] },
  { id: 'push', a: 'BLAKE', b: 'ALEXIS', push: true, cd: [50, 70],
    lines: [['a', 'GET OUT,\nALEXIS!']] },
  { id: 'deal', a: 'CECIL', b: 'BLAKE', cd: [35, 50],
    lines: [['a', 'WE HAVE\nA DEAL'], ['b', 'LEAVE MY\nFAMILY']] },
];

// Alexis vs Krystle: how many blows each fight lasts (min, max), and what the one who strikes says.
const DUEL_HITS = [3, 5];        // a normal fight
const SUPER_HITS = 6;            // the superfight: short, fast, the screen shakes
const STANDOFF_INSULTS = [2, 4]; // each meeting starts with BITCH! back and forth; reaching the max sets off the superfight
const STANDOFF_LINE = 'BITCH!';
const DUEL_LINES = {
  ALEXIS: ['PATHETIC\nLITTLE FOOL', 'LITTLE\nNOBODY', 'CHEAP\nSUITCASES', 'OUT OF\nMY WAY', 'NEVER A\nCARRINGTON'],
  KRYSTLE: ['JUST\nWHISTLE!', 'OUT OF\nMY HOUSE', 'BITCH!', 'HANDS\nOFF', 'YOU\nDISGUST ME', 'STAY\nAWAY'],
};

// ═════════════════════════════════════════════════════════════════

const CFG = { gap: 115, text: 1, speed: 0.85, bg: '#8a1622', ink: '#fed200', idle: '#e49aa0', quip: '#FF4FA3' };   // idle = words at rest; ink = words in action
try {
  const s = JSON.parse(localStorage.getItem('dynasty-cfg') || '{}');
  ['gap', 'text', 'speed'].forEach(k => { if (typeof s[k] === 'number') CFG[k] = s[k]; });
} catch (e) {}
const saveCfg = () => { try { localStorage.setItem('dynasty-cfg', JSON.stringify({ gap: CFG.gap, text: CFG.text, speed: CFG.speed })); } catch (e) {} };

const REST = 0.45, THROW_T = 0.18, TUG = 0.3, TUG_T = 0.3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, COLS = 5, ROWS = 9, SPX = 200, SPY = 200, U = 1, G = 1500, PUMP = 1000, FS = 60;
let anchors = [];
let balls = [];
let quips = [];
let scenes = [], sceneGap = 7, freeze = 0, shakeT = 0;
const cool = {}, rest = {}, follows = [];
const duel = { phase: 'truce', t: 4, hunter: null, waiter: null, post: null, hits: 0, goal: DUEL_HITS[0] + 2, opened: false };

const FONT = s => `700 ${s}px Aurora, Anton, sans-serif`;
const linesOf = n => n.split('\n');
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const byName = n => balls.find(b => b.name === n && !b.temp);
const isRival = b => b.name === 'ALEXIS' || b.name === 'KRYSTLE';
const anchorAt = (r, c) => anchors.find(a => a.r === r && a.c === c);

// ── layout: the grid follows the window ──────────────────────────
function measureBall(b) {
  const s = FS * (b.scale || 1) * (b.born == null ? 1 : Math.max(0.05, b.born));
  ctx.font = FONT(s);
  const ls = linesOf(b.name);
  b.fs = s; b.lh = s * 0.92;
  b.hw = Math.max(...ls.map(l => ctx.measureText(l).width)) / 2;
  const m = ctx.measureText(ls[0]);
  b.th = (m.actualBoundingBoxDescent || s * 0.75) + b.lh * (ls.length - 1);
}
function measureFont() {
  ctx.font = FONT(100);
  let w = 1;
  CAST.forEach(n => linesOf(n).forEach(l => { w = Math.max(w, ctx.measureText(l).width); }));
  FS = 100 * SPX * 1.15 * CFG.text / w;
  balls.forEach(measureBall);
}
function layout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gap = Math.min(CFG.gap, Math.max(60, W / 5.5));   // narrow screens always get at least 5–6 columns
  COLS = Math.max(3, Math.round(W / gap));
  ROWS = Math.max(4, Math.round(H / gap));
  SPX = W / COLS; SPY = H / ROWS;
  U = (SPX + SPY) / 2 / 215; G = 1500 * U; PUMP = 1000 * U;
  anchors = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) anchors.push({ x: SPX / 2 + c * SPX, y: SPY / 2 + r * SPY, c, r });
  measureFont();
  scenes.slice().forEach(sc => endScene(sc, true));
  endDuel(2);
  follows.length = 0;
  balls.forEach(b => {
    if (b.temp) return;
    b.rope = null; b.pending = null; b.goal = null; b.winch = 0; b.goalRelease = false; b.home = null; b.hop = null;
    b.x = clamp(b.x, b.hw, W - b.hw); b.y = clamp(b.y, 0, Math.max(0, H - b.th));
  });
}

function makeBall(name, i) {
  const b = {
    name, x: W * (0.1 + 0.8 * ((i * 0.618) % 1)), y: H * rnd(0.05, 0.4),
    vx: rnd(-120, 120) * U, vy: 0, rope: null, pending: null, goal: null,
    hookT: 0, freeT: 0, freeWait: 0.2 + i * 0.18, dir: i % 2 ? -1 : 1, stallT: 0, tilt: 0,
  };
  measureBall(b);
  return b;
}

// ── grid helpers ─────────────────────────────────────────────────
const taken = (a, self) => balls.some(b => b !== self && ((b.rope && b.rope.anchor === a) || (b.pending && b.pending.anchor === a) || (b.busy && b.goal === a)));
const nearRival = p => balls.some(r => isRival(r) && !r.busy && [r, r.goal, r.rope && r.rope.anchor].some(q => q && Math.abs(p.x - q.x) < SPX * 1.15 && Math.abs(p.y - q.y) < SPY * 1.1));
const crowded = (a, b) => balls.some(o => o !== b && !isRival(o) && !o.temp && o.rope && o.rope.anchor.r === a.r && Math.abs(o.rope.anchor.c - a.c) <= 1);
function inSceneOf(sc, p) {
  const s = sc.spot;
  if (sc.path && sc.path.some(a => Math.abs(p.x - a.x) < SPX * 1.2 && Math.abs(p.y - a.y) < SPY * 1.1)) return true;
  if (sc.low) return Math.abs(p.x - s.x) < SPX * 2.2 && p.y > s.y - SPY * 2.2;
  return Math.abs(p.x - s.x) < SPX * 2.1 && Math.abs(p.y - s.y) < SPY * 1.6;
}
const inScene = (p, except) => scenes.some(sc => sc !== except && inSceneOf(sc, p));
const sceneAt = p => scenes.find(sc => inSceneOf(sc, p));

// ── physics ──────────────────────────────────────────────────────
function collide(b) {
  const hw = b.hw, th = b.th;
  if (b.x < hw) { b.x = hw; b.vx = Math.abs(b.vx) * REST; }
  if (b.x > W - hw) { b.x = W - hw; b.vx = -Math.abs(b.vx) * REST; }
  if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy) * REST; }
  if (b.y > H - th) { b.y = H - th; b.vy = -Math.abs(b.vy) * REST; b.vx *= 0.985; }
}
function step(b, dt, ghost) {
  b.vy += G * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  const rope = b.rope;
  if (rope) {
    rope.t += dt;
    const k = Math.min(1, rope.t / TUG_T);
    rope.L = rope.L0 * (1 - TUG * (1 - Math.pow(1 - k, 2)));
    if (b.winch && !ghost) { rope.L0 = Math.max(SPY * 0.6, rope.L0 - b.winch * U * dt); rope.L = Math.min(rope.L, rope.L0); }
    const dx = b.x - rope.anchor.x, dy = b.y - rope.anchor.y, d = Math.hypot(dx, dy) || 0.001;
    const sp = Math.hypot(b.vx, b.vy);
    const cap = b.holdCap || Infinity;
    if (!b.calm && sp > 20 * U && rope.t > 0.15 && sp < cap) { b.vx += (b.vx / sp) * PUMP * dt; b.vy += (b.vy / sp) * PUMP * dt; }
    if (d > rope.L) {
      const nx = dx / d, ny = dy / d;
      b.x = rope.anchor.x + nx * rope.L;
      b.y = rope.anchor.y + ny * rope.L;
      const vr = b.vx * nx + b.vy * ny;
      if (vr > 0) { b.vx -= vr * nx; b.vy -= vr * ny; }
    }
  }
  collide(b);
}

// ── choosing where to throw the rope ─────────────────────────────
function pickToward(b, goal) {
  const dg = dist(b, goal);
  if (b.rush && !taken(goal, b) && dg > 100 * U) return goal;
  if (!taken(goal, b) && dg > 100 * U && dg < 700 * U && goal.y < b.y + 300 * U && Math.abs(goal.x - b.x) > 20 * U) return goal;
  let best = null, bs = Infinity;
  for (const a of anchors) {
    if (taken(a, b) || (!b.busy && inScene(a))) continue;
    const d = dist(a, b), dy = a.y - b.y;
    if (d < 130 * U || d > 520 * U || dy > 120 * U || Math.abs(a.x - b.x) < 30 * U) continue;
    const s = dist(a, goal) / (200 * U) + Math.abs(d - 280 * U) / (400 * U) + Math.random() * 0.25;
    if (s < bs) { bs = s; best = a; }
  }
  return best;
}
function pickWander(b, strict) {
  const zone = duel.phase !== 'truce' && duel.waiter ? { x: duel.waiter.x, y: duel.waiter.y } : null;
  const rival = isRival(b) ? balls.find(o => o !== b && isRival(o)) : null;
  const aff = AFF[b.name] || {};
  const others = Object.keys(aff).map(n => [byName(n), aff[n]]).filter(p => p[0]);
  let best = null, bs = Infinity;
  for (const a of anchors) {
    if (taken(a, b)) continue;
    if (!b.busy && inScene(a)) continue;
    if (strict && !isRival(b) && (nearRival(a) || crowded(a, b))) continue;
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
    const high = b.y < H * 0.42;
    if (dy > (high ? 60 : -40) * U) continue;
    const maxL = (rival ? 520 : 400) * U, ideal = (rival ? 240 : 220) * U;
    if (d < 100 * U || d > maxL || Math.abs(dx) < 30 * U) continue;
    let s = Math.abs(d - ideal) / ideal;
    s -= (dx * b.dir > 0 ? 1.2 : 0);
    s -= (-dy / H) * (b.y > H * 0.55 ? 3 : 1.6);
    if (zone && !rival) { const dz = dist(a, zone); if (dz < 430 * U) s += (430 * U - dz) / (110 * U); }
    if (rival && duel.phase === 'truce') s -= Math.min(dist(a, rival), 900 * U) / (400 * U);
    for (const [o, w] of others) {
      const dd = dist(a, o);
      s += w > 0 ? w * dd / (600 * U) : -w * Math.max(0, 500 * U - dd) / (250 * U);
    }
    if (seek && seek.pair.includes(b)) { const o = seek.pair[0] === b ? seek.pair[1] : seek.pair[0]; s += dist(a, o) / (140 * U); }
    s += Math.random() * 0.6;
    if (s < bs) { bs = s; best = a; }
  }
  if (!best && strict) return pickWander(b, false);
  return best;
}

// ── calm: at rest every name hangs from its own dot, swaying a little ──
// Nothing happens on its own except, now and then, one name hopping to a free dot next to it.
const HOME_L = () => SPY * 0.42;
const isCalm = b => !(b.busy || b.role || b.temp || b.goal || b.kin || b.dragged || b.stairs || b.tether || b.leaving);
const hangPos = a => ({ x: a.x, y: a.y + HOME_L() });
function homeOk(a, self) {
  if (a.r > ROWS - 2) return false;
  if (self && (a.x - self.hw < 6 || a.x + self.hw > W - 6)) return false;   // the whole name stays on screen
  if (inScene(hangPos(a))) return false;
  if (duel.post && dist(a, duel.post) < SPX * 1.5) return false;
  return !balls.some(o => {
    if (o === self || o.leaving || o.temp) return false;
    const held = [o.home];
    if (!isCalm(o)) held.push(o.goal, o.rope && o.rope.anchor, o.pending && o.pending.anchor);
    return held.some(h => h && h.r === a.r && Math.abs(h.c - a.c) < 2);
  });
}
function pickHome(b) {
  let best = null, bs = Infinity;
  for (const a of anchors) {
    if (!homeOk(a, b)) continue;
    const d = dist(b, hangPos(a)) + (a.y > b.y ? SPY * 0.5 : 0);
    if (d < bs) { bs = d; best = a; }
  }
  return best;
}
function startHop(b, a) {
  b.home = a; b.pending = null;
  b.hop = { fx: b.x, fy: b.y, t: 0, dur: clamp(dist(b, hangPos(a)) / (SPX * 0.9), 1.1, 2.6) };
}
function setHanging(b) {
  b.rope = { anchor: b.home, L0: HOME_L() / (1 - TUG), L: HOME_L(), t: 1 };
  if (!b.sway) b.sway = rnd(0.12, 0.22);
}
function calmStep(b, dt) {
  if (!b.home || (!b.hop && !homeOk(b.home, b))) {
    const h = pickHome(b);
    if (!h) { b.home = null; for (let i = 0; i < 4; i++) step(b, dt / 4); return; }
    startHop(b, h);
  }
  if (b.hop) {   // a smooth glide to the new dot, its rope already tied there
    const h = b.hop; h.t += dt;
    const u = Math.min(1, h.t / h.dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const T = hangPos(b.home);
    const nx = h.fx + (T.x - h.fx) * e, ny = h.fy + (T.y - h.fy) * e - Math.sin(Math.PI * u) * SPY * 0.25;
    if (dt > 0) { b.vx = (nx - b.x) / dt; b.vy = (ny - b.y) / dt; }
    b.x = nx; b.y = ny;
    b.calmTilt = clamp(-b.vx / (2500 * U), -0.25, 0.25);
    const d = dist(b, b.home);
    b.rope = { anchor: b.home, L0: d / (1 - TUG), L: d, t: 1 };
    if (u >= 1) { b.hop = null; b.vx = clamp(b.vx, -90 * U, 90 * U); b.vy = 0; setHanging(b); if (b.visit) arrive(b); }
    return;
  }
  if (!b.rope || b.rope.anchor !== b.home) { startHop(b, b.home); return; }
  b.rope.L0 = HOME_L() / (1 - TUG); b.rope.t = Math.max(b.rope.t, 1);
  for (let i = 0; i < 4; i++) step(b, dt / 4);
  // keep the sway small: damp it when it's big, nudge it when it dies out
  const a = b.home, L = Math.max(1, b.rope.L), th = Math.atan2(b.x - a.x, b.y - a.y), w = Math.sqrt(G / L);
  const vt = b.vx * Math.cos(th) - b.vy * Math.sin(th);
  const amp = Math.hypot(th, vt / (L * w)), target = b.sway || 0.05;
  if (amp < target * 0.15) b.vx += (Math.random() < 0.5 ? -1 : 1) * L * w * target * 0.6;
  else { const k = clamp((target - amp) / target, -1, 1) * dt * 1.6; b.vx *= 1 + k; b.vy *= 1 + k; }
  b.calmTilt = -th * 0.5;
}
// now and then one name hops to a free dot next to it, without touching anyone
let moveT = 0.8;
function clearPath(b, T) {
  for (let k = 1; k <= 10; k++) {
    const u = k / 10;
    const g = { x: b.x + (T.x - b.x) * u, y: b.y + (T.y - b.y) * u - Math.sin(Math.PI * u) * SPY * 0.25, hw: b.hw + 10 * U, th: b.th + 10 * U };
    if (balls.some(o => o !== b && !o.leaving && boxes(g, o))) return false;
  }
  return true;
}
function idleMoves(dt) {
  moveT -= dt;
  if (moveT > 0) return;
  moveT = rnd(0.35, 1.0);   // calm, but always someone on the move
  const cand = balls.filter(b => isCalm(b) && !b.hop && !b.visit && b.home && b.rope && b.rope.anchor === b.home).sort(() => Math.random() - 0.5);
  for (const b of cand) {
    const opts = anchors.filter(a => a !== b.home && Math.abs(a.r - b.home.r) <= 1 && Math.abs(a.c - b.home.c) <= 1 && homeOk(a, b) && clearPath(b, hangPos(a)));
    if (opts.length) { startHop(b, opts[Math.floor(Math.random() * opts.length)]); return; }
  }
}
function placeAll() {   // the opening: everyone already hanging, still, each from its own dot
  balls.slice().sort(() => Math.random() - 0.5).forEach(b => {
    b.home = null;
    const opts = anchors.filter(a => homeOk(a, b) && a.r >= 1);
    const a = opts[Math.floor(Math.random() * opts.length)];
    if (!a) return;
    b.home = a; b.sway = rnd(0.12, 0.22);
    const th = rnd(-1, 1) * b.sway;
    b.x = a.x + Math.sin(th) * HOME_L(); b.y = a.y + Math.cos(th) * HOME_L();
    b.vx = 0; b.vy = 0; b.hop = null; b.pending = null; b.goal = null;
    setHanging(b);
  });
}

// ── one name, one frame ──────────────────────────────────────────
function advance(b, dt) {
  if (b.temp) {
    b.born = Math.min(1, (b.born || 0) + dt * 2.5);
    b.life -= dt;
    if (b.life <= 0 && !b.leaving) { b.leaving = true; b.tether = null; }
    if (b.leaving) { b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt; return; }
  }
  if (b.kin) return;   // positioned by its scene (Alexis and Cecil)
  if (b.dragged) {   // held by the visitor: follows the pointer, no rope
    const d = drag;

function letGo() {
  const b = drag.b;
  b.dragged = false;
  const sp = Math.hypot(drag.vx, drag.vy), max = 2400 * U;
  b.vx = sp > max ? drag.vx * max / sp : drag.vx;
  b.vy = sp > max ? drag.vy * max / sp : drag.vy;
  b.freeT = 0; b.freeWait = 0.35; b.stallT = 0;
  drag = null;
  // who is she next to?
  const cy = b.y + b.th / 2;
  let other = null, best = SPX * 1.8;
  balls.forEach(o => {
    if (o === b || o.temp) return;
    const d = Math.hypot(o.x - b.x, o.y + o.th / 2 - cy);
    if (d < best) { best = d; other = o; }
  });
  if (!other) return;
  if (isRival(other)) {   // dropped by her rival: straight into the fight (it wins over whatever she was in)
    [b, other].forEach(o => { if (o.scene) endScene(o.scene, true); });
    duel.hunter = b; duel.waiter = other; duel.hits = 0; duel.super = false;
    duel.goal = DUEL_HITS[0] + Math.floor(Math.random() * (DUEL_HITS[1] - DUEL_HITS[0] + 1));
    launch(b, other);
    return;
  }
  const sc = SCENES.find(s => (s.a === b.name && s.b === other.name) || (s.b === b.name && s.a === other.name));
  if (!sc || (sc.baby && balls.some(o => o.temp))) return;
  [b, other].forEach(o => { if (o.scene) endScene(o.scene, true); });
  cool[sc.id] = 0; rest[sc.a] = rest[sc.b] = 0;
  startScene(sc, byName(sc.a), byName(sc.b));
}
const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
// Tap a name: it goes looking for someone it has a scene with (picked at random) and the scene plays.
let press = null;
const isOccupied = o => !!(o.busy || o.role || o.kin || o.stairs || o.dragged);
const companion = o => o.scene ? (o.scene.A === o ? o.scene.B : o.scene.A)
  : o.role ? byName(o.name === 'ALEXIS' ? 'KRYSTLE' : 'ALEXIS') : null;
const DARLING = n => "OH DARLING,\nI'M WITH " + n.replace('\n', ' ');
let darlings = [];   // lines waiting until the one who says them isn't mid-sentence
function play(b, pick) {
  if (pick.duel) { startStandoff(byName('ALEXIS'), byName('KRYSTLE')); return; }
  const sc = pick.sc;
  cool[sc.id] = 0; rest[sc.a] = rest[sc.b] = 0;
  startScene(sc, byName(sc.a), byName(sc.b), pick.o);
}
function tap(b) {
  if (isOccupied(b) || b.temp || b.visit) return;
  // anyone it has a scene with, busy or not
  const opts = SCENES.filter(sc => {
    if (sc.a !== b.name && sc.b !== b.name) return false;
    const o = byName(sc.a === b.name ? sc.b : sc.a);
    if (!o || o.leaving) return false;
    if (sc.baby && balls.some(t => t.temp)) return false;
    return true;
  }).map(sc => ({ sc, o: byName(sc.a === b.name ? sc.b : sc.a) }));
  if (isRival(b)) { const o = byName(b.name === 'ALEXIS' ? 'KRYSTLE' : 'ALEXIS'); if (o) opts.push({ duel: true, o }); }
  if (!opts.length) return;
  const pick = opts[Math.floor(Math.random() * opts.length)];
  const free = !isOccupied(pick.o) && !(pick.duel && duel.phase !== 'truce');
  if (free) { play(b, pick); return; }
  // the one it wants is busy: it goes over anyway, and gets brushed off
  let best = null, bs = Infinity;
  for (const a of anchors) { if (!homeOk(a, b)) continue; const d = dist(hangPos(a), pick.o); if (d < bs) { bs = d; best = a; } }
  b.visit = pick;
  if (best) startHop(b, best); else arrive(b);
}
function arrive(b) {
  const pick = b.visit; b.visit = null;
  if (!pick || balls.indexOf(pick.o) < 0) return;
  const o = pick.o;
  if (!isOccupied(o) && !(pick.duel && duel.phase !== 'truce') && isCalm(b)) { play(b, pick); return; }   // free by now: their scene
  const w = companion(o);
  darlings.push({ o, text: DARLING(w ? w.name : 'SOMEONE'), t: 6 });
}
function darlingStep(dt) {
  for (let i = darlings.length - 1; i >= 0; i--) {
    const d = darlings[i]; d.t -= dt;
    if (balls.indexOf(d.o) < 0 || d.t <= 0) { darlings.splice(i, 1); continue; }
    if (talking(d.o) || (d.o.scene && quips.some(q => q.scene === d.o.scene)) || (d.o.role && quips.some(q => q.duel))) continue;   // wait for a gap in the conversation
    say(d.o, d.text, d.o.scene || null);   // the scene waits for it, then carries on
    darlings.splice(i, 1);
  }
}
cv.addEventListener('pointerdown', e => {
  const [x, y] = pt(e), b = hitTest(x, y);
  if (!b) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  press = { b, x, y };
});
cv.addEventListener('pointermove', e => {
  const [x, y] = pt(e);
  if (press && !drag && Math.hypot(x - press.x, y - press.y) > 12 && GRABBABLE.includes(press.b.name)) {
    grab(press.b, press.x, press.y); cv.style.cursor = 'grabbing'; press = null;
  }
  if (!drag) { cv.style.cursor = hitTest(x, y) ? 'pointer' : ''; return; }
  const now = performance.now(), dt = Math.max(0.008, (now - drag.lt) / 1000);
  drag.vx = drag.vx * 0.5 + (x - drag.lx) / dt * 0.5;
  drag.vy = drag.vy * 0.5 + (y - drag.ly) / dt * 0.5;
  drag.x = x; drag.y = y; drag.lx = x; drag.ly = y; drag.lt = now;
});
const release = () => { if (drag) letGo(); else if (press) tap(press.b); press = null; cv.style.cursor = ''; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

// ── settings panel (key A) ───────────────────────────────────────
const panel = document.getElementById('panel');
const fmt = { gap: v => v + ' px', text: v => v.toFixed(2) + '×', speed: v => v.toFixed(2) + '×' };
['gap', 'text', 'speed'].forEach(k => {
  const el = document.getElementById(k), out = document.getElementById(k + 'V');
  el.value = CFG[k]; out.textContent = fmt[k](CFG[k]);
  el.addEventListener('input', () => {
    CFG[k] = parseFloat(el.value); out.textContent = fmt[k](CFG[k]); saveCfg();
    if (k === 'gap') layout();
    if (k === 'text') measureFont();
  });
});
window.addEventListener('keydown', e => { if (e.key === 'a' || e.key === 'A') panel.hidden = !panel.hidden; });

let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 150); });

layout();
CAST.forEach((n, i) => balls.push(makeBall(n, i)));
placeAll();
if (document.fonts) {
  document.fonts.load('700 100px Aurora').then(measureFont).catch(() => {});
  document.fonts.load('700 100px Anton').then(measureFont).catch(() => {});
  document.fonts.ready.then(measureFont);
}
requestAnimationFrame(frame);
})();
</script>
