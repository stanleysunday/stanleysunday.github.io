<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>rana</title>
<meta property="og:title" content="rana">
<link rel="icon" href="/favicon.ico">
<style>
/* Layout: pantalla completa en píxeles grandes. Arriba cielo, en medio la laguna con nenúfares, a los lados vegetación,
   abajo la rana vista desde arriba sobre su nenúfar. Debajo, una franja de barro con el mando de girar y el botón de la lengua */
:root{ --barro:#3b2a17; --borde:#7a5c33; --palo:#efe3cb; --lengua:#e2607a; --font:"Space Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c2a14;overflow:hidden}
:root{padding:0!important}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
.back{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;color:#f4ecd8;background:rgba(20,30,15,.75);padding:2px 5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.mandos{position:fixed;left:0;right:0;bottom:0;height:var(--banda,150px);padding:8px 26px env(safe-area-inset-bottom,0px);
  display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}
.mandos>*{pointer-events:auto}
#mando{position:relative;width:118px;height:64px;border-radius:3px;background:#1d140b;touch-action:none;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,240,210,.15),0 0 0 3px var(--borde)}
#mando::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;background:#0d0905;border-radius:2px}
#palo{position:absolute;left:50%;top:50%;width:22px;height:36px;margin:-18px 0 0 -11px;border-radius:2px;background:var(--palo);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);will-change:transform}
#comidos{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:3px;background:#1d140b;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.55),0 0 0 3px var(--borde);color:#ffe27a;min-width:70px}
#comidos small{font:700 9px var(--font);letter-spacing:.16em;text-transform:uppercase;color:#cdb58a}
#comidos span{font:700 30px/1 var(--font);font-variant-numeric:tabular-nums}
#lengua{width:84px;height:64px;border-radius:3px;border:0;background:#1d140b;cursor:pointer;touch-action:none;padding:0;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,240,210,.15),0 0 0 3px var(--borde)}
#lengua::after{content:"";display:block;width:44px;height:32px;margin:auto;border-radius:2px;background:var(--lengua);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#lengua.salto{position:relative}
#lengua.salto{background:#4caf3a;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 3px var(--borde)}
#lengua.salto::after{display:none}
#lengua.salto.dn{box-shadow:inset 0 -1px 0 rgba(0,0,0,.25),0 0 0 3px var(--borde)}
#lengua.salto::before{content:"";position:absolute;left:6px;bottom:8px;height:4px;width:calc((100% - 12px) * var(--queda,1));background:#1d5a14}
#lengua.dn::after{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
#cartel{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);z-index:3;width:min(88vw,360px);padding:16px 20px;box-sizing:border-box;
  background:#5a3a1c;border:3px solid #2b1a0b;box-shadow:inset 0 0 0 2px #8a5e30,0 4px 0 rgba(0,0,0,.35);color:#ffe9b8;
  font:700 18px/1.35 var(--font);text-align:center;letter-spacing:.02em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#nota{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-6px);z-index:3;max-width:min(86vw,330px);padding:7px 12px;box-sizing:border-box;
  background:rgba(29,20,11,.88);border:2px solid #7a5c33;color:#ffe9b8;font:700 13px/1.3 var(--font);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#nota.ve{opacity:1;transform:translate(-50%,0)}
#cartel.ve{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cartel b{display:block;color:#ffe27a;font-size:22px;margin-bottom:6px}
#otra{position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:3;height:44px;padding:0 18px;border:3px solid var(--borde);background:#1d140b;color:#ffe27a;
  font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:focus-visible,#mando:focus-visible{outline:3px solid #f4ecd8;outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
<canvas id="c" aria-label="Juego de la rana que caza hadas"></canvas>
<a class="back" href="/">← volver</a>
<div class="mandos">
  <div id="mando" role="slider" tabindex="0" aria-label="Gira la cabeza de la rana" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div id="palo"></div></div>
  <div id="comidos" aria-live="polite"><small>comidos</small><span id="numComidos">0</span></div>
  <button id="lengua" aria-label="Sacar la lengua"></button>
</div>
<div id="cartel" role="status" aria-live="polite"></div>
<div id="nota" aria-live="polite"></div>
<button id="otra" hidden>Otra vez</button>

<script>
const cv=document.getElementById('c'), g=cv.getContext('2d',{alpha:false});
const numComidos=document.getElementById('numComidos'), mando=document.getElementById('mando'), palo=document.getElementById('palo'), boton=document.getElementById('lengua');
let W=112,H=200,S=1,DPR=1,FONDO=150,HORIZ=60,BANDA=150;
const lerp=(a,b,k)=>a+(b-a)*k, azar=(a,b)=>a+Math.random()*(b-a), cl=(v,a,b)=>Math.max(a,Math.min(b,v));

let ARRIBA=3;
const sonda=document.createElement('div');sonda.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top,0px);width:1px;visibility:hidden';document.body.appendChild(sonda);
function ajusta(){
  DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(innerWidth*DPR); cv.height=Math.round(innerHeight*DPR);
  S=Math.max(1,Math.round(cv.width/112)); W=cv.width/S; H=cv.height/S;   // cada píxel lógico, un tamaño entero en pantalla
  BANDA=Math.min(170,Math.max(130,innerHeight*.2)); document.documentElement.style.setProperty('--banda',BANDA+'px');
  FONDO=Math.round(H-BANDA*DPR/S); HORIZ=Math.round(FONDO*.36);
  ARRIBA=3+Math.ceil(sonda.getBoundingClientRect().height*DPR/S);
  hazEscena();
}
/* EP: mientras se dibuja un hado, sus píxeles son algo más pequeños que los del resto (pero siguen siendo enteros y nítidos) */
let EP=null; const ESCALA_HADO=.8;
function R(x,y,w,h,c){g.fillStyle=c;if(EP){g.fillRect(EP.ox+(Math.round(x)-EP.cx)*EP.sp,EP.oy+(Math.round(y)-EP.cy)*EP.sp,Math.max(1,Math.round(w))*EP.sp,Math.max(1,Math.round(h))*EP.sp);return;}g.fillRect(Math.round(x)*S,Math.round(y)*S,Math.max(1,Math.round(w))*S,Math.max(1,Math.round(h))*S);}
const P1=(x,y,c)=>R(Math.round(x),Math.round(y),1,1,c);
// elipse girada, píxel a píxel; color(u,v) recibe coordenadas normalizadas (-1..1)
function elipse(cx,cy,rx,ry,rot,color){const cs=Math.cos(rot),sn=Math.sin(rot),m=Math.ceil(Math.max(rx,ry))+1;
  for(let y=Math.floor(cy-m);y<=cy+m;y++)for(let x=Math.floor(cx-m);x<=cx+m;x++){
    const X=x+.5-cx,Y=y+.5-cy,u=(X*cs+Y*sn)/rx,v=(-X*sn+Y*cs)/ry;if(u*u+v*v>1)continue;const c=color(u,v);if(c)R(x,y,1,1,c);}}
function linea(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<600;n++){R(x0,y0,1,1,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
const FUENTE={'/':'001001010100100','0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
 '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111'};
function numero(t,x,y,c,e=1){[...t].forEach((ch,k)=>{const f=FUENTE[ch];for(let i=0;i<15;i++)if(f[i]==='1')R(x+(k*4+(i%3))*e,y+Math.floor(i/3)*e,e,e,c);});}

// ── sonido
let ac=null;function blip(f,d,tipo='square',vol=.09,fin=f*.5){try{if(!ac||ac.state!=='running')return;
  const o=ac.createOscillator(),v=ac.createGain();o.type=tipo;o.frequency.setValueAtTime(f,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,fin),ac.currentTime+d);v.gain.setValueAtTime(vol,ac.currentTime);
  v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
/* nota con envolvente y filtro (para la música), ruido filtrado (sierra, chorro) y tambor */
function nota(f,ini,d,tipo='sawtooth',vol=.03,corte=1600){try{if(!ac||ac.state!=='running')return;const t0=ac.currentTime+ini;
  const o=ac.createOscillator(),v=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=corte;o.type=tipo;o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t0);v.gain.linearRampToValueAtTime(vol,t0+.05);v.gain.setValueAtTime(vol,t0+d*.75);v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(fl).connect(v).connect(ac.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
function ruido(ini,d,vol,frec,q=1){try{if(!ac||ac.state!=='running')return;const t0=ac.currentTime+ini,n=Math.ceil(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),v=ac.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=frec;fl.Q.value=q;
  v.gain.setValueAtTime(vol,t0);v.gain.setValueAtTime(vol,t0+d*.6);v.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl).connect(v).connect(ac.destination);s.start(t0);}catch(e){}}
function tambor(ini,vol=.25){try{if(!ac||ac.state!=='running')return;const t0=ac.currentTime+ini,o=ac.createOscillator(),v=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(110,t0);o.frequency.exponentialRampToValueAtTime(42,t0+.45);v.gain.setValueAtTime(vol,t0);v.gain.exponentialRampToValueAtTime(.0001,t0+.6);
  o.connect(v).connect(ac.destination);o.start(t0);o.stop(t0+.65);}catch(e){}ruido(ini,.18,vol*.25,180,.8);}
function metal(f,ini,d,vol=.022){nota(f,ini,d,'sawtooth',vol,1700);nota(f*1.004,ini,d,'sawtooth',vol,1700);nota(f/2,ini,d,'square',vol*.5,900);}
function musicaEpica(){   /* ~7 s: tambores y cuerdas graves mientras sube la espada, fanfarria al resplandecer */
  nota(73.4,0,3.6,'sawtooth',.05,500); nota(110,0,3.6,'sawtooth',.035,500);
  [0,1,2,2.5,3,3.25,3.38].forEach((s,i)=>tambor(s,.12+i*.03));
  [[293.7,.5,.5],[440,1,.5],[587.3,1.5,.9],[523.3,2.4,.25],[466.2,2.65,.25],[440,2.9,.6]].forEach(([f,s,d])=>metal(f,s,d));
  [[233.1,293.7,349.2,466.2],[261.6,329.6,392,523.3]].forEach((ac_,i)=>ac_.forEach((f,j)=>metal(f,3.5+i*.6,.6,j===3?.024:.016)));
  nota(58.3,3.5,.6,'sawtooth',.05,400); nota(65.4,4.1,.6,'sawtooth',.05,400);
  [293.7,370,440,587.3].forEach((f,j)=>metal(f,4.7,2.6,j===3?.026:.017)); nota(73.4,4.7,2.6,'sawtooth',.06,400);
  [3.5,4.1,4.7,4.85,5].forEach(s=>tambor(s,.3)); ruido(4.7,1.8,.05,6000,.5);
}
// el móvil solo deja sonar si el audio se arranca con un toque: lo despertamos en el primer toque y en cada uno
function despiertaAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();
  const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,despiertaAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')ac.resume().catch(()=>{});});

// ── escena fija: nenúfares de la laguna y vegetación de los lados (se recalcula al cambiar el tamaño)
let NENU=[], HOJAS=[], JUNCOS=[];
function hazEscena(){
  let sem=7; const rnd=()=>{sem=(sem*9301+49297)%233280;return sem/233280;};
  NENU=[]; for(let i=0;i<9;i++){const y=lerp(HORIZ+6,FONDO-30,rnd()), k=(y-HORIZ)/(FONDO-HORIZ);   // más grandes cuanto más cerca
    NENU.push({x:lerp(14,W-14,rnd()),y,rx:3+k*8,ry:1.4+k*3.2,flor:rnd()<.4,giro:rnd()*6});}
  HOJAS=[]; for(const lado of [-1,1])for(let i=0;i<7;i++){const y=lerp(HORIZ-6,FONDO+4,i/6)+rnd()*6;
    HOJAS.push({x:lado<0?rnd()*6-1:W-rnd()*6+1,y,rx:9+rnd()*6,ry:3+rnd()*2,rot:lado*(-.5-rnd()*.6),c:rnd()<.5?'#3f8a32':'#2f6e28',lado});}
  JUNCOS=[]; for(const lado of [-1,1])for(let i=0;i<5;i++)JUNCOS.push({x:lado<0?3+i*2.5+rnd()*2:W-3-i*2.5-rnd()*2,base:HORIZ+8+rnd()*10,alto:20+rnd()*16});
}
const CIELO=['#7ec8f0','#93d3f2','#a9ddf3','#c2e7f2','#d9efef'];
function dibujaFondo(t){
  const bh=HORIZ/CIELO.length; CIELO.forEach((c,i)=>R(0,i*bh,W,bh+1,c));
  // nubes
  for(const [x0,y0,v] of [[20,9,.05],[70,17,.03],[95,6,.04]]){const x=((x0+t*v*60)%(W+30))-15;
    for(const [dx,dy,rx] of [[0,0,6],[5,-2,5],[10,0,6]])elipse(x+dx,y0+dy,rx,2.6,0,()=> '#ffffff');}
  // árboles lejanos en la otra orilla
  for(let x=0;x<W;x++){const h=Math.round(4+Math.sin(x*.31)*1.5+Math.sin(x*.9)*1.2);R(x,HORIZ-h,1,h,'#4f8d48');}
  // agua, más oscura hacia delante, con brillos que se mueven
  const agua=['#5aa6b4','#4f99a8','#468c9c','#3d7f8f','#357384','#2e6779'], ah=(FONDO-HORIZ)/agua.length;
  agua.forEach((c,i)=>R(0,HORIZ+i*ah,W,ah+1,c));
  for(let i=0;i<22;i++){const y=HORIZ+3+((i*37)%Math.max(1,FONDO-HORIZ-6)), x=((i*53)%(W+20))-10+Math.round(Math.sin(t*.7+i*1.7)*1.5),l=2+(i%4);if(Math.sin(t*1.3+i*2.3)>-.4)R(x,y,l,1,'#8cc9cf');}   // laguna quieta: los brillos tiemblan en su sitio, no corren
  // nenúfares, con muesca y algunos con flor
  NENU.forEach(n=>{elipse(n.x,n.y,n.rx,n.ry,0,(u,v)=>{const a=Math.atan2(v,u);if(Math.abs(((a-n.giro+Math.PI*3)%(Math.PI*2))-Math.PI)<.35)return null;
      return u*u+v*v>.7?'#2f7a3a':(v<-.2?'#58a84a':'#47963f');});
    if(n.flor){const fx=n.x+n.rx*.2,fy=n.y-n.ry*.3;P1(fx,fy-1,'#f6a8c6');P1(fx-1,fy,'#f6a8c6');P1(fx+1,fy,'#f6a8c6');P1(fx,fy,'#ffe27a');}});
}
function dibujaVegetacion(t){
  JUNCOS.forEach(j=>{const sw=Math.sin(t*1.3+j.x)*1.2+Math.sin(t*18+j.x)*4*(j.golpe||0);linea(j.x,j.base,j.x+sw,j.base-j.alto,'#3a6e2a');
    R(Math.round(j.x+sw)-1,Math.round(j.base-j.alto)-1,2,5,'#6b4426');});
  HOJAS.forEach(h=>elipse(h.x,h.y,h.rx,h.ry,h.rot+Math.sin(t*.9+h.y)*.04+Math.sin(t*22+h.y)*.35*(h.golpe||0),(u,v)=>Math.abs(v)<.12?'#7fc25a':(v<0?h.c:'#24561f')));
  // orilla de barro de abajo
  R(0,FONDO,W,H-FONDO,'#3b2a17'); R(0,FONDO,W,1,'#5c4426');
  for(let x=0;x<W;x+=3){const h=2+((x*7)%5);linea(x,FONDO+1,x+((x%2)?1:-1),FONDO-h,'#4c8a35');}
}

// ── la rana, vista desde arriba, sobre su nenúfar
const rana={x:0,y:0,ang:0,lengua:0,estado:'quieta',presa:null,trago:0,dir:0};
const ANG_MAX=1.3;
function casa(){return [W/2,FONDO-11];}
function posRana(){return rana.px==null?casa():[rana.px,rana.py];}
function cuello(){const [x,y]=posRana();return [x,y-6];}
function boca(){const [x,y]=cuello();return [x+Math.sin(rana.ang)*7,y-Math.cos(rana.ang)*7];}
function dibujaRana(t){
  { const [hx,hy]=casa(); elipse(hx,hy+2,20,7,0,(u,v)=>{const a=Math.atan2(v,u);if(a>1.2&&a<1.9)return null;return u*u+v*v>.75?'#2f7a3a':'#47963f';}); }   // su nenúfar, siempre en su sitio
  const [cx,cy]=posRana(), k=rana.escala||1;
  if(rana.px!=null&&k<=1.02){const r=9+Math.sin(t*3)*1;for(let a=0;a<6.28;a+=.35)P1(cx+Math.cos(a)*r*1.4,cy+3+Math.sin(a)*r*.45,'#bfe6ea');}   // en el agua, con ondas
  if(k>1.02){elipse(cx,cy+6+(k-1)*14,8,3,0,()=> '#2e6779');}   // sombra mientras salta
  const sp=Math.max(1,Math.round(S*k));EP=sp!==S?{sp,cx:Math.round(cx),cy:Math.round(cy),ox:Math.round(cx)*S,oy:Math.round(cy)*S}:null;
  try{dibujaRanaCuerpo(t,cx,cy);}finally{EP=null;}
}
function dibujaRanaCuerpo(t,cx,cy){
  const verde='#5fb04a',oscuro='#3f8a32',claro='#8fd06a';
  // patas traseras dobladas y delanteras
  for(const s of [-1,1]){elipse(cx+s*9,cy+4,4,2.5,s*.6,(u,v)=>v<-.3?claro:verde);elipse(cx+s*12,cy+7,4,1.6,s*-.3,()=>oscuro);
    elipse(cx+s*7,cy-6,2.6,1.5,s*-.7,()=>verde);for(let k=-1;k<=1;k++)P1(cx+s*9+k,cy-8+Math.abs(k),oscuro);}
  // cuerpo con manchas
  elipse(cx,cy,7,8.5,0,(u,v)=>{if(((Math.floor((u+1)*5)*7+Math.floor((v+1)*5)*3)%11)===0)return oscuro;return v<-.3&&u<0?claro:verde;});
  // cabeza: gira hacia donde apunta (o ya no está)
  if(rana.sinCabeza){const [nx,ny]=cuello();elipse(nx,ny+1,4.5,2.6,0,(u,v)=>u*u+v*v>.55?'#7a1018':'#c0303a');return;}
  const [nx,ny]=cuello(), a=rana.ang, hx=nx+Math.sin(a)*2, hy=ny-Math.cos(a)*2, hinch=rana.trago>0?1+Math.sin(rana.trago*.5)*.25:1;
  elipse(hx,hy,7*hinch,5.5,a,(u,v)=>v<-.55&&Math.abs(u)<.6?'#3f8a32':(v<-.2?claro:verde));
  for(const s of [-1,1]){const ex=hx+Math.cos(a)*s*5.2+Math.sin(a)*1,ey=hy+Math.sin(a)*s*5.2-Math.cos(a)*1;   // ojos saltones
    elipse(ex,ey,2.4,2.4,0,(u,v)=>u*u+v*v<.35?'#111':(v<-.3?'#fff':'#e9f2c8'));}

    if(D.fase==='cae'&&D.t>.7){D.fase='fin';empiezaAtaque(h,null,'fallo');}
    if(D.fase==='gana'&&D.t>1.3){D.fase='vuelve';D.t=0;D.de=[rana.px,rana.py];
      floresMagicas=0;floresTipos=[];espadaPendiente=false;notaYa('¡Lo cazaste! Las flores mágicas vuelven a cero.',3.5);}}
  else if(D.fase==='vuelve'){const k=Math.min(1,D.t/.7),[hx,hy]=casa();   // vuelve de un salto a su nenúfar
    rana.px=lerp(D.de[0],hx,k);rana.py=lerp(D.de[1],hy,k);rana.escala=1+Math.sin(Math.PI*k)*.35;
    if(k>=1){rana.px=null;rana.py=null;rana.escala=1;duelo=null;proximaEntrada=t+2;ruido(0,.2,.05,900,1);}}
  if(espadaCae){const E=espadaCae;E.vy+=.12;E.y+=E.vy;E.a+=.12;
    if(E.y>=E.suelo){for(let i=0;i<3;i++)avisos.push({x:E.x,y:E.suelo+2,v:14+i*5,onda:true});ruido(0,.25,.06,1200,1);espadaCae=null;}}
}
function dibujaEspadaCae(){if(!espadaCae)return;const E=espadaCae,dx=Math.sin(E.a),dy=-Math.cos(E.a);
  linea(E.x-dx*3,E.y-dy*3,E.x,E.y,'#6b3e1a');linea(E.x-dy*2,E.y+dx*2,E.x+dy*2,E.y-dx*2,'#e2b23a');linea(E.x+dx,E.y+dy,E.x+dx*11,E.y+dy*11,'#dfe6ee');}
function empiezaAtaque(esp,comido,motivo){
  esp.duelo=false;esp.ataca=true; esp.estado='vuela'; ataque={esp,comido,motivo,fase:'baja',t:0,desde:[esp.x,esp.y]}; blip(180,.6,'sawtooth',.07,520);
}
function actualizaAtaque(){
  if(!ataque)return; const A=ataque,E=A.esp; A.t+=1/60; const [nx,ny]=cuello();

    if(k>=1){A.fase='sierra';A.t=0;A.son=0;rana.lengua=0;rana.estado='quieta';}}
  else if(A.fase==='sierra'){   // un segundo serrando el cuello, adelante y atrás

    if(A.t>=A.son){A.son+=.12;ruido(0,.1,.09,1500+s*500,4);blip(150,.08,'sawtooth',.035,95);}
    if(Math.random()<.45)sangre.push({x:nx+azar(-2,2),y:ny,vx:azar(-.5,.5),vy:azar(-1.2,-.2),suelo:ny+azar(2,10),c:Math.random()<.3?'#8a1018':'#d0202c'});
    if(A.t>=1){A.fase='chorro';A.t=0;rana.sinCabeza=true;blip(90,.5,'sawtooth',.12,40);
      cabezaRana={x:nx+Math.sin(rana.ang)*2,y:ny-Math.cos(rana.ang)*2,ang:rana.ang,vx:azar(-.7,.7),vy:-1.3,va:azar(-.1,.1),flota:false};
      ruido(0,2.1,.14,650,.6);ruido(0,2.1,.07,2400,.8);[0,.35,.7,1.05,1.4].forEach(s=>ruido(s,.25,.08,300,1));}}
  else if(A.fase==='chorro'){   // dos segundos de chorro de sangre exagerado, a borbotones
    E.x+=.15;E.y-=.2;E.angEspada=lerp(E.angEspada,-.25,.03);
    const pulso=.8+.2*Math.sin(A.t*18),fin=A.t>1.7?(2-A.t)/.3:1;
    for(let i=0;i<9;i++)sangre.push({x:nx+azar(-1,1),y:ny-1,vx:azar(-.55,.55)+Math.sin(A.t*7)*.35,vy:-azar(3.4,4.6)*pulso*Math.max(.3,fin),suelo:ny+azar(-8,18),c:['#d0202c','#ff3a46','#8a1018','#d0202c'][i%4]});
    if(A.t>=2){A.fase='sale';A.t=0;}}
  else if(A.fase==='sale'){
    E.x+=.6;E.y-=.9;E.angEspada=lerp(E.angEspada,-.25,.05);
    if(Math.random()<.15)sangre.push({x:nx+azar(-1,1),y:ny-1,vx:azar(-.3,.3),vy:azar(-1.4,-.4),suelo:ny+azar(0,8),c:'#d0202c'});
    if(A.t>.15&&!A.salio&&A.comido){A.salio=true;const c=A.comido;c.cogida=false;c.ataca=false;c.x=nx;c.y=ny-2;c.vx=azar(-.5,.5);c.vy=-2.6;c.estado='seVa';c.mira=c.x<W/2?-1:1;
      hadas.push(c);blip(700,.3,'square',.06,1400);for(let i=0;i<14;i++)plumas.push({x:nx,y:ny,vx:azar(-1,1),vy:azar(-1.6,0),c:'#d0202c',v:70});}
    if(A.t>1.4){E.ataca=false;E.estado='seVa';E.mira=1;}
    if(A.t>.9&&!A.cartel){A.cartel=true;cartel(A.motivo==='tarde'?'<b>¡El de la espada ganó el duelo!</b>Tardaste demasiado en saltar.':A.motivo==='fallo'?'<b>¡El de la espada ganó el duelo!</b>Saltaste y fallaste.':'<b>¡Caíste en la trampa de los hados!</b>Te comiste a un compañero y el de la espada acabó contigo.',600000);}
    if(A.t>3&&!finJuego){finJuego=true;document.getElementById('otra').hidden=false;}}
  const C=cabezaRana; if(C){   // la cabeza cae al agua y se queda flotando
    if(!C.flota){C.vy+=.08;C.x+=C.vx;C.y+=C.vy;C.ang+=C.va;if(C.vy>0&&C.y>=ny-16){C.flota=true;C.base=C.y;C.avisos=0;for(let i=0;i<3;i++)avisos.push({x:C.x,y:C.y+4,v:14,onda:true});}}
    else{C.y=C.base+Math.sin(t*2)*.6;C.x+=Math.sin(t*.7)*.04;C.ang+=Math.sin(t*1.3)*.004;if(Math.random()<.02)avisos.push({x:C.x+azar(-6,6),y:C.base+4,v:14,onda:true});}}
}
function dibujaCabezaRana(hx,hy,a,muerta){
  const verde='#5fb04a',claro='#8fd06a';
  elipse(hx,hy,7,5.5,a,(u,v)=>v<-.55&&Math.abs(u)<.6?'#3f8a32':(v<-.2?claro:verde));
  for(const s of [-1,1]){const ex=hx+Math.cos(a)*s*5.2+Math.sin(a)*1,ey=hy+Math.sin(a)*s*5.2-Math.cos(a)*1;
    elipse(ex,ey,2.4,2.4,0,(u,v)=>muerta?(Math.abs(Math.abs(u)-Math.abs(v))<.25?'#111':(v<-.3?'#fff':'#e9f2c8')):(u*u+v*v<.35?'#111':(v<-.3?'#fff':'#e9f2c8')));}
  if(muerta){const bx=hx-Math.sin(a)*5,by=hy+Math.cos(a)*5;elipse(bx,by,3,1.6,a,()=> '#b0202c');}
}
function reinicia(){
  notasDichas=new Set();colaNotas=[];notaEl.classList.remove('ve');
  clearTimeout(cartel.tm);cartelEl.classList.remove('ve');
  floresMagicas=0;espadaPendiente=false;floresTipos=[];chispas=[];excal=null;
  hadas=[];pis=[];charcos=[];plumas=[];polen=[];avisos=[];puntos=0;entradas=0;ataque=null;cabezaRana=null;finJuego=false;sangre=[];manchas=[];avisadoEspada=false;duelo=null;espadaCae=null;
  boton.classList.remove('salto');boton.style.removeProperty('--queda');boton.setAttribute('aria-label','Sacar la lengua');
  Object.assign(rana,{px:null,py:null,escala:1,ang:0,lengua:0,estado:'quieta',presa:null,trago:0,sinCabeza:false});

}
document.getElementById('otra').addEventListener('click',reinicia);

// ── controles// ── controles
let joy=0, joyId=null, teclas={};
function leeMando(e){const r=mando.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),max=r.width/2-18;
  joy=cl(dx/max,-1,1); palo.style.transform=`translateX(${joy*max}px)`; mando.setAttribute('aria-valuenow',joy.toFixed(2));}
mando.addEventListener('pointerdown',e=>{joyId=e.pointerId;mando.setPointerCapture(e.pointerId);leeMando(e);});
mando.addEventListener('pointermove',e=>{if(e.pointerId===joyId)leeMando(e);});
const suelta=e=>{if(e.pointerId!==joyId)return;joyId=null;joy=0;palo.style.transform='';mando.setAttribute('aria-valuenow','0');};
mando.addEventListener('pointerup',suelta);mando.addEventListener('pointercancel',suelta);
boton.addEventListener('pointerdown',e=>{e.preventDefault();boton.classList.add('dn');lanzaLengua();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>boton.addEventListener(ev,()=>boton.classList.remove('dn')));
boton.addEventListener('click',e=>{if(e.detail===0)lanzaLengua();});
addEventListener('keydown',e=>{teclas[e.key]=true;if(e.key===' '){e.preventDefault();lanzaLengua();}if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>teclas[e.key]=false);

// ── bucle
function paso(){
  t+=1/60;
  let v=joy; if(teclas.ArrowLeft)v=-1; if(teclas.ArrowRight)v=1;
  if(!rana.sinCabeza&&!ataque&&(!duelo||duelo.fase==='espera')&&(rana.estado==='quieta'||rana.estado==='vuelve'))rana.ang=cl(rana.ang+v*Math.abs(v)*.016,-ANG_MAX,ANG_MAX);   /* más lento, y suave cerca del centro para afinar */
  actualizaHadas(); actualizaLengua(); actualizaAtaque(); actualizaChispas(); actualizaExcal(); actualizaDuelo(); actualizaBotes(); actualizaNotas();
  if(introAbierta&&t>1&&!cartelEl.classList.contains('ve'))introAbierta=false;
  // el pis cae hasta abajo, hasta el agua de delante
  pis.forEach(p=>{p.vy+=.045;p.x+=p.vx;p.y+=p.vy;p.v--;if(p.y>=p.suelo){p.v=0;if(Math.random()<.3)avisos.push({x:p.x,y:p.suelo,v:14,onda:true});ensucia(p.x,p.suelo);}});
  charcos.forEach(c=>{if(c.limpia){c.limpia-=1/60;c.r-=.06;if(Math.random()<.5)polen.push({x:c.x+azar(-c.r,c.r),y:c.y+azar(-1,1),vx:azar(-.2,.2),vy:azar(-.6,-.2),v:40,f:Math.random()*6,c:Math.random()<.5?'#ffffff':'#c8f0ff'});}});
  charcos=charcos.filter(c=>c.r>.6);
  polen.forEach(p=>{p.vy+=.004;p.vx*=.99;p.x+=p.vx+Math.sin(t*3+p.f)*.25;p.y+=p.vy;p.v--;}); polen=polen.filter(p=>p.v>0);
  pis=pis.filter(p=>p.v>0);
  plumas.forEach(p=>{p.vy+=.02;p.vx*=.97;p.x+=p.vx+Math.sin(t*5+p.y)*.2;p.y+=p.vy;p.v--;}); plumas=plumas.filter(p=>p.v>0);
  sangre.forEach(p=>{p.vy+=.12;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;if(p.vy>0&&p.y>=p.suelo){p.fin=true;if(Math.random()<.25)manchas.push({x:Math.round(p.x),y:Math.round(p.y),v:azar(200,400),c:p.c});}});
  sangre=sangre.filter(p=>!p.fin&&p.y<H+4); manchas.forEach(m=>m.v--); manchas=manchas.filter(m=>m.v>0);
  avisos.forEach(a=>{a.v--;if(!a.onda)a.y-=.3;}); avisos=avisos.filter(a=>a.v>0);
}
function dibuja(){
  dibujaFondo(t);
  dibujaCharcos();
  pis.forEach(p=>P1(p.x,p.y,'#f2dd4a'));
  avisos.filter(a=>a.onda).forEach(a=>{const r=(14-a.v)*.5;R(a.x-r,a.y,1,1,'#bfe6ea');R(a.x+r,a.y,1,1,'#bfe6ea');});
  hadas.filter(h=>!h.cogida&&!h.ataca).forEach(dibujaHada);
  dibujaExcal();
  dibujaVegetacion(t);
  dibujaFlores();
  polen.forEach(p=>{const x=Math.round(p.x),y=Math.round(p.y);if(Math.sin(t*14+p.f)>.2){P1(x,y,p.c);if(p.v%40<10){P1(x-1,y,p.c);P1(x+1,y,p.c);P1(x,y-1,p.c);P1(x,y+1,p.c);}}});
  // punto de mira: donde llegaría la punta de la lengua
  if(rana.estado==='quieta'&&!rana.sinCabeza&&!ataque&&(!duelo||duelo.fase==='espera')){const [mx,my]=boca(),L=Math.min(FONDO-24,96);let px=Math.round(mx+Math.sin(rana.ang)*L),py=Math.round(my-Math.cos(rana.ang)*L);if(duelo){const d=destinoSalto();px=Math.round(d[0]);py=Math.round(d[1]-6);}
    for(const [ox,oy] of [[-2,0],[2,0],[0,-2],[0,2],[-1,-1],[1,-1],[-1,1],[1,1]])P1(px+ox,py+oy,'#5a1a2a');
    const c=peligro()?(Math.floor(t*8)%2?'#ff2a2a':'#ffffff'):(Math.floor(t*4)%2?'#ffffff':'#f59bb0');for(const [ox,oy] of [[0,0],[-1,0],[1,0],[0,-1],[0,1]])P1(px+ox,py+oy,c);}

  dibujaEspadaCae(); dibujaRana(t); dibujaLengua(); if(rana.presa)dibujaHada(rana.presa);
  if(ataque&&ataque.esp.ataca)dibujaHada(ataque.esp);
  plumas.forEach(p=>P1(p.x,p.y,p.c));
  sangre.forEach(p=>R(p.x,p.y,1,p.vy<-1.5?2:1,p.c));
  avisos.filter(a=>!a.onda).forEach(a=>numero('1',Math.round(a.x)-1,Math.round(a.y),'#ffe27a'));
  // contador de flores mágicas
  { const txt=floresMagicas+'/5', w=txt.length*8+16, x0=Math.round(W/2-w/2+boteC.ox), y0=ARRIBA, sy=(saltoContador>0?-Math.round(Math.sin(saltoContador/12*Math.PI)*3):0)+Math.round(boteC.oy);
    R(x0,y0+sy,w,15,'#1d140b'); R(x0,y0+sy,w,1,'#7a5c33'); R(x0,y0+sy+14,w,1,'#7a5c33');
    florGrande(floresTipos.length?floresTipos[floresTipos.length-1]:'margarita',x0+6,y0+7+sy); numero(txt,x0+12,y0+3+sy,floresMagicas>=5?'#ffe27a':'#ffe9b8',2); }
  chispas.forEach(c=>{const x=Math.round(c.px||c.x),y=Math.round(c.py||c.y);florMini(c.tipo,x,y);if(Math.sin(t*20)>0){P1(x-2,y,'#ffffff');P1(x+2,y,'#ffffff');}});
  // hados comidos: en el panel de abajo, entre el mando y el botón
  if(numComidos.textContent!==String(puntos)){numComidos.textContent=puntos;numComidos.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300});}
}
addEventListener('resize',ajusta); ajusta();
nuevaHada(); hadas[0].x=azar(30,W-30); proximaEntrada=3;

let acc=0,ult=performance.now();
function bucle(now){acc+=Math.min(100,now-ult);ult=now;while(acc>=1000/60){paso();acc-=1000/60;}dibuja();requestAnimationFrame(bucle);}
