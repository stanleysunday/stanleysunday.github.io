<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>marcianitos</title>
<meta property="og:title" content="marcianitos">
<link rel="icon" href="/favicon.ico">
<style>
/* Layout: el juego ocupa toda la pantalla, sin marco. Abajo, sobre la franja de tierra, el mando a un lado y el botón de fuego al otro */
:root{
  --tv:#000000; --tierra:#4a3216; --gris:#8a8a8a; --fire:#d8402a; --fire-sombra:#7d2010; --mando:#1a1a1a; --mando-borde:#3a3a3a; --palo:#c9c9c9;
  --font:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tv);overflow:hidden}
:root{padding:0!important}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font)}
#todo{position:fixed;inset:0;will-change:transform}
canvas{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
.back{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(var(--colw,26px) + 6px);color:#d8d8d8;background:#000;padding:2px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.mandos{position:absolute;left:0;right:0;bottom:0;height:var(--banda,150px);padding:var(--losa,10px) 28px env(safe-area-inset-bottom,0px);
  display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}
.mandos>*{pointer-events:auto}
/* mandos mínimos: un círculo para mover (con su punto) y un círculo para disparar */
#mando{position:relative;will-change:transform;width:112px;height:64px;border-radius:3px;background:#2b2117;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,240,210,.18),0 0 0 3px #8c7656;touch-action:none}
#mando::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;background:#140f0a;border-radius:2px}
#palo{position:absolute;left:50%;top:50%;width:22px;height:36px;margin:-18px 0 0 -11px;border-radius:2px;background:#efe3cb;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);will-change:transform}
#fuego{will-change:transform;width:84px;height:64px;border-radius:3px;border:0;background:#2b2117;cursor:pointer;touch-action:none;padding:0;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,240,210,.18),0 0 0 3px #8c7656}
#fuego::after{content:"";display:block;width:44px;height:32px;margin:auto;border-radius:2px;background:#d9472b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#fuego.dn::after{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
#otra{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:3;height:44px;padding:0 18px;border:2px solid #e8a83a;background:#000;color:#e8a83a;
  font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:focus-visible{outline:3px solid var(--gris);outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
<div id="todo">
  <canvas id="c" aria-label="Juego de marcianitos"></canvas>
  <a class="back" href="/">← volver</a>
  <div class="mandos">
    <div id="mando" role="slider" aria-label="Mando: mueve la nave" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div id="palo"></div></div>
    <button id="fuego" aria-label="Disparar"></button>
  </div>
</div>
<button id="otra" hidden>Otra vez</button>
<script>
const cv=document.getElementById('c'), g=cv.getContext('2d',{alpha:false});
const todo=document.getElementById('todo'), mando=document.getElementById('mando'), palo=document.getElementById('palo'), fuego=document.getElementById('fuego');
let W=112;                   // ancho lógico en "píxeles Atari" (se ajusta para que cada píxel tenga un tamaño entero)
let H=200, S=1, SUELO=150, BANDA=150, DPR=1;
const COL={nave:'#e8a83a',bala:'#f4e46a',texto:'#e8a83a',chispa:'#f4e46a',lejos:'#8f8f8f'};
const FILAS=['#e5483a','#f0a830','#e2dc45','#5cc24c','#3fa3e8'];   // de abajo arriba: la fila de abajo cae con 1 disparo… la de arriba con 5
const COLW=5, TECHO=16, SOPORTE=0, LOSA=3;   // marco: pilas de bloques a los lados, techo, grosor del suelo
const PIEDRA={luz:'#f2e6cf',cara:'#e2d0ae',sombra:'#bba57f',junta:'#7a6548'};

function ajusta(){
  DPR=Math.min(3,window.devicePixelRatio||1); const cw=innerWidth, ch=innerHeight;
  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);
  S=Math.max(1,Math.round(cv.width/112)); W=cv.width/S; H=cv.height/S;
  BANDA=Math.min(170,Math.max(130,ch*.2)); document.documentElement.style.setProperty('--banda',BANDA+'px');
  SUELO=Math.round(H-BANDA*DPR/S);
  const css=S/DPR; document.documentElement.style.setProperty('--col',(SOPORTE*css+14)+'px');
  document.documentElement.style.setProperty('--colw',(COLW*css)+'px'); document.documentElement.style.setProperty('--losa',(LOSA*css)+'px');
  if(st&&!st.derrumbe)construye();
  if(st&&st.fase==='juego')st.nave.y=SUELO-NAVE_MITAD;
}

// ── dibujo en píxeles lógicos
function R(x,y,w,h,c){g.fillStyle=c;const x0=Math.round(x*S),y0=Math.round(y*S);g.fillRect(x0,y0,Math.max(1,Math.round((x+w)*S)-x0),Math.max(1,Math.round((y+h)*S)-y0));}
function sprite(rows,x,y,c,rot=0){const h=rows.length,w=rows[0].length,cs=Math.cos(rot),sn=Math.sin(rot);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(rows[j][i]==='X'){const lx=i-w/2+.5,ly=j-h/2+.5;
    R(Math.round(x+lx*cs-ly*sn)-.5,Math.round(y+lx*sn+ly*cs)-.5,1,1,c);}}
const FUENTE={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
 '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
 'G':'111100101101111','A':'010101111101101','M':'101111111101101','E':'111100110100111','O':'111101101101111',
 'V':'101101101101010','R':'110101110101101','P':'110101110100100','U':'101101101101111','L':'100100100100111',
 'S':'111100111001111','F':'111100110100100','N':'101111111111101','T':'111010010010010','I':'111010010010111','D':'110101101101110',' ':'000000000000000'};
function texto(t,x,y,c,e=1){[...t].forEach((ch,k)=>{const f=FUENTE[ch]||FUENTE[' '];
  for(let i=0;i<15;i++)if(f[i]==='1')R(x+k*4*e+(i%3)*e,y+Math.floor(i/3)*e,e,e,c);});}
const ancho=(t,e=1)=>t.length*4*e-e;
const filasDe=ch=>{const f=FUENTE[ch];return [0,1,2,3,4].map(r=>[0,1,2].map(c=>f[r*3+c]==='1'?'X':'.').join(''));};

const NAVE=["........X........","........X........",".......XXX.......",".......XXX.......","......XXXXX......","......XX.XX......","......XXXXX......",".....XXXXXXX.....","..X..XXXXXXX..X..",".XXXXXXXXXXXXXXX.","XXXXXXXXXXXXXXXXX","XXXXXXXXXXXXXXXXX","XX.XX.XXXXX.XX.XX"];
const ROTA=["......X............","..X..XX.X.....X....",".XX.XXXXX...XXX..X.",".XXXXX..XX.XXXXXXX.","XXXXXX..XXXXXXXXXXX","XXXXXXXXXXXXXXXXXXX"];
const NAVE_MITAD=6.5;
const MARC=[["...X....X...","....X..X....","...XXXXXX...","..XX.XX.XX..",".XXXXXXXXXX.",".X.XXXXXX.X.",".X.X....X.X.","....XX.XX..."],
            ["...X....X...",".X..X..X..X.",".X.XXXXXX.X.",".XXX.XX.XXX.",".XXXXXXXXXX.","..XXXXXXXX..","...X....X...","..X......X.."]];
const SUSTO=["X..X....X..X",".X..X..X..X.","...XXXXXX...","..X.XXXX.X..",".XX......XX.",".XXX.XX.XXX.","..X.X..X.X..",".X........X."];

// ── sonido
let ac=null;function blip(f,d,tipo='square',vol=.09,fin=f*.5){try{if(!ac||ac.state!=='running')return;
  const o=ac.createOscillator(),v=ac.createGain();o.type=tipo;o.frequency.setValueAtTime(f,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,fin),ac.currentTime+d);v.gain.setValueAtTime(vol,ac.currentTime);
  v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
// el móvil solo deja sonar si el audio se arranca con un toque: lo despertamos en el primer toque y en cada uno
function despiertaAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();
  const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,despiertaAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')ac.resume().catch(()=>{});});
const lerp=(a,b,k)=>a+(b-a)*k, azar=(a,b)=>a+Math.random()*(b-a);

// ── estado
let st=null;
function nuevo(){
  st={t:0,empezado:false,puntos:0,nave:{x:W/2,y:SUELO-NAVE_MITAD,rot:0,rota:false},balas:[],marc:[],dir:1,anim:0,
      fase:'juego',arana:null,piloto:null,cabeza:null,chispas:[],lluvia:[],temblor:0,fin:false,cool:0,
      piezas:[],cuelga:null,derrumbe:false,dom:{temblor:0,fuego:{x:0,y:0,r:0},mando:null}};
  construye(); oleada(); document.getElementById('otra').hidden=true;
  todo.style.transform=''; fuego.style.transform=''; mando.style.transform='';
}
function oleada(){for(let f=0;f<FILAS.length;f++)for(let i=0;i<5;i++)st.marc.push({x:24+i*16,y:TECHO+10+f*12,c:FILAS[f],vida:FILAS.length-f,flash:0,vivo:true,huida:null});}

// ── el marco: suelo, columnas debajo, pilas de columna-bloque a los lados y techo de cuadraditos con el marcador
function construye(){
  const P=[]; const alto=SUELO-TECHO, n=Math.max(1,Math.round(alto/COLW)), bh=alto/n;
  for(const lado of [0,1]){const x=lado?W-COLW:0;
    for(let k=0;k<n;k++)P.push({t:'piedra',x,y:SUELO-(k+1)*bh,w:COLW,h:bh,lado,k});}
  const tr=8,tw=W/tr; for(let i=0;i<tr;i++)P.push({t:'techo',x:i*tw,y:0,w:tw,h:TECHO,i});
  // pared de bloques bajo el suelo, donde van los mandos
  const fh=8, fw=12; let fila=0;
  for(let y=SUELO+LOSA;y<H+fh;y+=fh,fila++){const off=fila%2?-fw/2:0;for(let x=off;x<W;x+=fw)P.push({t:'muro',x,y,w:fw,h:fh});}
  P.forEach(p=>{p.cae=false;p.vx=0;p.vy=0;p.r=0;p.vr=0;p.cx=p.x+p.w/2;p.cy=p.y+p.h/2;p.dx=0;p.dy=0;p.dyObj=0;});
  st.piezas=P;
}
function bloque(x,y,w,h){   // un bloque de piedra marrón muy claro, con su luz y su sombra
  const F=(a,b,c,d,col)=>{g.fillStyle=col;g.fillRect((x+a)*S,(y+b)*S,c*S,d*S);};
  F(0,0,w,h,PIEDRA.junta);F(.4,.4,w-.8,h-.8,PIEDRA.sombra);F(.4,.4,w-1.4,h-1.4,PIEDRA.luz);F(1,1,w-2,h-2,PIEDRA.cara);
}
function colorPieza(p,u,v){   // u,v: coordenadas dentro de la pieza (0..w, 0..h)
  if(p.t==='techo'){const a=Math.floor(u),b=Math.floor(v);return (a%3===0||b%3===0||a>=Math.floor(p.w)-1||b>=Math.floor(p.h)-1)?PIEDRA.junta:PIEDRA.cara;}
  if(u<1||v<1||u>=p.w-1||v>=p.h-1)return PIEDRA.junta;
  if(u<2||v<2)return PIEDRA.luz; if(u>=p.w-2||v>=p.h-2)return PIEDRA.sombra; return PIEDRA.cara;
}
function dibujaPieza(p){
  const cx=p.cx+p.dx, cy=p.cy+p.dy, cs=Math.cos(p.r), sn=Math.sin(p.r), m=Math.ceil(Math.hypot(p.w,p.h)/2)+1;
  if(Math.abs(p.r)<.02){   // sin girar: rectángulo alineado a la rejilla
    const x0=Math.round(cx-p.w/2), y0=Math.round(cy-p.h/2), w=Math.round(p.w), h=Math.round(p.h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)R(x0+x,y0+y,1,1,colorPieza({...p,w,h},x+.5,y+.5));return;}
  for(let y=Math.floor(cy-m);y<=cy+m;y++)for(let x=Math.floor(cx-m);x<=cx+m;x++){
    const X=x+.5-cx,Y=y+.5-cy,u=X*cs+Y*sn+p.w/2,v=-X*sn+Y*cs+p.h/2;
    if(u<0||v<0||u>=p.w||v>=p.h)continue; R(x,y,1,1,colorPieza(p,u,v));}
}
// el cielo del atardecer, el sol poniéndose y las montañas
const CIELO=['#2a1748','#46205a','#6e2a63','#9c3a5e','#c9535a','#e57a52','#f2a35a','#f7c873'];
function montana(x,semilla,alto,ancho){let h=0;for(let k=1;k<=3;k++)h+=Math.sin(x/ancho*k*1.7+semilla*k)/(k*1.3);return alto*(.55+.45*h);}
function dibujaFondo(){
  const arriba=0, abajo=SUELO, n=CIELO.length, bh=(abajo-arriba)/n;
  CIELO.forEach((c,i)=>R(0,Math.round(arriba+i*bh),W,Math.round(bh)+1,c));
  // sol rayado, a medio esconder tras las montañas
  const sx=Math.round(W*.62), sy=abajo-22, sr=15;
  for(let y=-sr;y<=sr;y++){const w=Math.round(Math.sqrt(sr*sr-y*y));if(y>2&&(y%3===0))continue;
    const k=(y+sr)/(2*sr);R(sx-w,sy+y,w*2,1,k<.5?'#ffe27a':'#ff9f45');}
  for(let x=0;x<W;x++){const h1=Math.round(montana(x,1.3,34,40));R(x,abajo-h1,1,h1,'#6a2f62');}
  for(let x=0;x<W;x++){const h2=Math.round(montana(x,4.1,22,26));R(x,abajo-h2,1,h2,'#3a1b3e');}
}
function dibujaMarco(){
  st.piezas.filter(p=>p.t==='muro'&&!p.cae).forEach(dibujaPieza);
  R(0,SUELO,W,LOSA,PIEDRA.sombra); R(0,SUELO,W,1,PIEDRA.luz); R(0,SUELO+LOSA-1,W,1,PIEDRA.junta);
  st.piezas.filter(p=>p.t!=='muro'&&!p.cae).forEach(dibujaPieza);
}
const PANEL={w:22,h:9};
function dibujaMarcador(){   // también píxel a píxel, para que se vea nítido aunque cuelgue torcido
  const p=String(st.puntos).padStart(4,'0'), c=st.cuelga, w=PANEL.w, h=PANEL.h;
  const color=(u,v)=>{const a=Math.floor(u),b=Math.floor(v);if(a===0||b===0||a===w-1||b===h-1)return '#8a8a8a';
    const k=Math.floor((a-3)/4),i=(a-3)%4,j=b-2;if(k>=0&&k<4&&i<3&&j>=0&&j<5&&FUENTE[p[k]][j*3+i]==='1')return COL.texto;return '#000';};
  if(!c){const x0=Math.round(W-COLW-w-3),y0=Math.round((TECHO-h)/2);for(let b=0;b<h;b++)for(let a=0;a<w;a++)R(x0+a,y0+b,1,1,color(a+.5,b+.5));return;}
  const cs=Math.cos(c.a),sn=Math.sin(c.a),m=Math.ceil(Math.hypot(w,h))+1;
  for(let y=Math.floor(c.y-m);y<=c.y+m;y++)for(let x=Math.floor(c.x-m);x<=c.x+m;x++){
    const X=x+.5-c.x,Y=y+.5-c.y,u=X*cs+Y*sn+w,v=-X*sn+Y*cs;   // pivote en la esquina de arriba a la derecha
    if(u<0||v<0||u>=w||v>=h)continue; R(x,y,1,1,color(u,v));}
  R(Math.round(c.x)-1,Math.round(c.y)-1,1,1,'#8a8a8a');
}
// se cae un trozo del marco: la pieza y todo lo que tenga encima en su pila
function tira(p,retraso=0){if(!p||p.cae||p.pend!==undefined)return;p.pend=retraso;
  if(p.t==='piedra')st.piezas.filter(q=>q.t==='piedra'&&q.lado===p.lado&&q.k>p.k&&!q.cae).forEach(q=>q.dyObj+=p.h);}   // los de encima bajan
function desplaza(p){p.dx+=azar(-1.4,1.4);p.dy+=azar(-.4,1.2);p.dyObj=p.dy;p.r+=azar(-.16,.16);}
function derrumba(n){
  st.derrumbe=true;
  const piedras=st.piezas.filter(p=>p.t==='piedra'&&!p.cae&&p.pend===undefined), muro=st.piezas.filter(p=>p.t==='muro');
  const techo=i=>st.piezas.find(p=>p.t==='techo'&&p.i===i);
  const alg=(arr,k)=>arr.slice().sort(()=>Math.random()-.5).slice(0,k);
  alg(piedras,[3,4,3,4][n]).forEach((p,j)=>tira(p,j*3));
  alg(piedras,6).forEach(desplaza); alg(muro,[5,6,5,6][n]).forEach(desplaza);
  st.piezas.filter(p=>p.t==='techo'&&!p.cae&&Math.random()<.4).forEach(desplaza);
  if(n===0)tira(techo(2));
  if(n===1){tira(techo(6));if(!st.cuelga){const x=W-COLW-3,y=(TECHO-PANEL.h)/2;st.cuelga={x,y,a:0,w:0};}}
  if(n===2)tira(techo(3),3);
}
function actualizaPiezas(){
  st.piezas.forEach(p=>{
    if(p.pend!==undefined&&!p.cae){if(p.pend--<=0){p.cae=true;p.cx+=p.dx;p.cy+=p.dy;p.dx=p.dy=0;p.vx=(p.lado===0?1:p.lado===1?-1:azar(-1,1))*azar(.4,1.4);p.vy=azar(-1,0);p.vr=azar(-.12,.12);}return;}
    if(!p.cae){if(p.dyObj&&p.dy<p.dyObj)p.dy=Math.min(p.dyObj,p.dy+.9);return;}
    if(p.quieta)return;
    p.vy+=.16;p.cx+=p.vx;p.cy+=p.vy;p.r+=p.vr;
    const rad=Math.max(p.w,p.h)/2*Math.abs(Math.sin(p.r))+Math.min(p.w,p.h)/2*Math.abs(Math.cos(p.r));
    const baja=Math.abs(Math.cos(p.r))*p.h/2+Math.abs(Math.sin(p.r))*p.w/2;
    if(p.cy+baja>SUELO){p.cy=SUELO-baja;if(p.vy>1.2){p.vy*=-.3;p.vx*=.7;p.vr*=.6;blip(110,.08,'square',.05,60);}else{p.vy=0;p.vx*=.85;p.vr*=.8;if(Math.abs(p.vx)<.03&&Math.abs(p.vr)<.005)p.quieta=true;}}
    if(p.cx<rad){p.cx=rad;p.vx=Math.abs(p.vx)*.4;} if(p.cx>W-rad){p.cx=W-rad;p.vx=-Math.abs(p.vx)*.4;}
  });
  const c=st.cuelga; if(c){const a0=-Math.atan(PANEL.w/PANEL.h); c.w+=-(c.a-a0)*.02-c.w*.03; c.a+=c.w;}   // péndulo amortiguado
}

// ── mando y fuego
let joy=0, joyId=null;
function leeMando(e){const r=mando.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),max=r.width/2-18;
  joy=Math.max(-1,Math.min(1,dx/max)); palo.style.transform=`translateX(${joy*max}px)`; mando.setAttribute('aria-valuenow',joy.toFixed(2));}
mando.addEventListener('pointerdown',e=>{joyId=e.pointerId;mando.setPointerCapture(e.pointerId);leeMando(e);empieza();});
mando.addEventListener('pointermove',e=>{if(e.pointerId===joyId)leeMando(e);});
const sueltaMando=e=>{if(e.pointerId!==joyId)return;joyId=null;joy=0;palo.style.transform='';mando.setAttribute('aria-valuenow','0');};
mando.addEventListener('pointerup',sueltaMando);mando.addEventListener('pointercancel',sueltaMando);
let fuegoPulsado=false;
fuego.addEventListener('pointerdown',e=>{e.preventDefault();fuegoPulsado=true;fuego.classList.add('dn');empieza();dispara();});
const sueltaFuego=()=>{fuegoPulsado=false;fuego.classList.remove('dn');};
['pointerup','pointerleave','pointercancel'].forEach(t=>fuego.addEventListener(t,sueltaFuego));
fuego.addEventListener('click',e=>{if(e.detail===0){empieza();dispara();}});
const teclas={};
addEventListener('keydown',e=>{teclas[e.key]=true;if(e.key===' '){e.preventDefault();empieza();dispara();}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();empieza();}});
addEventListener('keyup',e=>teclas[e.key]=false);
document.getElementById('otra').addEventListener('click',nuevo);
function empieza(){if(!st.empezado&&!st.fin)st.empezado=true;}

  if(st.fin||st.cool>0||!(libre()||enElAire()))return;
  const r=st.nave.rot, v=3;   // dispara hacia donde apunte la nave, aunque la esté zarandeando
  st.balas.push({x:st.nave.x+Math.sin(r)*7,y:st.nave.y-Math.cos(r)*7,vx:Math.sin(r)*v,vy:-Math.cos(r)*v});st.cool=10;blip(880,.08,'square',.05,440);
}
const palanca=()=>{let v=joy;if(teclas.ArrowLeft)v=-1;if(teclas.ArrowRight)v=1;return v;};

// ── la araña, de perfil: rectángulo con anclas, cabeza rectangular delante, 8 patas a lo largo del cuerpo
const MUSLO=15, TIBIA=17, PASO=9, T_PASO=.13;
function ik(h,f,codoArribaPreferido=true){
  let dx=f[0]-h[0],dy=f[1]-h[1],d=Math.hypot(dx,dy)||.001,k=1;const max=MUSLO+TIBIA-.2;
  if(d>max)k=d/max;                               // si no llega, la pata se estira un poco
  const a=MUSLO*k,b=TIBIA*k,base=Math.atan2(dy,dx),c=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
  const k1=[h[0]+a*Math.cos(base-c),h[1]+a*Math.sin(base-c)],k2=[h[0]+a*Math.cos(base+c),h[1]+a*Math.sin(base+c)];
  return k1[1]<k2[1]?k1:k2;                       // el codo siempre hacia arriba
}
// codo de dibujo: siempre por encima del cuerpo, a medio camino hacia el pie
function rodilla(h,f,i=0){const alto=Math.min(h[1],f[1])-[7,9,12,16][i];return [h[0]+(f[0]-h[0])*.42,alto-Math.max(0,8-Math.abs(f[0]-h[0])*.25)];}
function nuevaArana(){
  const lado=st.nave.x<W/2?1:-1, d=-lado, x=lado>0?W+40:-40;
  const a={x,d,h:21,fase:'entra',ft:0,racha:0,parado:false,empuje:0,patas:[]};
  for(const lejos of [false,true])for(let i=0;i<4;i++){
    const grupo=(i+(lejos?1:0))%2;
    a.patas.push({i,lejos,grupo,pie:[x+d*restoX(i,lejos),SUELO],paso:null});
  }
  st.arana=a;
  // los marcianitos rompen la formación y huyen a la esquina de arriba contraria, cada uno por su cuenta
  st.esquina={x:lado>0?COLW+7:W-COLW-7,y:TECHO+6};
  st.marc.filter(m=>m.vivo).forEach(m=>{m.huida=true;m.vx=azar(-1.2,1.2)-lado*azar(.4,1.6);m.vy=azar(-1.8,-.2);m.prisa=azar(.7,1.3);});
  blip(140,.6,'sawtooth',.05,60);
}
function restoX(i,lejos){return [20,8,-13,-32][i]+(lejos?3:0);}   /* las traseras, más largas */
const INCL=.17;   // el cuerpo se inclina hacia delante
function enCuerpo(a,u,v){const r=a.d*INCL,y=SUELO-a.h;return [a.x+u*Math.cos(r)-v*Math.sin(r),y+u*Math.sin(r)+v*Math.cos(r)];}
function caderaDe(a,p){return enCuerpo(a,a.d*(6-p.i*4)+(p.lejos?a.d*1.5:0),3);}
function actualizaPatas(a,vel){
  const ahora=st.t;
  const algunoEnPaso=gr=>a.patas.some(p=>p.paso&&!p.agarra&&p.grupo===gr);
  a.patas.forEach(p=>{
    if(p.agarra)return;
    const resto=a.x+a.d*restoX(p.i,p.lejos);
    if(p.paso){const u=Math.min(1,(ahora-p.paso.t0)/(p.dur||T_PASO));
      p.pie=[lerp(p.paso.de[0],p.paso.a,u*u*(3-2*u)),lerp(p.paso.de[1],SUELO,u)-Math.sin(Math.PI*u)*4];
      if(u>=1){p.paso=null;p.dur=0;p.pie[1]=SUELO;}
      return;}
    const err=p.pie[0]-resto, lim=Math.abs(vel)>.05?PASO/2:1.5;
    if(Math.abs(err)>lim&&(!algunoEnPaso(1-p.grupo)||Math.abs(err)>PASO*1.3)){   /* si se queda muy atrás, da el paso igualmente */
      const adelanto=Math.abs(vel)>.05?Math.sign(vel)*PASO*.45:0;
      p.paso={t0:ahora,de:[...p.pie],a:resto+adelanto};
    }
  });
}
function actualizaArana(){
  const a=st.arana; if(!a)return; a.ft+=1/60; const n=st.nave;
  const ARRIBA=SUELO-46, abajo=SUELO-NAVE_MITAD; let vel=0;

  const coge=(obj,dur)=>{sujeta(p1,[obj[0]-1.5,obj[1]],dur);sujeta(p1b,[obj[0]+1.5,obj[1]+.5],dur);};   // con las dos patas delanteras

function bocaDe(a){const e=enCuerpo(a,a.d*10,-4);return [e[0]+a.d*6,e[1]-3];}

// el piloto: cabeza esfera y brazos y piernas de palo. Se dibuja en su propio marco y se coloca colgando del pie que tiene cogido
function pilotoLocal(P){
  const t=st.anim/60, e=P.escala, mov=P.vivo?1:0, L={};
  const curva=Math.sin(t*13)*1.6*mov+(mov?0:.8);
  L.cad=[0,0]; L.cue=[Math.sin(t*11)*1.1*mov,-5.5*e]; L.ctl=[curva*e,-2.75*e];
  L.hombro=[lerp(L.ctl[0],L.cue[0],.75),lerp(L.ctl[1],L.cue[1],.75)];
  L.cabeza=[L.cue[0],L.cue[1]-2.4*e]; L.cuello=[L.cue[0],L.cue[1]-.4*e];
  L.brazos=[-1,1].map(s=>{const ab=Math.sin(t*22+s*1.7)*.9*mov,codo=[L.hombro[0]+s*2.2*e,L.hombro[1]+1.2*e+ab*1.5*e];
    return [L.hombro,codo,[codo[0]+s*1.8*e,codo[1]+(ab>0?2.2:-2.2)*e*(mov?1:.4)+1.5*e*(1-mov)]];});
  const pi=Math.sin(t*19+2.3)*.8*mov, rodL=[-1.4*e+pi*1.2*e,2.6*e];
  L.piernas=[[L.cad,rodL,[rodL[0]-.6*e-pi*1.6*e,rodL[1]+2.8*e]],[L.cad,[1.2*e,2.7*e],[1.6*e,5.4*e]]];   // la derecha es la que tiene cogida
  L.pie=L.piernas[1][2];
  return L;
}
function aMundo(P,L,q){const c=Math.cos(P.ang),sn=Math.sin(P.ang),x=q[0]-L.pie[0],y=q[1]-L.pie[1];return [P.ancla[0]+x*c-y*sn,P.ancla[1]+x*sn+y*c];}
function pilotoPunto(P,nombre){const L=pilotoLocal(P);return aMundo(P,L,L[nombre]);}
function dibujaPiloto(P){
  if(!P||!P.visto||P.escala<=0)return;
  const L=pilotoLocal(P), M=q=>aMundo(P,L,q), e=P.escala;
  g.strokeStyle='#ffe9c8'; g.lineWidth=Math.max(1.5,S*1.15*e); g.lineCap='round'; g.lineJoin='round';
  const linea=pts=>{g.beginPath();pts.map(M).forEach((q,i)=>i?g.lineTo(q[0]*S,q[1]*S):g.moveTo(q[0]*S,q[1]*S));g.stroke();};
  const a=M(L.cad),c=M(L.ctl),b=M(L.cue);   // el torso se dobla con el pataleo
  g.beginPath();g.moveTo(a[0]*S,a[1]*S);g.quadraticCurveTo(c[0]*S,c[1]*S,b[0]*S,b[1]*S);g.stroke();
  L.brazos.forEach(linea); L.piernas.forEach(linea);
  if(P.con){const h=M(L.cabeza);dibujaCabeza(h[0],h[1],P.ang,e);}
}
function dibujaCabeza(x,y,r,e=1){   // solo el círculo
  g.fillStyle='#ffe9c8';g.beginPath();g.arc(x*S,y*S,2.3*e*S,0,Math.PI*2);g.fill();
}
function actualizaCabeza(){const C=st.cabeza;if(!C||!C.suelta)return;
  C.vy+=.12;C.x+=C.vx;C.y+=C.vy;C.r+=C.vr;
  if(C.y>SUELO-2.3){C.y=SUELO-2.3;if(Math.abs(C.vy)>.6){C.vy*=-.45;}else C.vy=0;C.vx*=.95;C.vr=C.vx/2.3;}
  if(C.x<3||C.x>W-3){C.x=Math.max(3,Math.min(W-3,C.x));C.vx*=-.5;}
}

// golpe contra el suelo: todo tiembla, el fuego da un tirón, el mando se cae y el marcador se rompe
function golpe(n){
  const nave=st.nave; st.temblor=16; st.dom.temblor=18; blip(70,.35,'sawtooth',.12,30);
  for(let i=0;i<16;i++)st.chispas.push({x:nave.x,y:SUELO-2,vx:azar(-1.6,1.6),vy:-azar(0,2.6),v:30});
  if(n>=2)nave.rota=true;
  const f=st.dom.fuego; f.x+=azar(-22,22); f.y+=azar(-18,8); f.r+=azar(-28,28);
  if(n===0&&!st.dom.mando)st.dom.mando={y:0,vy:-6,x:0,vx:azar(-1.2,1.2),r:0,vr:azar(-6,6)};
  else if(st.dom.mando){st.dom.mando.vy-=4;st.dom.mando.vr+=azar(-5,5);}
  derrumba(n);
}
function actualizaDom(){
  const d=st.dom;
  if(d.temblor>0){d.temblor--;const m=d.temblor;todo.style.transform=`translate(${azar(-m,m)}px,${azar(-m,m)*.7}px) rotate(${azar(-m,m)*.08}deg)`;}
  else if(todo.style.transform)todo.style.transform='';
  const f=d.fuego; if(f.x||f.y||f.r)fuego.style.transform=`translate(${f.x}px,${f.y}px) rotate(${f.r}deg)`;
  const m=d.mando; if(m){
    const r=mando.getBoundingClientRect(), suelo=innerHeight-(r.bottom-m.y)-2;   // hasta el borde de abajo de la pantalla
    m.vy+=.9; m.y+=m.vy; m.x+=m.vx; m.r+=m.vr; m.vr*=.97;
    if(m.y>suelo){m.y=suelo;m.vy=-m.vy*.45;m.vx*=.8;if(Math.abs(m.vy)<1)m.vy=0;}
    mando.style.transform=`translate(${m.x}px,${m.y}px) rotate(${m.r}deg)`;

const ARA={cuerpo:'#2b1532',borde:'#5c3468',luz:'#9a6aa2',cerca:'#1b0c22',lejos:'#6a4474',ojo:'#ff3b2f',ancla:'#f2e6cf'};
function pixLinea(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<400;n++){R(x0,y0,1,1,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function rectPix(cx,cy,w,h,rot){   // rectángulo girado, rellenado píxel a píxel, con borde, luz arriba y las cuatro esquinas marcadas
  const cs=Math.cos(rot),sn=Math.sin(rot),m=Math.ceil(Math.max(w,h)/2)+1;
  for(let y=Math.floor(cy-m);y<=cy+m;y++)for(let x=Math.floor(cx-m);x<=cx+m;x++){
    const X=x+.5-cx,Y=y+.5-cy,u=X*cs+Y*sn,v=-X*sn+Y*cs;
    if(Math.abs(u)>w/2||Math.abs(v)>h/2)continue;
    const borde=Math.abs(u)>w/2-1||Math.abs(v)>h/2-1;
    R(x,y,1,1,borde?(v<0?ARA.luz:ARA.borde):ARA.cuerpo);}
  for(const [u,v] of [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]])R(Math.round(cx+u*cs-v*sn)-.5,Math.round(cy+u*sn+v*cs)-.5,1,1,ARA.ancla);
}
function dibujaArana(){
  const a=st.arana; if(!a)return; const y=SUELO-a.h;
  const pata=p=>{const h=caderaDe(a,p),f=p.pie,k=rodilla(h,f,p.i),c=p.lejos?ARA.lejos:ARA.cerca;
    pixLinea(h[0],h[1],k[0],k[1],c);pixLinea(k[0],k[1],f[0],f[1],c);R(Math.round(k[0])-.5,Math.round(k[1])-.5,1,1,ARA.luz);};
  a.patas.filter(p=>p.lejos).forEach(pata);
  const r=a.d*INCL; rectPix(a.x,y,20,8,r);                    // cuerpo, inclinado hacia delante
  const esq=enCuerpo(a,a.d*10,-4), inc=r-a.d*.25;             // cabeza alargada: sobre la esquina de arriba delante, inclinada, sin ojos
  const hc=[esq[0]+a.d*3,esq[1]-2.8]; rectPix(hc[0],hc[1],11,6,inc);
  a.patas.filter(p=>!p.lejos).forEach(pata);
}

// ── bucle
function paso(){
  const s=st; if(s.cool>0)s.cool--;
  if(s.empezado&&!s.fin)s.t+=1/60;
  if(libre())s.nave.x=Math.max(COLW+9,Math.min(W-COLW-9,s.nave.x+palanca()*1.3));
  if(fuegoPulsado&&s.cool===0)dispara();
  if(s.fase==='juego'&&s.t>=5){s.fase='arana-entra';nuevaArana();}
  if(s.arana&&s.arana.fase!=='entra'&&s.fase==='arana-entra')s.fase='atrapado';
  s.balas.forEach(b=>{b.x+=b.vx;b.y+=b.vy;}); s.balas=s.balas.filter(b=>b.y>-4&&b.y<H&&b.x>-4&&b.x<W+4);
  s.anim++;
  const vivos=s.marc.filter(m=>m.vivo);
  if(s.empezado&&!s.arana&&s.fase==='juego'){
    if(s.anim%2===0){let borde=false;vivos.forEach(m=>{m.x+=s.dir*.45;if(m.x<COLW+7||m.x>W-COLW-7)borde=true;});
      if(borde){s.dir*=-1;vivos.forEach(m=>m.y+=4);}}
    if(vivos.length===0)oleada();
    vivos.forEach(m=>{if(m.y>SUELO-26)m.y=TECHO+10;});
  }
  vivos.forEach(m=>{if(m.flash>0)m.flash--;});
  const huyen=vivos.filter(m=>m.huida);
  if(huyen.length){const E=s.esquina;
    huyen.forEach(m=>{const dx=E.x-m.x,dy=E.y-m.y,d=Math.hypot(dx,dy)||1;
      m.vx+=dx/d*.08*m.prisa+azar(-.22,.22); m.vy+=dy/d*.08*m.prisa+azar(-.22,.22);
      if(Math.random()<.01){m.vx+=azar(-1.5,1.5);m.vy+=azar(-1,1);}   /* ataques de pánico */});
    // se empujan unos a otros: chocan un poco sin llegar a solaparse
    for(let i=0;i<huyen.length;i++)for(let j=i+1;j<huyen.length;j++){const A=huyen[i],B=huyen[j],dx=B.x-A.x,dy=B.y-A.y,ox=13-Math.abs(dx),oy=9-Math.abs(dy);
      if(ox>0&&oy>0){if(ox<oy*1.3){const e=ox*.5*Math.sign(dx||azar(-1,1));A.x-=e;B.x+=e;A.vx-=e*.25;B.vx+=e*.25;}
        else{const e=oy*.5*Math.sign(dy||azar(-1,1));A.y-=e;B.y+=e;A.vy-=e*.25;B.vy+=e*.25;}}}
    huyen.forEach(m=>{m.vx*=.9;m.vy*=.9;const v=Math.hypot(m.vx,m.vy),max=2.4;if(v>max){m.vx*=max/v;m.vy*=max/v;}
      m.x+=m.vx;m.y+=m.vy;if(m.x<COLW+7){m.x=COLW+7;m.vx=Math.abs(m.vx)*.4;}if(m.x>W-COLW-7){m.x=W-COLW-7;m.vx=-Math.abs(m.vx)*.4;}if(m.y<TECHO+6){m.y=TECHO+6;m.vy=Math.abs(m.vy)*.4;}});}
  s.balas.forEach(b=>vivos.forEach(m=>{if(m.vivo&&Math.abs(b.x-m.x)<6&&Math.abs(b.y-m.y)<5){
    b.y=-99; m.vida--; m.flash=6;
    if(m.vida>0){blip(520,.05,'square',.04,380);return;}
    m.vivo=false; s.puntos+=10*(FILAS.length-FILAS.indexOf(m.c)); blip(200,.25,'square',.06,50);
    // explota en una lluvia de píxeles que caen al suelo
    const rows=m.huida?SUSTO:MARC[Math.floor(s.anim/30)%2];
    rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='X'){const dx=i-6,dy=j-4;s.lluvia.push({x:m.x+dx,y:m.y+dy,vx:dx*.22+azar(-.5,.5),vy:dy*.18-azar(.4,1.6),c:m.c,quieto:false});}}));
  }}));
  s.lluvia.forEach(p=>{if(p.quieto)return;if(!p.suelo)p.vy+=.09;p.x+=p.vx;p.y+=p.vy;
    if(p.x<COLW){p.x=COLW;p.vx=Math.abs(p.vx)*.5;} if(p.x>W-COLW-1){p.x=W-COLW-1;p.vx=-Math.abs(p.vx)*.5;}
    if(p.y>=SUELO-1){p.y=SUELO-1;if(!p.suelo&&Math.abs(p.vy)>.7){p.vy*=-.5;p.vx*=.9;}else{p.vy=0;p.suelo=true;p.vx*=.96;if(Math.abs(p.vx)<.03)p.quieto=true;}}});   /* rebota y luego resbala */
  if(s.lluvia.length>1800)s.lluvia.splice(0,s.lluvia.length-1800);
  actualizaArana(); actualizaCabeza();
  s.chispas.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.1;c.v--;}); s.chispas=s.chispas.filter(c=>c.v>0);
  actualizaPiezas();
  if(s.temblor>0)s.temblor--;
  actualizaDom();
}
function dibuja(){
  const s=st; g.setTransform(1,0,0,1,0,0); g.fillStyle='#000'; g.fillRect(0,0,cv.width,cv.height);
  if(s.temblor>0)g.translate(Math.round(azar(-.5,.5)*s.temblor)*S,Math.round(azar(-.5,.5)*s.temblor*.7)*S);
  dibujaFondo();
  dibujaMarco();
  s.piezas.filter(p=>p.cae).forEach(dibujaPieza);   // los bloques que caen van por detrás de la araña, la nave y el piloto
  s.lluvia.forEach(p=>R(Math.round(p.x),Math.round(p.y),1,1,p.c));
  s.marc.forEach(m=>{if(!m.vivo)return;const c=m.flash>0&&m.flash%2?'#ffffff':m.c;
    if(m.huida)sprite(SUSTO,m.x,m.y,c);
    else sprite(MARC[Math.floor(s.anim/30)%2],m.x,m.y,c);});
  s.balas.forEach(b=>R(Math.round(b.x),Math.round(b.y),1,3,COL.bala));
  const n=s.nave, sp=n.rota?ROTA:NAVE; for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1]])sprite(sp,n.x+ox,n.y+oy,'#1d1030',n.rot);   /* contorno oscuro para que se vea sobre el atardecer */
  sprite(sp,n.x,n.y,COL.nave,n.rot);
  dibujaArana(); dibujaPiloto(s.piloto); if(s.cabeza&&(s.cabeza.suelta||!s.piloto||!s.piloto.con))dibujaCabeza(s.cabeza.x,s.cabeza.y,s.cabeza.r);
  s.chispas.forEach(c=>R(Math.round(c.x),Math.round(c.y),1,1,COL.chispa));
  dibujaMarcador();
  g.setTransform(1,0,0,1,0,0);
  if(!s.empezado&&Math.floor(performance.now()/500)%2===0){const t='PULSA FUEGO';texto(t,(W-ancho(t))/2,SUELO*.66,COL.texto);}
  if(s.fin){const t='GAME OVER';texto(t,(W-ancho(t,2))/2,SUELO*.42,COL.texto,2);}
}
addEventListener('resize',ajusta); ajusta(); nuevo();
let acc=0,ult=performance.now();
function bucle(now){acc+=Math.min(100,now-ult);ult=now;while(acc>=1000/60){paso();acc-=1000/60;}dibuja();requestAnimationFrame(bucle);}
requestAnimationFrame(bucle);
</script>
