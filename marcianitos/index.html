<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>marcianitos</title>
<meta property="og:title" content="marcianitos">
<link rel="icon" href="/favicon.ico">
<style>
/* Layout: el juego ocupa toda la pantalla, sin marco. Abajo, sobre la franja de tierra, el mando a un lado y el botón de fuego al otro */
:root{
  --tv:#000000; --tierra:#4a3216; --gris:#8a8a8a; --fire:#d8402a; --fire-sombra:#7d2010; --mando:#1a1a1a; --mando-borde:#3a3a3a; --palo:#c9c9c9;
  --font:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tv);overflow:hidden}
:root{padding:0!important}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font)}
#todo{position:fixed;inset:0;will-change:transform}
canvas{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
.back{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(var(--colw,26px) + 6px);color:#d8d8d8;background:#000;padding:2px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.mandos{position:absolute;left:0;right:0;bottom:0;height:var(--banda,150px);padding:var(--losa,10px) var(--col,44px) env(safe-area-inset-bottom,0px);
  display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}
.mandos>*{pointer-events:auto}
/* mandos mínimos: un círculo para mover (con su punto) y un círculo para disparar */
#mando{position:relative;will-change:transform;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.55);touch-action:none}
#palo{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;will-change:transform}
#fuego{will-change:transform;width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:transparent;cursor:pointer;touch-action:none;padding:0}
#fuego::after{content:"";display:block;width:34px;height:34px;margin:auto;border-radius:50%;background:#fff}
#fuego.dn{border-color:#fff}
#fuego.dn::after{transform:scale(.85)}
#otra{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:3;height:44px;padding:0 18px;border:2px solid #e8a83a;background:#000;color:#e8a83a;
  font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:focus-visible{outline:3px solid var(--gris);outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
<div id="todo">
  <canvas id="c" aria-label="Juego de marcianitos"></canvas>
  <a class="back" href="/">← volver</a>
  <div class="mandos">
    <div id="mando" role="slider" aria-label="Mando: mueve la nave" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div id="palo"></div></div>
    <button id="fuego" aria-label="Disparar"></button>
  </div>
</div>
<button id="otra" hidden>Otra vez</button>
<script>
const cv=document.getElementById('c'), g=cv.getContext('2d');
const todo=document.getElementById('todo'), mando=document.getElementById('mando'), palo=document.getElementById('palo'), fuego=document.getElementById('fuego');
const W=112;                 // ancho lógico en "píxeles Atari"
let H=200, S=1, SUELO=150, BANDA=150, DPR=1;
const COL={nave:'#e8a83a',bala:'#f4e46a',texto:'#e8a83a',chispa:'#f4e46a',lejos:'#8f8f8f'};
const FILAS=['#e5483a','#f0a830','#e2dc45','#5cc24c','#3fa3e8'];   // de abajo arriba: la fila de abajo cae con 1 disparo… la de arriba con 5
const COLW=7, TECHO=16, SOPORTE=10, LOSA=4;   // marco: columnas laterales, techo, columnas bajo el suelo, grosor del suelo

function ajusta(){
  DPR=Math.min(3,window.devicePixelRatio||1); const cw=innerWidth, ch=innerHeight;
  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);
  S=cv.width/W; H=cv.height/S;
  BANDA=Math.min(170,Math.max(130,ch*.2)); document.documentElement.style.setProperty('--banda',BANDA+'px');
  SUELO=H-BANDA*DPR/S;
  const css=S/DPR; document.documentElement.style.setProperty('--col',(SOPORTE*css+14)+'px');
  document.documentElement.style.setProperty('--colw',(COLW*css)+'px'); document.documentElement.style.setProperty('--losa',(LOSA*css)+'px');
  if(st&&!st.derrumbe)construye();
  if(st&&st.fase==='juego')st.nave.y=SUELO-NAVE_MITAD;
}

// ── dibujo en píxeles lógicos
function R(x,y,w,h,c){g.fillStyle=c;const x0=Math.round(x*S),y0=Math.round(y*S);g.fillRect(x0,y0,Math.max(1,Math.round((x+w)*S)-x0),Math.max(1,Math.round((y+h)*S)-y0));}
function sprite(rows,x,y,c,rot=0){const h=rows.length,w=rows[0].length,cs=Math.cos(rot),sn=Math.sin(rot);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(rows[j][i]==='X'){const lx=i-w/2+.5,ly=j-h/2+.5;
    R(Math.round(x+lx*cs-ly*sn)-.5,Math.round(y+lx*sn+ly*cs)-.5,1,1,c);}}
const FUENTE={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
 '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
 'G':'111100101101111','A':'010101111101101','M':'101111111101101','E':'111100110100111','O':'111101101101111',
 'V':'101101101101010','R':'110101110101101','P':'110101110100100','U':'101101101101111','L':'100100100100111',
 'S':'111100111001111','F':'111100110100100','N':'101111111111101','T':'111010010010010','I':'111010010010111','D':'110101101101110',' ':'000000000000000'};
function texto(t,x,y,c,e=1){[...t].forEach((ch,k)=>{const f=FUENTE[ch]||FUENTE[' '];
  for(let i=0;i<15;i++)if(f[i]==='1')R(x+k*4*e+(i%3)*e,y+Math.floor(i/3)*e,e,e,c);});}
const ancho=(t,e=1)=>t.length*4*e-e;
const filasDe=ch=>{const f=FUENTE[ch];return [0,1,2,3,4].map(r=>[0,1,2].map(c=>f[r*3+c]==='1'?'X':'.').join(''));};

const NAVE=["........X........","........X........",".......XXX.......",".......XXX.......","......XXXXX......","......XX.XX......","......XXXXX......",".....XXXXXXX.....","..X..XXXXXXX..X..",".XXXXXXXXXXXXXXX.","XXXXXXXXXXXXXXXXX","XXXXXXXXXXXXXXXXX","XX.XX.XXXXX.XX.XX"];
const ROTA=["......X............","..X..XX.X.....X....",".XX.XXXXX...XXX..X.",".XXXXX..XX.XXXXXXX.","XXXXXX..XXXXXXXXXXX","XXXXXXXXXXXXXXXXXXX"];
const NAVE_MITAD=6.5;
const MARC=[["...X....X...","....X..X....","...XXXXXX...","..XX.XX.XX..",".XXXXXXXXXX.",".X.XXXXXX.X.",".X.X....X.X.","....XX.XX..."],
            ["...X....X...",".X..X..X..X.",".X.XXXXXX.X.",".XXX.XX.XXX.",".XXXXXXXXXX.","..XXXXXXXX..","...X....X...","..X......X.."]];
const SUSTO=["X..X....X..X",".X..X..X..X.","...XXXXXX...","..X.XXXX.X..",".XX......XX.",".XXX.XX.XXX.","..X.X..X.X..",".X........X."];

// ── sonido
let ac=null;function blip(f,d,tipo='square',vol=.06,fin=f*.5){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),v=ac.createGain();o.type=tipo;o.frequency.setValueAtTime(f,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,fin),ac.currentTime+d);v.gain.setValueAtTime(vol,ac.currentTime);
  v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const lerp=(a,b,k)=>a+(b-a)*k, azar=(a,b)=>a+Math.random()*(b-a);

// ── estado
let st=null;
function nuevo(){
  st={t:0,empezado:false,puntos:0,nave:{x:W/2,y:SUELO-NAVE_MITAD,rot:0,rota:false},balas:[],marc:[],dir:1,anim:0,
      fase:'juego',arana:null,piloto:null,cabeza:null,chispas:[],lluvia:[],temblor:0,fin:false,cool:0,
      piezas:[],cuelga:null,derrumbe:false,dom:{temblor:0,fuego:{x:0,y:0,r:0},mando:null}};
  construye(); oleada(); document.getElementById('otra').hidden=true;
  todo.style.transform=''; fuego.style.transform=''; mando.style.transform='';
}
function oleada(){for(let f=0;f<FILAS.length;f++)for(let i=0;i<5;i++)st.marc.push({x:24+i*16,y:TECHO+10+f*12,c:FILAS[f],vida:FILAS.length-f,flash:0,vivo:true,huida:null});}

// ── el marco: suelo, columnas debajo, pilas de columna-bloque a los lados y techo de cuadraditos con el marcador
function construye(){
  const P=[]; const alto=SUELO-TECHO, col=(alto-3*COLW)/3;
  for(const lado of [0,1]){const x=lado?W-COLW:0; let y=SUELO;
    for(let k=0;k<3;k++){y-=col;P.push({t:'col',x,y,w:COLW,h:col,lado,k:k*2});y-=COLW;P.push({t:'bloque',x,y,w:COLW,h:COLW,lado,k:k*2+1});}}
  const tr=8,tw=W/tr; for(let i=0;i<tr;i++)P.push({t:'techo',x:i*tw,y:0,w:tw,h:TECHO,i});
  P.forEach(p=>{p.cae=false;p.vx=0;p.vy=0;p.r=0;p.vr=0;p.cx=p.x+p.w/2;p.cy=p.y+p.h/2;});
  st.piezas=P;
}
function dibujaPieza(p){
  g.save(); g.translate(p.cx*S,p.cy*S); g.rotate(p.r); const x=-p.w/2,y=-p.h/2,r=(a,b,c,d,col)=>R(x+a,y+b,c,d,col);
  const Rl=(a,b,c,d,col)=>{g.fillStyle=col;g.fillRect((x+a)*S,(y+b)*S,c*S,d*S);};
  if(p.t==='col'){Rl(0,0,p.w,p.h,'#6f6f6f');Rl(1.5,0,1,p.h,'#9a9a9a');Rl(4,0,1,p.h,'#9a9a9a');Rl(0,0,p.w,1,'#b0b0b0');Rl(0,p.h-1,p.w,1,'#4a4a4a');}
  else if(p.t==='bloque'){Rl(0,0,p.w,p.h,'#a8a8a8');Rl(1,1,p.w-2,p.h-2,'#7c7c7c');Rl(2,2,p.w-4,p.h-4,'#8f8f8f');}
  else if(p.t==='techo'){Rl(0,0,p.w,p.h,'#2c2c2c');for(let yy=1;yy<p.h-1;yy+=3)for(let xx=1;xx<p.w-1;xx+=3)Rl(xx,yy,2,2,'#8a8a8a');}
  g.restore();
}
function dibujaMarco(){
  // suelo y sus dos columnas
  R(0,SUELO,W,LOSA,'#8a8a8a'); R(0,SUELO,W,1,'#c4c4c4'); R(0,SUELO+LOSA-1,W,1,'#4e4e4e');
  for(const x of [0,W-SOPORTE]){R(x,SUELO+LOSA,SOPORTE,H-SUELO,'#6f6f6f');R(x+2,SUELO+LOSA,1,H-SUELO,'#9a9a9a');R(x+5,SUELO+LOSA,1,H-SUELO,'#9a9a9a');R(x+8,SUELO+LOSA,1,H-SUELO,'#9a9a9a');}
  st.piezas.filter(p=>!p.cae).forEach(dibujaPieza);
}
// el marcador vive en un panel del techo; si el techo se rompe, queda colgando de una esquina
const PANEL={w:22,h:9};
function dibujaMarcador(){
  const p=String(st.puntos).padStart(4,'0'), c=st.cuelga;
  const px=W-COLW-PANEL.w-3, py=(TECHO-PANEL.h)/2;
  g.save();
  if(c){g.translate(c.x*S,c.y*S);g.rotate(c.a);g.translate(-PANEL.w*S,0);}   // pivote: esquina de arriba a la derecha
  else g.translate(px*S,py*S);
  g.fillStyle='#000';g.fillRect(0,0,PANEL.w*S,PANEL.h*S);g.strokeStyle='#8a8a8a';g.lineWidth=Math.max(1,S*.5);g.strokeRect(0,0,PANEL.w*S,PANEL.h*S);
  if(c){g.fillStyle='#8a8a8a';g.fillRect((PANEL.w-1)*S,-.5*S,1*S,1*S);}
  [...p].forEach((ch,k)=>{const f=FUENTE[ch];for(let i=0;i<15;i++)if(f[i]==='1'){g.fillStyle=COL.texto;g.fillRect((3+k*4+(i%3))*S,(2+Math.floor(i/3))*S,S,S);}});
  g.restore();
}
// se cae un trozo del marco: la pieza y todo lo que tenga encima en su pila
function tira(p,retraso=0){if(!p||p.cae||p.pend)return;p.pend=retraso;}
function derrumba(n){
  st.derrumbe=true; const lado=Math.random()<.5?0:1, pila=l=>st.piezas.filter(p=>p.lado===l&&p.t!=='techo');
  const techo=i=>st.piezas.find(p=>p.t==='techo'&&p.i===i);
  const desde=(l,k)=>pila(l).filter(p=>p.k>=k).forEach((p,j)=>tira(p,j*4));
  if(n===0){desde(lado,5);tira(techo(2));}
  if(n===1){desde(1-lado,4);tira(techo(6));if(!st.cuelga){const x=W-COLW-3,y=(TECHO-PANEL.h)/2;st.cuelga={x,y,a:0,w:0};}}
  if(n===2){tira(techo(3),3);}
  if(n===3){desde(lado,3);}
}
function actualizaPiezas(){
  st.piezas.forEach(p=>{
    if(p.pend!==undefined&&!p.cae){if(p.pend--<=0){p.cae=true;p.vx=(p.lado===0?1:p.lado===1?-1:azar(-1,1))*azar(.3,1.1);p.vy=azar(-1,0);p.vr=azar(-.12,.12);}return;}
    if(!p.cae||p.quieta)return;
    p.vy+=.16;p.cx+=p.vx;p.cy+=p.vy;p.r+=p.vr;
    const rad=Math.max(p.w,p.h)/2*Math.abs(Math.sin(p.r))+Math.min(p.w,p.h)/2*Math.abs(Math.cos(p.r));
    const baja=Math.abs(Math.cos(p.r))*p.h/2+Math.abs(Math.sin(p.r))*p.w/2;
    if(p.cy+baja>SUELO){p.cy=SUELO-baja;if(p.vy>1.2){p.vy*=-.3;p.vx*=.7;p.vr*=.6;blip(110,.08,'square',.05,60);}else{p.vy=0;p.vx*=.85;p.vr*=.8;if(Math.abs(p.vx)<.03&&Math.abs(p.vr)<.005)p.quieta=true;}}
    if(p.cx<rad){p.cx=rad;p.vx=Math.abs(p.vx)*.4;} if(p.cx>W-rad){p.cx=W-rad;p.vx=-Math.abs(p.vx)*.4;}
  });
  const c=st.cuelga; if(c){const a0=-Math.atan(PANEL.w/PANEL.h); c.w+=-(c.a-a0)*.02-c.w*.03; c.a+=c.w;}   // péndulo amortiguado
}

// ── mando y fuego
let joy=0, joyId=null;
function leeMando(e){const r=mando.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),max=r.width/2-12;
  joy=Math.max(-1,Math.min(1,dx/max)); palo.style.transform=`translateX(${joy*max}px)`; mando.setAttribute('aria-valuenow',joy.toFixed(2));}
mando.addEventListener('pointerdown',e=>{joyId=e.pointerId;mando.setPointerCapture(e.pointerId);leeMando(e);empieza();});
mando.addEventListener('pointermove',e=>{if(e.pointerId===joyId)leeMando(e);});
const sueltaMando=e=>{if(e.pointerId!==joyId)return;joyId=null;joy=0;palo.style.transform='';mando.setAttribute('aria-valuenow','0');};
mando.addEventListener('pointerup',sueltaMando);mando.addEventListener('pointercancel',sueltaMando);
let fuegoPulsado=false;
fuego.addEventListener('pointerdown',e=>{e.preventDefault();fuegoPulsado=true;fuego.classList.add('dn');empieza();dispara();});
const sueltaFuego=()=>{fuegoPulsado=false;fuego.classList.remove('dn');};
['pointerup','pointerleave','pointercancel'].forEach(t=>fuego.addEventListener(t,sueltaFuego));
fuego.addEventListener('click',e=>{if(e.detail===0){empieza();dispara();}});
const teclas={};
addEventListener('keydown',e=>{teclas[e.key]=true;if(e.key===' '){e.preventDefault();empieza();dispara();}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();empieza();}});
addEventListener('keyup',e=>teclas[e.key]=false);
document.getElementById('otra').addEventListener('click',nuevo);
function empieza(){if(!st.empezado&&!st.fin)st.empezado=true;}
const libre=()=>st.fase==='juego'||st.fase==='arana-entra';
const enElAire=()=>st.arana&&['levanta','sacude'].includes(st.arana.fase);
function dispara(){
  if(st.fin||st.cool>0||!(libre()||enElAire()))return;
  const r=st.nave.rot, v=3;   // dispara hacia donde apunte la nave, aunque la esté zarandeando
  st.balas.push({x:st.nave.x+Math.sin(r)*7,y:st.nave.y-Math.cos(r)*7,vx:Math.sin(r)*v,vy:-Math.cos(r)*v});st.cool=10;blip(880,.08,'square',.05,440);
}
const palanca=()=>{let v=joy;if(teclas.ArrowLeft)v=-1;if(teclas.ArrowRight)v=1;return v;};

// ── la araña, de perfil: rectángulo con anclas, cabeza rectangular delante, 8 patas a lo largo del cuerpo
const MUSLO=15, TIBIA=17, PASO=9, T_PASO=.13;
function ik(h,f,codoArribaPreferido=true){
  let dx=f[0]-h[0],dy=f[1]-h[1],d=Math.hypot(dx,dy)||.001,k=1;const max=MUSLO+TIBIA-.2;
  if(d>max)k=d/max;                               // si no llega, la pata se estira un poco
  const a=MUSLO*k,b=TIBIA*k,base=Math.atan2(dy,dx),c=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
  const k1=[h[0]+a*Math.cos(base-c),h[1]+a*Math.sin(base-c)],k2=[h[0]+a*Math.cos(base+c),h[1]+a*Math.sin(base+c)];
  return k1[1]<k2[1]?k1:k2;                       // el codo siempre hacia arriba
}
// codo de dibujo: siempre por encima del cuerpo, a medio camino hacia el pie
function rodilla(h,f,i=0){const alto=Math.min(h[1],f[1])-[7,9,12,16][i];return [h[0]+(f[0]-h[0])*.42,alto-Math.max(0,8-Math.abs(f[0]-h[0])*.25)];}
function nuevaArana(){
  const lado=st.nave.x<W/2?1:-1, d=-lado, x=lado>0?W+40:-40;
  const a={x,d,h:21,fase:'entra',ft:0,racha:0,parado:false,empuje:0,patas:[]};
  for(const lejos of [false,true])for(let i=0;i<4;i++){
    const grupo=(i+(lejos?1:0))%2;
    a.patas.push({i,lejos,grupo,pie:[x+d*restoX(i,lejos),SUELO],paso:null});
  }
  st.arana=a;
  // los marcianitos rompen la formación y huyen a la esquina de arriba contraria, cada uno por su cuenta
  st.esquina={x:lado>0?COLW+7:W-COLW-7,y:TECHO+6};
  st.marc.filter(m=>m.vivo).forEach(m=>{m.huida=true;m.vx=azar(-1.2,1.2)-lado*azar(.4,1.6);m.vy=azar(-1.8,-.2);m.prisa=azar(.7,1.3);});
  blip(140,.6,'sawtooth',.05,60);
}
function restoX(i,lejos){return [20,8,-13,-32][i]+(lejos?3:0);}   /* las traseras, más largas */
const INCL=.17;   // el cuerpo se inclina hacia delante
function enCuerpo(a,u,v){const r=a.d*INCL,y=SUELO-a.h;return [a.x+u*Math.cos(r)-v*Math.sin(r),y+u*Math.sin(r)+v*Math.cos(r)];}
function caderaDe(a,p){return enCuerpo(a,a.d*(6-p.i*4)+(p.lejos?a.d*1.5:0),3);}
function actualizaPatas(a,vel){
  const ahora=st.t;
  const algunoEnPaso=gr=>a.patas.some(p=>p.paso&&!p.agarra&&p.grupo===gr);
  a.patas.forEach(p=>{
    if(p.agarra)return;
    const resto=a.x+a.d*restoX(p.i,p.lejos);
    if(p.paso){const u=Math.min(1,(ahora-p.paso.t0)/(p.dur||T_PASO));
      p.pie=[lerp(p.paso.de[0],p.paso.a,u*u*(3-2*u)),lerp(p.paso.de[1],SUELO,u)-Math.sin(Math.PI*u)*4];
      if(u>=1){p.paso=null;p.dur=0;p.pie[1]=SUELO;}
      return;}
    const err=p.pie[0]-resto, lim=Math.abs(vel)>.05?PASO/2:1.5;
    if(Math.abs(err)>lim&&(!algunoEnPaso(1-p.grupo)||Math.abs(err)>PASO*1.3)){   /* si se queda muy atrás, da el paso igualmente */
      const adelanto=Math.abs(vel)>.05?Math.sign(vel)*PASO*.45:0;
      p.paso={t0:ahora,de:[...p.pie],a:resto+adelanto};
    }
  });
}
function actualizaArana(){
