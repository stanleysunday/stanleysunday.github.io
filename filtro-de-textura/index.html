/* ---------- versión interactiva: capas de chicle que se rasgan solas o donde pasas el dedo / el cursor ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const COLORS=ORDER.map(o=>o.key); // rojo, azul, amarillo, negro, blanco
const colorOf=k=>ORDER.find(o=>o.key===k).color;
let ci=0;                       // color de la siguiente lámina intacta
const sheets=[];                // láminas: [0] = la de arriba del todo
function newSheet(){const s={color:colorOf(COLORS[ci]),key:COLORS[ci],tears:[],going:false,end:0,ox:Math.random()*256,oy:Math.random()*256,rx:0,ry:0};ci=(ci+1)%COLORS.length;return s}
sheets.push(newSheet(),newSheet());
/* ---------- riso procedural: papel + trama por color, generado al cargar (sin imágenes) ---------- */

const ANG={'#e20613':15,'#1fa3ff':75,'#fed200':0,'#000000':45,'#ffffff':0};
/* acabado: riso (por defecto) o rotulador (?acabado=rotulador) */
const MARKER=new URLSearchParams(location.search).get('acabado')==='rotulador';

const TILES={};
ORDER.forEach((o,i)=>{TILES[o.color]=MARKER?[0,1,2].map(v=>makeMarkerTile(o.color,101+i*13+v*997)):[makeTile(o.color,11+i*7,ANG[o.color]*Math.PI/180)]});
const MANG={'#e20613':-32,'#1fa3ff':58,'#fed200':-8,'#000000':24,'#ffffff':0};
const darker=hex=>{const n=parseInt(hex.slice(1),16),f=hex==='#000000'?1:0.62;return `rgb(${(n>>16&255)*f|0},${(n>>8&255)*f|0},${(n&255)*f|0})`};
const PATS=new Map();

let CUR=null; // lámina que se está pintando: su papel va fijo a ella
function fillTex(c,hex,shift,now){
  const P=pat(c,hex);
  const ox=CUR?CUR.ox+(MARKER?0:CUR.rx):0,oy=CUR?CUR.oy+(MARKER?0:CUR.ry):0;

let NOW=0;
const off=document.createElement('canvas'),octx=off.getContext('2d'),msk=document.createElement('canvas'),mctx=msk.getContext('2d');
function resizeOff(){off.width=msk.width=cv.width;off.height=msk.height=cv.height}resizeOff();addEventListener('resize',resizeOff);

/* añade una rotura a la lámina de arriba que aún no se está yendo.

function addTear(ax,ay,bx,by,now){

  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const S=Math.hypot(VW,VH)*1.15;
  const dyn={...DYN[sh.key],angle,bias:-0.85};
  const density=(2*S/3200)/scaleOf(S);
  const layer=makeLayer((Math.random()*4294967295)>>>0,dyn,S,S,density,false);
  let cx=ax,cy=ay,dur=3.2;

  endHoverIfIdle(now);
  while(sheets.length&&sheets[0].going&&now>sheets[0].end+0.1)sheets.shift();
  ctx.setTransform(DPR,0,0,DPR,0,0);

  let k=sheets.length-1;while(k>0&&sheets[k].tears.length===0&&sheets[k-1].tears.length===0)k--;
  for(let i=k;i>=0;i--)drawSheet(sheets[i],now);
  // que siempre haya una lámina por debajo de la de arriba
  if(sheets.length<2||sheets[sheets.length-1].tears.length)sheets.push(newSheet());
  requestAnimationFrame(frame);

let g=null;
