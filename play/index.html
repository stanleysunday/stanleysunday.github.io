<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>play</title>
<meta property="og:title" content="play">
<link rel="icon" href="/favicon.ico">

<style>
/* Layout: una columna — vídeo arriba, dos botones grandes debajo, sobre blanco liso como el resto de la web */
:root{
  --bg:#ffffff; --ink:#111111; --muted:#8a8a8a; --socket:#d9d9d9; --screen:#ffe14d; --lit:#ffe14d;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);padding-inline:16px;padding-block:32px 48px;overflow-x:hidden}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
#v{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--ink)}
.mandos{position:relative;display:flex;justify-content:center;gap:clamp(28px,8vw,72px);padding-bottom:40px}
.hueco{position:relative;width:clamp(96px,22vw,150px);aspect-ratio:1}
.hueco::before{content:"";position:absolute;inset:0;border:2px dashed var(--socket);border-radius:50%}
.boton{position:absolute;inset:0;border:0;border-radius:50%;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
  will-change:transform}
.boton svg{width:42%;height:42%;fill:currentColor;pointer-events:none}
.boton:focus-visible{outline:3px solid var(--muted);outline-offset:4px}
.boton.suelto{cursor:grab}
.boton.arrastrando{cursor:grabbing}
.boton:active:not(.suelto){filter:brightness(1.4)}
.boton{transition:background-color .12s,color .12s,box-shadow .12s}
.boton.activo{background:var(--lit);color:var(--ink);box-shadow:inset 0 0 0 9px var(--ink)}
.pantalla{display:flex;flex-direction:column;gap:10px;width:min(100%,110vh);margin-inline:auto}
.avance{height:4px;background:var(--socket);overflow:hidden}
.avance i{display:block;height:100%;width:0;background:var(--ink)}
@media (prefers-reduced-motion:reduce){.boton{transition:none}}
*{box-sizing:border-box}
html,body{margin:0}
.back{align-self:flex-start;color:var(--ink);font-size:13px}
</style>

</head>
<body>
<main>
  <a class="back" href="/">← volver</a>
  <div class="pantalla">
    <video id="v" src="https://res.cloudinary.com/dwkzyfnvc/video/upload/q_auto/v1791832262/wolfman_ok.mp4" poster="https://res.cloudinary.com/dwkzyfnvc/video/upload/so_0,q_auto/v1791832262/wolfman_ok.jpg" width="960" height="540" playsinline loop preload="auto" aria-label="wolfman"></video>
    <div class="avance" role="progressbar" aria-label="Avance del vídeo" aria-valuemin="0" aria-valuemax="100"><i id="barra"></i></div>
  </div>
  <div class="mandos">
    <div class="hueco"><button class="boton" id="play" aria-label="Play">
      <svg viewBox="0 0 100 100"><polygon points="28,14 28,86 88,50"/></svg></button></div>
    <div class="hueco"><button class="boton" id="pausa" aria-label="Pausa">
      <svg viewBox="0 0 100 100"><rect x="20" y="14" width="22" height="72"/><rect x="58" y="14" width="22" height="72"/></svg></button></div>
  </div>
</main>

<script>
// el vídeo, alojado en Cloudinary
const v=document.getElementById('v');

const play=document.getElementById('play');
const pausa=document.getElementById('pausa');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// estado del botón de play respecto a su hueco
const s={x:0,y:0,r:0,vx:0,vy:0,vr:0,sentado:true,anim:0};
function pinta(){play.style.transform=`translate(${s.x}px,${s.y}px) rotate(${s.r}deg)`;}

// límites de la pantalla, en el mismo sistema que translate (relativo al hueco)
const hueco=play.parentElement;
function limites(){
  const h=hueco.getBoundingClientRect();
  const vw=document.documentElement.clientWidth, vh=window.innerHeight;
  return {suelo:vh-h.bottom-6, izq:-h.left+4, der:vw-h.right-4, techo:-h.top+4};
}
function encierra(){const L=limites();
  s.x=Math.min(L.der,Math.max(L.izq,s.x)); s.y=Math.min(L.suelo,Math.max(L.techo,s.y));}

// se desprende: cae con gravedad, rebota en el borde de abajo y en los laterales, rueda y se para
function desprender(rapido,ladoFijo){
  s.sentado=false; play.classList.add('suelto'); play.setAttribute('aria-label','Play (suelto: arrástralo a su sitio)');
  const lado=ladoFijo||(Math.random()<.5?-1:1);
  s.vx=lado*(1.5+Math.random()*2.5); s.vy=rapido?4:-1.5-Math.random()*1.5; s.vr=lado*(rapido?4:2);
  const g=rapido?0.95:0.55;
  if(reduce){const L=limites();s.y=L.suelo;s.x=Math.min(L.der,Math.max(L.izq,lado*60));s.r=lado*20;pinta();return;}
  const radio=play.offsetWidth/2;
  let t0=performance.now()+(rapido?0:120); // sin rapido, un instante colgando antes de soltarse
  cancelAnimationFrame(s.anim);
  const paso=now=>{
    if(now<t0){s.r=Math.sin((now-t0)/18)*1.5*lado;pinta();s.anim=requestAnimationFrame(paso);return;}
    const L=limites();
    s.vy+=g; s.x+=s.vx; s.y+=s.vy;
    let enSuelo=false;
    if(s.y>=L.suelo){ s.y=L.suelo; enSuelo=true;
      if(s.vy>2){ s.vy=-s.vy*0.5; s.vx*=0.85; } else s.vy=0; }
    if(s.x<=L.izq){s.x=L.izq; s.vx=Math.abs(s.vx)*0.6;}
    if(s.x>=L.der){s.x=L.der; s.vx=-Math.abs(s.vx)*0.6;}
    if(enSuelo){ s.vx*=0.97; s.vr=s.vx/radius*57.3; } else s.vr*=0.99;
    s.r+=s.vr; pinta();
    if(enSuelo && s.vy===0 && Math.abs(s.vx)<0.05) return;
    s.anim=requestAnimationFrame(paso);
  };
  const radius=radio;
  s.anim=requestAnimationFrame(paso);
}

// vuelve a encajar con un pequeño resorte
function encajar(alTerminar){
  cancelAnimationFrame(s.anim);
  const ini={x:s.x,y:s.y,r:s.r}, d=reduce?1:260, t0=performance.now();
  const e=t=>1-Math.pow(1-t,3)*Math.cos(t*Math.PI*1.2);
  const paso=now=>{const t=Math.min(1,(now-t0)/d),k=e(t);
    s.x=ini.x*(1-k);s.y=ini.y*(1-k);s.r=ini.r*(1-k);pinta();
    if(t<1)s.anim=requestAnimationFrame(paso);else{s.x=s.y=s.r=0;pinta();alTerminar&&alTerminar();}};
  s.anim=requestAnimationFrame(paso);
  s.sentado=true; play.classList.remove('suelto'); play.setAttribute('aria-label','Play');
}

// arrastrar cuando está suelto
let drag=null, recienSoltado=false;
play.addEventListener('pointerdown',e=>{
  if(s.sentado)return;
  cancelAnimationFrame(s.anim);
  drag={px:e.clientX,py:e.clientY,x:s.x,y:s.y,movido:false};
  play.setPointerCapture(e.pointerId); play.classList.add('arrastrando');
});
play.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.px, dy=e.clientY-drag.py;
  if(Math.hypot(dx,dy)>3)drag.movido=true;
  s.x=drag.x+dx; s.y=drag.y+dy; encierra(); pinta();
});
function soltar(){
  if(!drag)return; play.classList.remove('arrastrando');
  const radio=play.offsetWidth*0.35;
  if(Math.hypot(s.x,s.y)<radio) encajar(arrancar);   // al volver a su sitio, sigue reproduciendo
  drag=null; recienSoltado=true; setTimeout(()=>recienSoltado=false,0);
}
play.addEventListener('pointerup',soltar);
play.addEventListener('pointercancel',soltar);

// al dar play: se enciende, y a los 3 s se cae, se apaga y el vídeo se para
let caida=0, sacudida=0, ladoSacudida=1;
function apagar(){clearTimeout(caida);clearTimeout(sacudida);caida=sacudida=0;play.classList.remove('activo');}
// a los 2 s: un golpe seco que lo deja descuadrado, el vídeo sigue
function sacudir(){
  ladoSacudida=Math.random()<.5?-1:1;
  const fin={x:ladoSacudida*7,y:6,r:ladoSacudida*11};
  if(reduce){Object.assign(s,fin);pinta();return;}
  const t0=performance.now(), d=90;
  const paso=now=>{const t=Math.min(1,(now-t0)/d), k=t<1?1+0.35*Math.sin(t*Math.PI):1;
    s.x=fin.x*k*Math.min(1,t*2); s.y=fin.y*k*Math.min(1,t*2); s.r=fin.r*k*Math.min(1,t*2); pinta();
    if(t<1)s.anim=requestAnimationFrame(paso);};
  cancelAnimationFrame(s.anim); s.anim=requestAnimationFrame(paso);
}
function arrancar(){
  if(!s.sentado||caida)return;
  v.play().catch(()=>{});
  play.classList.add('activo');
  sacudida=setTimeout(sacudir,2000);
  caida=setTimeout(()=>{apagar();v.pause();desprender(true,ladoSacudida);},3000);
}
play.addEventListener('click',()=>{if(!recienSoltado)arrancar();});   // suelto no hace nada: hay que devolverlo
// teclado: si está suelto, Intro lo devuelve a su sitio
play.addEventListener('keydown',e=>{if(!s.sentado&&(e.key==='Enter'||e.key===' ')){e.preventDefault();encajar(arrancar);}});

pausa.addEventListener('click',()=>{v.pause();if(caida){apagar();if(s.x||s.y||s.r)encajar();}});
// línea de avance
const barra=document.getElementById('barra'), pb=barra.parentElement;
(function avance(){const d=v.duration||0,p=d?v.currentTime/d*100:0;
  barra.style.width=p+'%';pb.setAttribute('aria-valuenow',Math.round(p));requestAnimationFrame(avance);})();
// si cambia la ventana o haces scroll, el botón suelto sigue dentro de la pantalla
function recoloca(){if(!s.sentado&&!drag){encierra();pinta();}}
addEventListener('resize',recoloca); addEventListener('scroll',recoloca,{passive:true});
</script>
</body>
</html>
