<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;

const img = new Image();
img.src = 'caballito-alas-arriba.webp';
/* alas: de vez en cuando aletea alternando con el fotograma de alas abajo */
const imgAbajo = new Image();
imgAbajo.src = 'caballito-alas-abajo.webp';
const aleteo = { prox: performance.now() + 2500 + Math.random() * 4000, cambios: 0, t: 0, abajo: false };
function alasActual(now) {
  if (aleteo.cambios > 0) {
    if (now >= aleteo.t) { aleteo.abajo = !aleteo.abajo; aleteo.cambios--; aleteo.t = now + 140; }
    if (aleteo.cambios === 0) { aleteo.abajo = false; aleteo.prox = now + 3000 + Math.random() * 6000; }
  } else if (now >= aleteo.prox) {
    aleteo.cambios = 2 * (2 + Math.floor(Math.random() * 3)); aleteo.t = now; 
  }
  return (aleteo.abajo && imgAbajo.complete) ? imgAbajo : img;
}

const s = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  w: 0, h: 0,
  angle: 0,
  av: 0,
  ready: false
};

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (!s.ready) return;
  s.x = Math.min(Math.max(s.x, s.w / 2), W - s.w / 2);
  s.y = Math.min(Math.max(s.y, s.h / 2), H - s.h / 2);
}
window.addEventListener('resize', resize);

img.onload = () => {
  resize();

  s.w = Math.round(Math.min(Math.round(W * (W < 600 ? 0.32 : 0.2)), 280) * 715 / 658); // lienzo más ancho por las alas abiertas: el caballo mantiene su tamaño
  s.h = Math.round(s.w * img.naturalHeight / img.naturalWidth);

  s.x = W * 0.68;
  s.y = H * 0.32;

  const spd = Math.min(W, H) * 0.0016;
  const ang = Math.random() * Math.PI * 2;
  s.vx = Math.cos(ang) * spd;
  s.vy = Math.sin(ang) * spd;
  s.av = (Math.random() - 0.5) * 0.0015;

  s.ready = true;
  loop();
};

function loop() {
  requestAnimationFrame(loop);
  if (!s.ready) return;

  ctx.clearRect(0, 0, W, H);

  s.x += s.vx;
  s.y += s.vy;
  s.angle += s.av;

  const hw = s.w / 2, hh = s.h / 2;

  if (s.x - hw < 0)  { s.x = hw;     s.vx =  Math.abs(s.vx); nudge(); }
  if (s.x + hw > W)  { s.x = W - hw; s.vx = -Math.abs(s.vx); nudge(); }
  if (s.y - hh < 0)  { s.y = hh;     s.vy =  Math.abs(s.vy); nudge(); }
  if (s.y + hh > H)  { s.y = H - hh; s.vy = -Math.abs(s.vy); nudge(); }

  function nudge() {
    s.av += (Math.random() - 0.5) * 0.0012;
    s.av  = Math.max(-0.005, Math.min(0.005, s.av));
  }

  s.av *= 0.999;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);
  ctx.drawImage(alasActual(performance.now()), -hw, -hh, s.w, s.h);
  ctx.restore();
}
</script>

<script>
/* Portada: pasados 4 s se cae una letra de "Stanley Sunday" y un hado (el de la rana) la vuelve a poner en su sitio, dando un rodeo.
   Cada tercera vez, el nombre entero se escurre por la derecha como un collar y dos hados lo cogen por los extremos y lo recolocan.
   No pasa si el sistema pide reducir el movimiento. */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const nombre=document.querySelector('#nav .name'); if(!nombre)return;
  const txt=nombre.textContent; nombre.textContent='';
  const letras=[...txt].map(ch=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.display='inline-block';if(ch===' ')sp.style.whiteSpace='pre';nombre.appendChild(sp);return sp;});
  nombre.setAttribute('aria-label',txt);
  const azar=(a,b)=>a+Math.random()*(b-a);

  // ── los hados, en píxeles, cada uno en su lienzo
  const MAPA=["........HHHHH........","......HHHHHHHHH......",".....HHHHHHHHHHH.....",".....HSSSSSSSSSH.....",".....hSSESSSESSh.....",".....SSSSSsSSSSS.....",".....BSSSSsSSSSB.....",".....BBSSbbbSSBB.....",".....BBBBBBBBBBB.....","......BBBBBBBBB......","..sSSSSBBBBBBBSSSSs..",".SSSSSSSSSSSSSSSSSSS.","SSS.SSSSSSSSSSSSS.SSS","SSS.SSdSSSSSSSdSS.SSS","SSS.SSSSSSSSSSSSS.SSS","SSS.SSSSSSSSSSSSS.SSS","SsS.SSSSSSSSSSSSS.SsS","SSS.SSSSSSdSSSSSS.SSS","SSS.SSSSSSSSSSSSS.SSS","sSs.sSSSSSSSSSSSs.sSs","....TTTTTTTTTTTTT....","....TTTTTTtTTTTTT....","....TTTTT...TTTTT....","....SSSSS...SSSSS....","....SSSSs...sSSSS....","....SSSSS...SSSSS....","....SSSSs...sSSSS....","....SSSSS...SSSSS....","...FFFFFF...FFFFFF..."];
  let P=3, Q=3; const CW=41, CH=31, OX=10;   // P: píxel del hado en píxeles reales de pantalla (nítido); Q: lo mismo en píxeles CSS
  const osc=(hex,k)=>{const n=parseInt(hex.slice(1),16),f=c=>Math.round(c*k);return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;};
  const PELOS=['#5a3820','#e2bd5a','#1c1c1c'], ALAS=['#f08cb8','#9be0ff','#ffd15a','#b58cff','#8fe08a'], PANTS=['#3a6bd0','#d04a3a','#2a2a2a'];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function crearHado(desde,mano){   // desde: -1 entra por la izquierda, 1 por la derecha; mano: 'd' derecha, 'i' izquierda
    const cv=document.createElement('canvas'); cv.width=CW*P; cv.height=CH*P;
    cv.style.cssText=`position:fixed;left:0;top:0;width:${CW*Q}px;height:${CH*Q}px;z-index:3;pointer-events:none;image-rendering:pixelated;will-change:transform`;
    document.body.appendChild(cv);
    return {cv,g:cv.getContext('2d'),pelo:pick(PELOS),piel:'#e8b48c',ala:pick(ALAS),pant:pick(PANTS),mano:mano||'d',
      x:desde<0?-CW*Q:innerWidth+10, y:azar(innerHeight*.2,innerHeight*.5), vx:0, vy:0, lean:0, lv:0, desde};
  }
  function manoDe(h){const col=h.mano==='d'?OX+19:OX+1;return [h.x+(col+Math.round(h.lean*.3))*Q+Q/2, h.y+22*Q];}
  function vuela(h,tx,ty,vmax){   // dirige al hado para que su mano llegue a (tx,ty); devuelve la distancia que queda
    const [mx,my]=manoDe(h), dx=tx-mx, dy=ty-my, d=Math.hypot(dx,dy), v=Math.min(vmax,d*.08+1.2);
    h.vx+=(dx/(d||1)*v-h.vx)*.12; h.vy+=(dy/(d||1)*v-h.vy)*.12; h.x+=h.vx; h.y+=h.vy; return d;}
  function pinta(h,ts){
    h.lv+=(-h.vx*.35-h.lean)*.12; h.lv*=.86; h.lean=Math.max(-1.4,Math.min(1.4,h.lean+h.lv));   // péndulo
    const g=h.g, ab=Math.floor(ts/70+(h.desde>0?1:0))%2===0?1:.5;
    g.clearRect(0,0,h.cv.width,h.cv.height);
    const px=(x,y,c)=>{g.fillStyle=c;g.fillRect(Math.round(x)*P,Math.round(y)*P,P,P);};
    const elipse=(cx,cy,rx,ry,rot,color)=>{const cs=Math.cos(rot),sn=Math.sin(rot),m=Math.ceil(Math.max(rx,ry))+1;
      for(let y=Math.floor(cy-m);y<=cy+m;y++)for(let x=Math.floor(cx-m);x<=cx+m;x++){const X=x+.5-cx,Y=y+.5-cy,u=(X*cs+Y*sn)/rx,v=(-X*sn+Y*cs)/ry;
        if(u*u+v*v<=1){const c=color(u,v);if(c)px(x,y,c);}}};
    const cx=OX+10.5;
    for(const l of [-1,1]){   // alas de mariposa: grande arriba, pequeña abajo, con borde oscuro, mancha clara y nervio
      elipse(cx+l*(5*ab+7),13,6*ab+1.2,5,l*.5,(u,v)=>{const d=u*u+v*v;if(d>.72)return '#2a1a1a';if((u-l*.3)**2+(v+.25)**2<.06)return '#fff4d8';if(Math.abs(v+u*.2)<.08)return osc(h.ala,.72);return d>.45?osc(h.ala,.85):h.ala;});
      elipse(cx+l*(3.8*ab+6),20,4*ab+1,3.5,l*-.4,(u,v)=>{const d=u*u+v*v;if(d>.62)return '#2a1a1a';return d>.3?osc(h.ala,.8):h.ala;});}
    const col={H:h.pelo,h:osc(h.pelo,.75),S:h.piel,s:osc(h.piel,.84),d:osc(h.piel,.62),B:h.pelo,b:osc(h.pelo,.72),E:'#1d1d1d',T:h.pant,t:osc(h.pant,.75),F:'#3b2416'};
    const n=MAPA.length, curva=j=>Math.max(0,(j-10)/(n-10));   // cuerpo flexible: cuelga de las alas y las piernas se quedan atrás
    MAPA.forEach((fila,j)=>{const off=Math.round(h.lean*curva(j)**1.4*5+Math.sin(ts/310+j*.12)*curva(j)*1.2);
      [...fila].forEach((c,i)=>{if(c!=='.')px(OX+i+off,2+j,col[c]);});});
    h.cv.style.transform=`translate(${Math.round(h.x)}px,${Math.round(h.y)}px)`;
  }
  const fuera=h=>h.y<-CH*Q-20||h.x<-CW*Q-40||h.x>innerWidth+40;
  const clonar=L=>{const c=L.cloneNode(true),cs=getComputedStyle(nombre);
    c.style.cssText=`position:fixed;left:0;top:0;margin:0;font:${cs.font};letter-spacing:0;color:#000;z-index:2;pointer-events:none;will-change:transform;display:inline-block;white-space:pre`;
    document.body.appendChild(c);return c;};

  // ── una letra se cae y un hado la devuelve
  function unaLetra(fin){
    const cand=letras.filter(l=>l.textContent.trim()); const L=pick(cand);
    const r=L.getBoundingClientRect(), clon=clonar(L); L.style.visibility='hidden';
    const AGX=r.width/2, AGY=r.height*.42;   // por dónde la coge: por el trazo de la letra, no por la esquina de su caja
    clon.style.transformOrigin='50% 60%';
    let x=0,y=0,vx=azar(-.6,.6),vy=-1.5,rot=0,vr=azar(-6,6),suelo=innerHeight-r.bottom-4,rebotes=0, fase='cae', t0=0, ruta=[], h=null;
    const pon=()=>{clon.style.transform=`translate(${r.left+x}px,${r.top+y}px) rotate(${rot}deg)`;};
    function paso(ts){
      if(fase==='cae'){vy+=.55;x+=vx;y+=vy;rot+=vr;
        if(y>=suelo){y=suelo;rebotes++;vy=-vy*.38;vx*=.7;vr*=.5;if(rebotes>3||Math.abs(vy)<1.2){vy=0;vr=0;fase='espera';t0=ts;}}
        x=Math.max(-r.left+4,Math.min(innerWidth-r.right-4,x)); pon();}
      else if(fase==='espera'){if(ts-t0>900){fase='viene';h=crearHado(Math.random()<.5?-1:1,'d');}}
      else{
        let tx,ty;
        if(fase==='viene'){tx=r.left+x+AGX;ty=r.top+y+AGY;}
        else if(fase==='lleva'){if(ruta.length)[tx,ty]=ruta[0];else{tx=r.left+AGX;ty=r.top+AGY;}}
        else{tx=h.desde<0?innerWidth+60:-60;ty=-CH*Q-40;}
        const d=vuela(h,tx,ty,fase==='seVa'?7:6);
        if(fase==='viene'&&d<6){fase='lleva';   // no sube recto: un rodeo en S hacia el lado donde hay sitio
          const lx=r.left+x, ly=r.top+y, dir=lx<innerWidth/2?1:-1, alto=ly-r.top;
          ruta=[[lx+dir*azar(90,180),ly-alto*azar(.25,.4)],[r.left-dir*azar(60,140),r.top+alto*azar(.15,.3)],[r.left+dir*azar(20,50),r.top+azar(25,45)]]
            .map(([a,b])=>[Math.max(20,Math.min(innerWidth-40,a)),Math.max(10,b)]);}
        else if(fase==='lleva'&&ruta.length&&d<22)ruta.shift();
        if(fase==='lleva'){const [mx,my]=manoDe(h);x=mx-AGX-r.left;y=my-AGY-r.top;rot*=.9;pon();
          if(!ruta.length&&d<3){L.style.visibility='';clon.remove();fase='seVa';}}
        pinta(h,ts);
        if(fase==='seVa'&&fuera(h)){h.cv.remove();fin();return;}
      }
      requestAnimationFrame(paso);
    }
    pon(); requestAnimationFrame(paso);   // colocar el clon ya en su sitio, sin parpadeo
  }

  // ── el nombre como un collar: se escurre por la derecha, cae, y dos hados lo suben por los extremos
  function collar(fin){
    const nodos=letras.map(L=>{const r=L.getBoundingClientRect();return {L,c:clonar(L),w:r.width,h:r.height,sx:r.left+r.width/2,sy:r.top+r.height/2}});
    nodos.forEach(n=>{n.x=n.sx;n.y=n.sy;n.px=n.x;n.py=n.y;n.L.style.visibility='hidden';});   // sin empujón: empieza a resbalar porque se inclina
    const N=nodos.length, largo=[]; for(let i=0;i<N-1;i++)largo.push(nodos[i+1].sx-nodos[i].sx);
    const x0=nodos[0].sx, mesaY=nodos[0].sy, borde=nodos[N-1].sx+nodos[N-1].w/2;   // el "borde de la mesa": donde acaba el nombre
    let fase='escurre', t0=performance.now(), A=null, B=null, cogeA=false, cogeB=false, tCol=0;
    const suelo=()=>innerHeight-14;
    function cuerda(){
      const cuelgan=nodos.filter(n=>n.mesa===false).length, inclina=Math.min(1,(performance.now()-t0)/1800);   // la "mesa" se va inclinando poco a poco   // lo que cuelga por el borde tira del resto, como un collar resbalando de una mesa
      for(const n of nodos){if(n.fijo)continue;const vx=(n.x-n.px)*.985, vy=(n.y-n.py)*.985;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+.18;
        if(fase==='escurre'&&n.mesa!==false){const v=Math.min(1.6,.12+.05*cuelgan*cuelgan)*inclina;n.px=n.x;n.x+=v;}   // sobre la mesa: se desliza a la velocidad que marca lo que cuelga, sin acumular empujes
        if(fase==='escurre'&&n.mesa===false&&n.x>borde){n.px=n.x-(n.x-n.px)*.6;n.x+=(borde+6-n.x)*.04;}}   // lo que ya cayó no sale disparado: cae pegado al borde
      for(let it=0;it<12;it++){
        for(let i=0;i<N-1;i++){const a=nodos[i],b=nodos[i+1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,e=(d-largo[i])/d;
          const wa=a.fijo?0:(b.fijo?1:.5), wb=b.fijo?0:(a.fijo?1:.5);a.x+=dx*e*wa;a.y+=dy*e*wa;b.x-=dx*e*wb;b.y-=dy*e*wb;}
        for(const n of nodos){if(n.fijo)continue;
          if(n.x>=borde)n.mesa=false; if(fase==='escurre'&&n.mesa===false&&n.x<borde+2&&n.y<mesaY+24)n.x=borde+2;   /* la esquina de la mesa */ if(fase==='escurre'&&n.mesa!==false){n.y=mesaY;n.py=n.y;n.px+=(n.x-n.px)*.002;}   // mientras está sobre la mesa no se levanta: se desliza   // apoyado en la "mesa": se desliza
          if(n.y>=suelo()){n.y=suelo();n.py=n.y;n.px+=(n.x-n.px)*.35;}
          if(n.x>innerWidth-8){n.x=innerWidth-8;} if(n.x<8)n.x=8;}}
    }
    function separa(){   // las letras del montón no se meten unas dentro de otras (empuje suave)
      for(let i=0;i<N;i++)for(let j=i+2;j<N;j++){const a=nodos[i],b=nodos[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=(a.w+b.w)*.42;
        if(d<m){const e=(m-d)/d*.25;if(!a.fijo){a.x-=dx*e;a.y-=dy*e;}if(!b.fijo){b.x+=dx*e;b.y+=dy*e;}}}
      for(const n of nodos){if(n.y>suelo())n.y=suelo();}
    }
    function duerme(){   // lo que ya está quieto en el suelo se queda quieto del todo
      for(const n of nodos){if(n.fijo)continue;const v=Math.hypot(n.x-n.px,n.y-n.py);if(n.y>=suelo()-.5&&v<.25){n.px=n.x;n.py=n.y;}}
    }
    function dibujaCollar(){nodos.forEach((n,i)=>{const a=nodos[Math.max(0,i-1)],b=nodos[Math.min(N-1,i+1)];let ang=Math.atan2(b.y-a.y,b.x-a.x);
      if(n.ang!=null){let d=ang-n.ang;d=Math.atan2(Math.sin(d),Math.cos(d));ang=n.ang+d*.35;} n.ang=ang;   // giro suavizado: sin temblores
      n.c.style.transform=`translate(${(n.x-n.w/2).toFixed(1)}px,${(n.y-n.h/2).toFixed(1)}px) rotate(${ang.toFixed(3)}rad)`;});}
    function paso(ts){
      const T=(ts-t0)/1000;
      if(fase==='escurre'){cuerda();separa();duerme();const quieto=nodos.every(n=>Math.hypot(n.x-n.px,n.y-n.py)<.4);if(T>6||(T>2.5&&quieto)){fase='rescate';A=crearHado(-1,'i');B=crearHado(1,'d');A.y=azar(innerHeight*.3,innerHeight*.5);B.y=azar(innerHeight*.3,innerHeight*.5);}}
      else if(fase==='rescate'||fase==='sube'){
        const a0=nodos[0], aN=nodos[N-1];
        if(fase==='rescate'){
          const dA=cogeA?vuela(A,A.ruta[0][0],A.ruta[0][1],4):vuela(A,a0.x,a0.y,6), dB=cogeB?vuela(B,B.ruta[0][0],B.ruta[0][1],4):vuela(B,aN.x,aN.y,6);
          if(!cogeA&&dA<7){cogeA=true;a0.fijo=true;A.ruta=[[a0.x-30,innerHeight*.45]];}
          if(!cogeB&&dB<7){cogeB=true;aN.fijo=true;B.ruta=[[aN.x+20,innerHeight*.4]];}
          if(cogeA&&cogeB){fase='sube';A.ruta=[[a0.sx-40,a0.sy+90],[a0.sx,a0.sy]];B.ruta=[[aN.sx+50,aN.sy+70],[aN.sx,aN.sy]];}}
        else{let ok=0;for(const h of [A,B]){const [tx,ty]=h.ruta[0],d=vuela(h,tx,ty,h.ruta.length>1?4:3);if(d<14&&h.ruta.length>1)h.ruta.shift();else if(h.ruta.length===1&&d<3)ok++;}
          if(ok===2){fase='coloca';tCol=ts;}}
        if(cogeA){[a0.x,a0.y]=manoDe(A);} if(cogeB){[aN.x,aN.y]=manoDe(B);}
        cuerda();}
      else if(fase==='coloca'){   // los hados sostienen los extremos y el nombre se va tensando hasta quedar en su sitio, sin saltos
        const k=Math.min(1,(ts-tCol)/900), a=.04+.2*k*k;
        nodos.forEach(n=>{n.x+=(n.sx-n.x)*a;n.y+=(n.sy-n.y)*a;n.px=n.x;n.py=n.y;});
        for(const h of [A,B])vuela(h,h===A?nodos[0].sx:nodos[N-1].sx,h===A?nodos[0].sy:nodos[N-1].sy,2);
        if(k>=1&&nodos.every(n=>Math.hypot(n.sx-n.x,n.sy-n.y)<.4&&Math.abs(Math.sin(n.ang||0))<.01&&Math.cos(n.ang||0)>0)){nodos.forEach(n=>{n.x=n.sx;n.y=n.sy;});dibujaCollar();nodos.forEach(n=>{n.L.style.visibility='';n.c.remove();});fase='seVan';}}
      else if(fase==='seVan'){vuela(A,-80,-CH*Q-60,7);vuela(B,innerWidth+80,-CH*Q-60,7);
        if(fuera(A)&&fuera(B)){A.cv.remove();B.cv.remove();fin();return;}}
      if(fase!=='seVan')dibujaCollar();
      if(A){pinta(A,ts);pinta(B,ts);}
      requestAnimationFrame(paso);
    }
    dibujaCollar(); requestAnimationFrame(paso);
  }

  let vez=0;
  function ciclo(){vez++;const dpr=Math.min(3,devicePixelRatio||1);P=Math.max(1,Math.round((innerWidth<600?1.35:2.1)*dpr));Q=P/dpr;const sigue=()=>setTimeout(ciclo,azar(5000,13000));if(vez%3===0)collar(sigue);else unaLetra(sigue);}
  setTimeout(ciclo,4000);
})();
</script>
<script>
/* Portada: a los 6 s entran por abajo a la izquierda dos muñecos de palitos (como el técnico de "play").
   El gordo abre los brazos abarcando toda la web y le dice a Manolo "Manolo, esta es mi web" y "Algún día, todo esto será tuyo";
   Manolo mira hacia arriba moviendo la cabeza. Luego se van por donde vinieron. Una vez por visita; no pasa si se pide reducir el movimiento. */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const NS='http://www.w3.org/2000/svg', R=Math.PI/180;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const ik=(h,f,a,b)=>{const dx=f[0]-h[0],dy=f[1]-h[1],d=Math.min(Math.hypot(dx,dy),a+b-0.01);
    const base=Math.atan2(dy,dx),cc=Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))),ang=base-Math.acos(cc);
    return [h[0]+a*Math.cos(ang),h[1]+a*Math.sin(ang)];};
  const K=()=>Math.max(0.42,Math.min(0.7,innerHeight/1100));   // px por unidad: muñecos pequeños (unos 120 px de alto en escritorio)

  // postura en unidades locales: pies en (50,160), mirando a la derecha
  function geo(M){
    const hipY=92+(M.anda?2*Math.abs(Math.sin(M.ph)):0), hip=[50,hipY];
    let f1,f2;
    if(M.anda){const sn=Math.sin(M.ph),cs=Math.cos(M.ph);f1=[50+18*sn,160-7*Math.max(0,cs)];f2=[50-18*sn,160-7*Math.max(0,-cs)];}
    else{f1=[44,160];f2=[57,160];}
    const lean=M.anda?3:0, neck=[50+lean,hipY-52], sh=[neck[0],neck[1]+8];
    const hd=M.mira||0, head=[neck[0]+16*Math.sin(hd*.35),neck[1]-16*Math.cos(hd*.35)];
    const brazo=(th,be)=>{const e=[sh[0]+26*Math.sin(th*R),sh[1]+26*Math.cos(th*R)];return [e,[e[0]+24*Math.sin((th+be)*R),e[1]+24*Math.cos((th+be)*R)]];};
    let a1,a2;
    if(M.arriba>0){const u=M.arriba, ab=M.abarca||0;   // brazos abiertos hacia arriba, abarcándolo todo
      const sw=M.anda?24*Math.sin(M.ph):4;
      a1=brazo(-sw+(112+ab-(-sw))*u,20*(1-u)+6*u); a2=brazo(sw+(-112-ab-sw)*u,20*(1-u)-6*u);}
    else{const sw=M.anda?24*Math.sin(M.ph):4;a1=brazo(-sw,20);a2=brazo(sw,20);}
    return {hip,neck,head,sh,f1,f2,k1:ik(hip,f1,34,35),k2:ik(hip,f2,34,35),a1,a2};
  }
  function muneco(gordo){
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','-60 -40 220 210'); svg.setAttribute('aria-hidden','true');
    svg.style.cssText='position:fixed;left:0;top:0;z-index:4;pointer-events:none;overflow:visible;will-change:transform';
    svg.innerHTML='<g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
      '<polyline class="p1"/><polyline class="p2"/><polyline class="b2"/>'+
      (gordo?'<ellipse class="tr" fill="#fff"/>':'<polyline class="tr"/>')+
      '<circle class="cab" r="12" fill="#fff"/><circle class="ojo" r="2.2" fill="#111" stroke="none"/><path class="boca" stroke-width="2.5"/>'+
      '<polyline class="b1"/></g>';
    document.body.appendChild(svg);
    const q=n=>svg.querySelector('.'+n);
    return {svg,g:svg.firstChild,gordo,P:{p1:q('p1'),p2:q('p2'),tr:q('tr'),b1:q('b1'),b2:q('b2'),cab:q('cab'),ojo:q('ojo'),boca:q('boca')},
      x:0,facing:1,ph:0,anda:false,arriba:0,abarca:0,mira:0};
  }
  function dibuja(M){
    const k=K(), G=geo(M), P=M.P, y=innerHeight-6;
    M.svg.style.width=220*k+'px'; M.svg.style.height=210*k+'px';
    M.svg.style.transform=`translate(${M.x-110*k}px,${y-200*k}px)`;
    M.g.setAttribute('transform',M.facing<0?'translate(100 0) scale(-1 1)':'');
    P.p1.setAttribute('points',`${G.hip} ${G.k1} ${G.f1}`); P.p2.setAttribute('points',`${G.hip} ${G.k2} ${G.f2}`);
    if(M.gordo){const cx=(G.hip[0]+G.neck[0])/2+3, cy=(G.hip[1]+G.neck[1])/2+4;   // tripa
      P.tr.setAttribute('cx',cx);P.tr.setAttribute('cy',cy);P.tr.setAttribute('rx',19);P.tr.setAttribute('ry',30);}
    else P.tr.setAttribute('points',`${G.hip} ${G.neck}`);
    P.b1.setAttribute('points',`${G.sh} ${G.a1[0]} ${G.a1[1]}`); P.b2.setAttribute('points',`${G.sh} ${G.a2[0]} ${G.a2[1]}`);
    const [hx,hy]=G.head, a=(M.mira||0); P.cab.setAttribute('cx',hx); P.cab.setAttribute('cy',hy);
    // cara de perfil: ojo y boca giran con la mirada (0 = al frente, negativo = hacia arriba)
    const ex=hx+6*Math.cos(a), ey=hy-2+6*Math.sin(a); P.ojo.setAttribute('cx',ex); P.ojo.setAttribute('cy',ey);
    const bx=hx+8*Math.cos(a+.75), by=hy+8*Math.sin(a+.75);
    P.boca.setAttribute('d',M.habla?`M${bx-2},${by} q2,${3+2*Math.abs(Math.sin(performance.now()/90))} 4,0`:`M${bx-2},${by} l4,0`);
  }
  function bocadillo(){
    const b=document.createElement('div');
    b.style.cssText='position:fixed;left:0;top:0;z-index:5;pointer-events:none;font-family:monospace;font-size:14px;line-height:1.3;color:#000;'+
      'background:#fff;border:2px solid #111;border-radius:14px;padding:7px 11px;max-width:220px;white-space:normal;opacity:0;transition:opacity .15s';
    const cola=document.createElement('div');
    cola.style.cssText='position:absolute;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2px solid #111;border-bottom:2px solid #111;transform:rotate(45deg) skew(10deg,10deg)';
    b.appendChild(document.createElement('span')); b.appendChild(cola); document.body.appendChild(b);
    return {b,txt:b.firstChild,cola};
  }

  setTimeout(()=>{
    const k0=K(), gordo=muneco(true), manolo=muneco(false), bo=bocadillo();
    gordo.x=-70*k0; manolo.x=-170*k0;
    const meta=()=>{const k=K();return Math.max(190*k,Math.min(innerWidth*.34,innerWidth-80*k));};
    const andar=(M,tx,dt)=>{const k=K(),d=tx-M.x,v=130*k*dt;if(Math.abs(d)<=v){M.x=tx;M.anda=false;return true;}
      M.anda=true;M.facing=Math.sign(d);M.x+=Math.sign(d)*v;M.ph+=v/(36*k)*Math.PI;return false;};
    const decir=(texto)=>{bo.txt.textContent=texto;bo.b.style.opacity=texto?1:0;};
    const colocaBocadillo=()=>{const k=K(),bw=bo.b.offsetWidth,bh=bo.b.offsetHeight;
      const headX=gordo.x+(gordo.facing>0?2:-2)*k, headY=innerHeight-6-200*k+(40+20)*k;
      let left=Math.max(8,Math.min(innerWidth-bw-8,headX-bw*.35)), top=headY-bh-62*k;
      bo.b.style.transform=`translate(${left}px,${top}px)`; bo.cola.style.left=Math.max(10,Math.min(bw-26,headX-left-8))+'px';};
    let fase='entran', t0=performance.now(), last=t0;
    const cambia=(f,now)=>{fase=f;t0=now;};
    function paso(now){
      const dt=Math.min(.05,(now-last)/1000); last=now; const t=now-t0;
      switch(fase){
        case 'entran':{const a=andar(gordo,meta(),dt), b=andar(manolo,meta()-100*K(),dt); if(a&&b)cambia('gira',now);break;}
        case 'gira':{if(t>250){gordo.facing=-1;} if(t>500)cambia('abre',now);break;}   // el gordo se vuelve hacia Manolo
        case 'abre':{gordo.arriba=ease(Math.min(1,t/600)); manolo.mira=-50*R*ease(Math.min(1,t/600)); if(t>=600){cambia('dice1',now);}break;}
        case 'dice1':case 'dice2':{
          const largo=fase==='dice1'?2600:3200;
          gordo.habla=t<largo-400; gordo.abarca=12*Math.sin(t/650);
          decir(fase==='dice1'?'Manolo, esta es mi web':'Algún día, todo esto será tuyo');
          manolo.mira=(-80+38*Math.sin((now/1000)*2.6))*R;   // mira hacia arriba moviendo la cabeza
          if(t>=largo){if(fase==='dice1'){decir('');cambia('pausa',now);}else{decir('');cambia('baja',now);}}break;}
        case 'pausa':{gordo.habla=false; manolo.mira=(-80+38*Math.sin((now/1000)*2.6))*R; if(t>350)cambia('dice2',now);break;}
        case 'baja':{const u=ease(Math.min(1,t/500));gordo.arriba=1-u;manolo.mira*=.9;if(t>=600){gordo.arriba=0;manolo.mira=0;cambia('sevan',now);}break;}
        case 'sevan':{const k=K();const a=andar(manolo,-160*k,dt), b=andar(gordo,-160*k,dt);
          if(a&&b){gordo.svg.remove();manolo.svg.remove();bo.b.remove();return;}break;}
      }
      dibuja(manolo); dibuja(gordo); if(fase.startsWith('dice')||fase==='pausa')colocaBocadillo();
      requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  },6000);
})();
</script>
