<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;

const img = new Image();
img.src = 'caballitosalchicha.png';

const s = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  w: 0, h: 0,
  angle: 0,
  av: 0,
  ready: false
};

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (!s.ready) return;
  s.x = Math.min(Math.max(s.x, s.w / 2), W - s.w / 2);
  s.y = Math.min(Math.max(s.y, s.h / 2), H - s.h / 2);
}
window.addEventListener('resize', resize);

img.onload = () => {
  resize();

  s.w = Math.min(Math.round(W * (W < 600 ? 0.32 : 0.2)), 280);
  s.h = Math.round(s.w * img.naturalHeight / img.naturalWidth);

  s.x = W * 0.68;
  s.y = H * 0.32;

  const spd = Math.min(W, H) * 0.0016;
  const ang = Math.random() * Math.PI * 2;
  s.vx = Math.cos(ang) * spd;
  s.vy = Math.sin(ang) * spd;
  s.av = (Math.random() - 0.5) * 0.0015;

  s.ready = true;
  loop();
};

function loop() {
  requestAnimationFrame(loop);
  if (!s.ready) return;

  ctx.clearRect(0, 0, W, H);

  s.x += s.vx;
  s.y += s.vy;
  s.angle += s.av;

  const hw = s.w / 2, hh = s.h / 2;

  if (s.x - hw < 0)  { s.x = hw;     s.vx =  Math.abs(s.vx); nudge(); }
  if (s.x + hw > W)  { s.x = W - hw; s.vx = -Math.abs(s.vx); nudge(); }
  if (s.y - hh < 0)  { s.y = hh;     s.vy =  Math.abs(s.vy); nudge(); }
  if (s.y + hh > H)  { s.y = H - hh; s.vy = -Math.abs(s.vy); nudge(); }

  function nudge() {
    s.av += (Math.random() - 0.5) * 0.0012;
    s.av  = Math.max(-0.005, Math.min(0.005, s.av));
  }

  s.av *= 0.999;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);
  ctx.drawImage(img, -hw, -hh, s.w, s.h);
  ctx.restore();
}
</script>

<script>
/* Pasados 4 s se cae una letra de "Stanley Sunday"; un hado (el de la rana) baja volando, la coge y la vuelve a poner en su sitio.
   Se repite de vez en cuando con otra letra. No pasa si el sistema pide reducir el movimiento. */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const nombre=document.querySelector('#nav .name'); if(!nombre)return;
  const txt=nombre.textContent; nombre.textContent='';
  const letras=[...txt].map(ch=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.display='inline-block';if(ch===' ')sp.style.whiteSpace='pre';nombre.appendChild(sp);return sp;});
  nombre.setAttribute('aria-label',txt);

  // el hado, en píxeles, en su propio lienzo
  const MAPA=["........HHHHH........","......HHHHHHHHH......",".....HHHHHHHHHHH.....",".....HSSSSSSSSSH.....",".....hSSESSSESSh.....",".....SSSSSsSSSSS.....",".....BSSSSsSSSSB.....",".....BBSSbbbSSBB.....",".....BBBBBBBBBBB.....","......BBBBBBBBB......","..sSSSSBBBBBBBSSSSs..",".SSSSSSSSSSSSSSSSSSS.","SSS.SSSSSSSSSSSSS.SSS","SSS.SSdSSSSSSSdSS.SSS","SSS.SSSSSSSSSSSSS.SSS","SSS.SSSSSSSSSSSSS.SSS","SsS.SSSSSSSSSSSSS.SsS","SSS.SSSSSSdSSSSSS.SSS","SSS.SSSSSSSSSSSSS.SSS","sSs.sSSSSSSSSSSSs.sSs","....TTTTTTTTTTTTT....","....TTTTTTtTTTTTT....","....TTTTT...TTTTT....","....SSSSS...SSSSS....","....SSSSs...sSSSS....","....SSSSS...SSSSS....","....SSSSs...sSSSS....","....SSSSS...SSSSS....","...FFFFFF...FFFFFF..."];
  const P=3, CW=41, CH=31, OX=10;   // tamaño del píxel y del lienzo (en píxeles del hado); OX: dónde empieza el cuerpo
  const cv=document.createElement('canvas'); cv.width=CW*P; cv.height=CH*P;
  cv.style.cssText='position:fixed;left:0;top:0;z-index:3;pointer-events:none;image-rendering:pixelated;will-change:transform;display:none';
  document.body.appendChild(cv); const g=cv.getContext('2d');
  const osc=(hex,k)=>{const n=parseInt(hex.slice(1),16),f=c=>Math.round(c*k);return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;};
  const px=(x,y,c)=>{g.fillStyle=c;g.fillRect(Math.round(x)*P,Math.round(y)*P,P,P);};
  function elipse(cx,cy,rx,ry,rot,color){const cs=Math.cos(rot),sn=Math.sin(rot),m=Math.ceil(Math.max(rx,ry))+1;
    for(let y=Math.floor(cy-m);y<=cy+m;y++)for(let x=Math.floor(cx-m);x<=cx+m;x++){const X=x+.5-cx,Y=y+.5-cy,u=(X*cs+Y*sn)/rx,v=(-X*sn+Y*cs)/ry;
      if(u*u+v*v<=1){const c=color(u,v);if(c)px(x,y,c);}}}
  function dibuja(h,ab){   // ab: apertura de las alas (aleteo)
    g.clearRect(0,0,cv.width,cv.height);
    const cx=OX+10.5;
    for(const l of [-1,1]){   // alas de mariposa: grande arriba, pequeña abajo, con borde oscuro, mancha clara y nervio
      elipse(cx+l*(5*ab+7),8,6*ab+1.2,5,l*.45,(u,v)=>{const d=u*u+v*v;if(d>.72)return '#2a1a1a';if((u-l*.3)**2+(v+.25)**2<.06)return '#fff4d8';if(Math.abs(v+u*.2)<.08)return osc(h.ala,.72);return d>.45?osc(h.ala,.85):h.ala;});
      elipse(cx+l*(3.8*ab+7),15,4*ab+1,3.5,l*-.4,(u,v)=>{const d=u*u+v*v;if(d>.62)return '#2a1a1a';return d>.3?osc(h.ala,.8):h.ala;});}
    const col={H:h.pelo,h:osc(h.pelo,.75),S:h.piel,s:osc(h.piel,.84),d:osc(h.piel,.62),B:h.pelo,b:osc(h.pelo,.72),E:'#1d1d1d',T:h.pant,t:osc(h.pant,.75),F:'#3b2416'};
    const n=MAPA.length, curva=j=>Math.max(0,(j-10)/(n-10));   // cuerpo flexible: cuelga de las alas y las piernas se quedan atrás
    MAPA.forEach((fila,j)=>{const off=Math.round((h.lean||0)*curva(j)**1.4*5+Math.sin(performance.now()/310+j*.12)*curva(j)*1.2);
      [...fila].forEach((c,i)=>{if(c!=='.')px(OX+i+off,2+j,col[c]);});});
  }
  const PELOS=['#5a3820','#e2bd5a','#1c1c1c'], ALAS=['#f08cb8','#9be0ff','#ffd15a','#b58cff','#8fe08a'];
  const azar=(a,b)=>a+Math.random()*(b-a);

  function ciclo(){
    const cand=letras.filter(l=>l.textContent.trim()); const L=cand[Math.floor(Math.random()*cand.length)];
    const r=L.getBoundingClientRect();
    const clon=L.cloneNode(true); const cs=getComputedStyle(nombre);
    clon.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;margin:0;font:${cs.font};letter-spacing:0;color:#000;z-index:2;pointer-events:none;will-change:transform;display:inline-block;transform-origin:50% 60%`;
    document.body.appendChild(clon); L.style.visibility='hidden';
    // 1) cae, rebota y se queda en el suelo
    let x=0,y=0,vx=azar(-.6,.6),vy=-1.5,rot=0,vr=azar(-6,6),suelo=innerHeight-r.bottom-4,rebotes=0;
    const h={pelo:PELOS[Math.floor(Math.random()*3)],piel:'#e8b48c',ala:ALAS[Math.floor(Math.random()*ALAS.length)],pant:['#3a6bd0','#d04a3a','#2a2a2a'][Math.floor(Math.random()*3)]};
    let ruta=[], fase='cae', hx=0, hy=0, t0=0, lado=Math.random()<.5?-1:1, hvx=0, hvy=0;
    const pon=()=>{clon.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`;};
    function paso(ts){
      if(fase==='cae'){vy+=.55;x+=vx;y+=vy;rot+=vr;
        if(y>=suelo){y=suelo;rebotes++;vy=-vy*.38;vx*=.7;vr*=.5;if(rebotes>3||Math.abs(vy)<1.2){vy=0;vr=0;fase='espera';t0=ts;}}
        x=Math.max(-r.left+4,Math.min(innerWidth-r.right-4,x)); pon();}
      else if(fase==='espera'){if(ts-t0>900){fase='viene';hx=lado<0?-CW*P:innerWidth+10;hy=azar(innerHeight*.2,innerHeight*.5);cv.style.display='block';}}
      else{   // el hado vuela; su mano (abajo a la derecha del lienzo) es donde lleva la letra
        const manoX=hx+(OX+19+Math.round((h.lean||0)*.3))*P, manoY=hy+22*P;
        let tx,ty;
        if(fase==='viene'){tx=r.left+x;ty=r.top+y;}
        else if(fase==='lleva'){if(ruta.length){[tx,ty]=ruta[0];}else{tx=r.left;ty=r.top;}}
        else{tx=lado<0?innerWidth+60:-CW*P-60;ty=-CH*P-40;}
        const dx=tx-manoX, dy=ty-manoY, d=Math.hypot(dx,dy);
        const vel=fase==='seVa'?7:Math.min(6,d*.08+1.2);
        hvx+=(dx/(d||1)*vel-hvx)*.12; hvy+=(dy/(d||1)*vel-hvy)*.12; hx+=hvx; hy+=hvy;
        if(fase==='viene'&&d<6){fase='lleva';   // no sube recto: da un pequeño rodeo, con alguna curva, antes de dejar la letra
          const lx=r.left+x, ly=r.top+y, dir=lx<innerWidth/2?1:-1, alto=(ly-r.top);   /* el rodeo, hacia el lado donde hay sitio */
          ruta=[[lx+dir*azar(90,180),ly-alto*azar(.25,.4)],[r.left-dir*azar(60,140),r.top+alto*azar(.15,.3)],[r.left+dir*azar(20,50),r.top+azar(25,45)]]
            .map(([a,b])=>[Math.max(20,Math.min(innerWidth-40,a)),Math.max(10,b)]);}
        else if(fase==='lleva'&&ruta.length&&d<22)ruta.shift();
        if(fase==='lleva'){x=manoX-r.left;y=manoY-r.top;rot*=.9;pon();
          if(!ruta.length&&d<3){L.style.visibility='';clon.remove();fase='seVa';}}
        if(fase==='seVa'&&(hy<-CH*P-20||hx<-CW*P-40||hx>innerWidth+40)){cv.style.display='none';setTimeout(ciclo,azar(5000,13000));return;}
        h.lv=(h.lv||0)+(-hvx*.35-(h.lean||0))*.12; h.lv*=.86; h.lean=Math.max(-1.4,Math.min(1.4,(h.lean||0)+h.lv));   // péndulo
        dibuja(h,Math.floor(ts/70)%2===0?1:.5);
        cv.style.transform=`translate(${Math.round(hx)}px,${Math.round(hy)}px)`;
      }
      requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }
  setTimeout(ciclo,4000);
})();
</script>
</body>
