<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>espiral</title>
<meta property="og:title" content="espiral">
<link rel="icon" href="/favicon.ico">
<style>
  /* Una sola pantalla: la espiral se adapta a la pantalla vertical; en horizontal, columna 9:16 */
  :root{
    --bg:#0e1633; --line:#f25c1a; --ball:#d93a2b; --ui:rgba(255,255,255,0.55); --ui-hi:#ffffff;
    --font-ui:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ui-hi);overflow:hidden;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
    box-sizing:border-box;}
  #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  canvas{display:block;flex:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #again{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));
    background:none;border:0;color:var(--ui);font:500 22px/1 var(--font-ui);padding:10px;cursor:pointer;}
  #again:hover,#again:focus-visible{color:var(--ui-hi);}
  #again:focus-visible{outline:2px solid var(--ui-hi);outline-offset:2px;border-radius:6px;}
</style>

</head><body style="margin:0">
<div id="stage"><canvas id="cv" aria-label="Espiral de líneas con tres bolas que se pueden arrastrar"></canvas></div>
<button id="again" type="button" aria-label="Reiniciar">↺</button>

<script>
(()=>{
const CFG={tension:0.85,loops:9,lineWidth:10,circleRadius:60,
  lineColor:'#f25c1a',circleColor:'#d93a2b',bg:'#0e1633',
  idleCollapse:5000,   // ms sin tocar tras aterrizar las bolas → colapso
  afterTouch:3500,     // ms tras soltar una bola → colapso
  slipWrap:150,        // grados: si una línea envuelve una bola más que esto, se le escurre por detrás
  fling:1.6,           // golpe rápido: cuánto más rápido que la bola salen despedidas las líneas
  flingFrom:1.5,       // px por paso de física a partir de los que la bola empieza a dar latigazo
  gravityHold:2500,    // ms tras soltar una bola con la gravedad entera
  gravityPushed:1,  // fracción de la gravedad que sienten, antes del desplome, las líneas desplazadas por una bola
  };

const cv=document.getElementById('cv'), stage=document.getElementById('stage');
const S={}; // estado

function buildSpiral(w,h,margin,gap,loops){
  let left=margin,right=w-margin,top=margin,bottom=h-margin;
  const pts=[[left,top]];
  for(let i=0;i<loops;i++){
    pts.push([right,top]); pts.push([right,bottom]); pts.push([left,bottom]);
    top+=gap; pts.push([left,top]);
    left+=gap; right-=gap; bottom-=gap;
  }
  return pts;
}

function setup(){
  // la espiral se construye con la proporción de la pantalla (vertical); en horizontal, columna 9:16
  S.H=800; S.W=Math.round(800*S.aspect); S.OUTW=1080; S.OUTH=Math.round(1080*S.aspect);
  S.rot=S.OUTW/S.H;
  S.ctx=cv.getContext('2d');
  S.margin=76; const gap=34;
  const maxLoops=Math.floor(((S.H/2)-S.margin)/gap);
  S.loops=Math.max(2,Math.min(maxLoops,CFG.loops));
  S.R=CFG.circleRadius; S.lw=CFG.lineWidth;

  const corners=buildSpiral(S.W,S.H,S.margin,gap,S.loops);
  if(corners.length>2) corners.pop();
  const step=16, xs=[corners[0][0]], ys=[corners[0][1]], rest=[], pegs=[0];
  let total=0, first=0;
  for(let k=1;k<corners.length;k++){
    const a=corners[k-1], b=corners[k];
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.max(1,Math.round(L/step));
    for(let s=1;s<=n;s++){ xs.push(a[0]+(b[0]-a[0])*s/n); ys.push(a[1]+(b[1]-a[1])*s/n); rest.push(L/n); }
    pegs.push(xs.length-1);
    total+=L; if(k<=4) first+=L;
  }
  const N=xs.length; S.N=N;
  S.bx=Float64Array.from(xs); S.by=Float64Array.from(ys);
  S.rest=Float64Array.from(rest); S.pegs=pegs;
  S.X=new Float64Array(N); S.Y=new Float64Array(N);
  S.PX=new Float64Array(N); S.PY=new Float64Array(N); S.LX=new Float64Array(N); S.LY=new Float64Array(N); S.pass=new Uint8Array(N); S.quiet=0;
  S.IW=new Float32Array(N);
  S.minD=S.lw+4; S.cs=S.minD+step/2+1;
  S.gw=Math.ceil(S.W/S.cs)+3; S.gh=Math.ceil(S.H/S.cs)+3;
  const cells=S.gw*S.gh;
  S.cellStart=new Int32Array(cells+1); S.cellFill=new Int32Array(cells);
  S.items=new Int32Array(N); S.cid=new Int32Array(N);

  S.g=2200; S.floorX=S.W-14;   // abajo en vertical = +x en diseño
  S.drawStart=350; S.drawDur=4000; S.cDur=1600; S.STAG=200;
  const f=first/total;
  const u=f<0.5?Math.cbrt(f/4):1-Math.cbrt(2*(1-f))/2;
  S.cT0=S.drawStart+u*S.drawDur;
  S.contactStart=S.cT0+250;
  S.releaseGap=28;
  S.hMs=1000/360;
}

function initBalls(){
  const dX=Math.round(S.W*1090/1600),dY=292;
  S.balls=[
    {sx:dX,sy:dY-470,ex:dX,ey:dY,delay:0},
    {sx:S.W-dX,sy:dY-470,ex:S.W-dX,ey:dY,delay:S.STAG},
    {sx:S.W/2,sy:S.H+320,ex:S.W/2,ey:S.H-200,delay:2*S.STAG}
  ].map(b=>Object.assign(b,{x:b.sx,y:b.sy,px:b.sx,py:b.sy,on:false,wasOn:false,landed:false,held:null,tx:0,ty:0}));
}

function initPhysics(){
  S.X.set(S.bx); S.Y.set(S.by); S.PX.set(S.bx); S.PY.set(S.by);
  S.IW.fill(1); S.IW[0]=0; S.IW[S.N-1]=0;
  // ojales: cada esquina es un punto fijo por el que la línea pasa y puede deslizarse (así no se amontona contra el vértice)
  const nP=S.pegs.length;
  S.eyeOn=new Uint8Array(nP); S.eyeSeg=new Int32Array(nP); S.eyeU=new Float64Array(nP);
  for(let q=0;q<nP;q++){ const p=S.pegs[q]; S.eyeOn[q]=(q>0&&q<nP-1)?1:0; S.eyeSeg[q]=Math.max(0,p-1); S.eyeU[q]=1; }
  S.segEye=new Int32Array(S.N).fill(-1); for(let q=1;q<nP-1;q++) S.segEye[S.eyeSeg[q]]=q;
  S.collapsing=false; S.pass.fill(0); S.touched=false; S.landedAt=Infinity; S.released=0; S.collapseAt=Infinity; S.settled=false; S.allLanded=false;
  initBalls();
}

const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-11*x);

function updateBalls(t,h){
  const R=S.R, B=S.balls;
  let landedCount=0;
  for(let i=0;i<B.length;i++){
    const b=B[i];
    b.wasOn=b.on; b.px=b.x; b.py=b.y;
    if(!b.landed){
      const r=Math.max(0,Math.min(1,(t-S.cT0-250-b.delay)/S.cDur));
      b.on=r>0;
      const e=easeOutExpo(r);
      b.x=b.sx+(b.ex-b.sx)*e; b.y=b.sy+(b.ey-b.sy)*e;
      if(r>=1) b.landed=true;
    } else if(b.held!==null){
      // la bola sigue al dedo con un poco de inercia y un paso máximo para no atravesar líneas
      let dx=(b.tx-b.x)*Math.min(1,h/16), dy=(b.ty-b.y)*Math.min(1,h/16);
      const m=Math.hypot(dx,dy), cap=12;
      if(m>cap){ dx*=cap/m; dy*=cap/m; }
      b.x+=dx; b.y+=dy;
      b.vx=(b.vx||0)*0.8+dx*0.2; b.vy=(b.vy||0)*0.8+dy*0.2;
      b.x=Math.max(R,Math.min(S.W-R,b.x)); b.y=Math.max(R,Math.min(S.H-R,b.y));
      for(let j=0;j<B.length;j++){
        if(j===i||!B[j].on) continue;
        const ox=b.x-B[j].x, oy=b.y-B[j].y, d=Math.hypot(ox,oy)||1e-6, md=2*R+2;
        if(d<md){ b.x=B[j].x+ox/d*md; b.y=B[j].y+oy/d*md; }
      }
    }
    if(b.landed) landedCount++;
  }
  if(!S.allLanded && landedCount===B.length){
    S.allLanded=true; S.landedAt=t; S.collapseAt=t+CFG.idleCollapse;
  }
}

function step(t,h){
  // mientras se mueve una bola, y 2,5 s después, la gravedad vuelve del todo: lo empujado se escurre hacia abajo
  if(S.balls.some(b=>b.held!==null)) S.touchT=t;
  const wake=Math.max(0,Math.min(1,(t-(S.touchT||-1e9)-CFG.gravityHold)/1000));
  const slow=(S.slowness||0)*wake;
  updateBalls(t,h);
  if(t<S.contactStart) return;
  const N=S.N,X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW;
  S.LX.set(X); S.LY.set(Y);
  if(!S.collapsing && t>=S.collapseAt) S.collapsing=true;
  const col=S.collapsing;
  if(col){
    const k=Math.floor((t-S.collapseAt)/S.releaseGap);
    while(S.released<=k && S.released<S.pegs.length){ const q=S.released; if(S.eyeOn[q]){ S.eyeOn[q]=0; S.segEye[S.eyeSeg[q]]=-1; } if(q===0) IW[0]=1; if(q===S.pegs.length-1) IW[S.N-1]=1; S.released++; }
  }
  // enfriamiento: si nada se mueve (bolas quietas, sin dedo, colapso ya soltado), las líneas se van frenando
  // hasta quedarse quietas del todo; así no tiemblan. Cualquier toque lo reinicia.
  // enfriamiento por movimiento, no por reloj: cuando el montón casi no se mueve, se frena más para que acabe de pararse
  const live=Math.max(0,1-(t-(S.touchT||-1e9))/1500), vmax=VMAX+6*live;   // justo tras mover una bola, lo lanzado puede volar rápido
  const hs=h/1000, damp=Math.exp(-((col?1.5:6-3.5*live)+slow*60)*hs), ax=S.g*hs*hs*(1-slow), gpre=CFG.gravityPushed;
  const bx=S.bx, by=S.by;
  for(let i=0;i<N;i++){
    if(IW[i]===0) continue;
    let vx=(X[i]-PX[i])*damp, vy=(Y[i]-PY[i])*damp;
    const v2=vx*vx+vy*vy; if(v2>vmax*vmax){ const f=vmax/Math.sqrt(v2); vx*=f; vy*=f; }
    // antes del desplome solo pesa lo que ha sido empujado fuera de su sitio: así la espiral intacta no se comba
    // y lo que una bola ha desplazado se escurre hacia abajo
    let g=ax;
    if(!col){ const dev=Math.hypot(X[i]-bx[i],Y[i]-by[i]); g=dev<=30?0:ax*gpre*Math.min(1,(dev-30)/60); }
    PX[i]=X[i]; PY[i]=Y[i]; X[i]+=vx+g; Y[i]+=vy;
  }
  viscous(col?0.5:0.35);
  buildGrid();
  const ten=CFG.tension;
  const tfPre=0.982-0.012*ten, tf=col?tfPre+(1-tfPre)*Math.min(1,(t-S.collapseAt)/1500):tfPre,   // la tensión se afloja poco a poco al desplomarse, no de golpe
   k=col?0.85:ten, sm=col?0.08*(1-slow):0.12;   // en el montón, el alisado y la rigidez se apagan al pararse: si no, pelean con los choques y nunca descansa
  for(let it=0;it<4;it++){
    solveDist(it&1,tf,k);
    bend(col?0.12*(1-slow):0.18);
    smooth(sm);
    if(it&1) contacts(col?0.12:0.05);   // choques en 2 de las 4 vueltas: igual de estable y más barato
    collideBalls();
    eyelets();
  }
  slipOff();
  bounds();   // nada se sale de la pantalla, tampoco antes del desplome
  // reposo: si en este paso nada se ha movido de verdad (media y máximo), diez pasos seguidos, se congela todo
  let sum=0, mx=0;
  for(let i=0;i<N;i++){ const d=Math.hypot(X[i]-S.LX[i],Y[i]-S.LY[i]); sum+=d; if(d>mx) mx=d; }
  const mean=S.meanStep=sum/N, quietNow=mean<0.004 && mx<0.35;
  S.quiet=quietNow?S.quiet+1:0;
  S.calm=mean<0.02?(S.calm||0)+1:0;   // casi todo parado durante 1 s: se congela aunque algún punto siga bailando
  // 0 = todo en marcha · 1 = casi parado (media < 0,05 px por paso)
  S.slowness=Math.max(0,Math.min(1,1-(mean-0.02)/0.1));
  S.settled=S.quiet>=10 || S.calm>=360;
  if(S.settled){ PX.set(X); PY.set(Y); }
}

const VMAX=4, CMAX=1.2, BMAX=0.3, EYE_LET=1.3;   // EYE_LET: estiramiento junto a un ojal a partir del cual la esquina se deshace   // px por paso de física: menos que medio grosor de choque
function viscous(c){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,n=S.N-1;
  for(let i=0;i<n;i++){
    const wa=IW[i], wb=IW[i+1], ws=wa+wb; if(ws===0) continue;
    const dvx=(X[i+1]-PX[i+1])-(X[i]-PX[i]), dvy=(Y[i+1]-PY[i+1])-(Y[i]-PY[i]);
    const s=c/ws;
    PX[i]-=dvx*s*wa; PY[i]-=dvy*s*wa; PX[i+1]+=dvx*s*wb; PY[i+1]+=dvy*s*wb;
  }
}
function solveDist(rev,tf,k){
  const X=S.X,Y=S.Y,IW=S.IW,R=S.rest,n=S.N-1;
  for(let q=0;q<n;q++){
    const i=rev?n-1-q:q, j=i+1;
    const wa=IW[i], wb=IW[j], ws=wa+wb; if(ws===0) continue;
    const dx=X[j]-X[i], dy=Y[j]-Y[i], d=Math.sqrt(dx*dx+dy*dy)||1e-6;
    let c=d-R[i]*tf; if(c<0) c*=0.5;
    const f=c/(d*ws)*k;
    X[i]+=dx*f*wa; Y[i]+=dy*f*wa; X[j]-=dx*f*wb; Y[j]-=dy*f*wb;
  }
}
function bend(k){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,R=S.rest,n=S.N-2;
  const SE=S.segEye;
  for(let i=0;i<n;i++){
    if(IW[i+1]===0||SE[i]>=0||SE[i+1]>=0) continue;
    const wa=IW[i], wb=IW[i+2], ws=wa+wb; if(ws===0) continue;
    const dx=X[i+2]-X[i], dy=Y[i+2]-Y[i], d=Math.sqrt(dx*dx+dy*dy)||1e-6;
    const r=(R[i]+R[i+1])*0.985; if(d>=r) continue;
    let f=(d-r)/(d*ws)*k; const fm=BMAX/d; if(f<-fm) f=-fm;   // sin latigazos: una esquina que se suelta se abre en varios pasos
    const ax=dx*f*wa, ay=dy*f*wa, bx=dx*f*wb, by=dy*f*wb;
    X[i]+=ax; Y[i]+=ay; PX[i]+=ax; PY[i]+=ay;
    X[i+2]-=bx; Y[i+2]-=by; PX[i+2]-=bx; PY[i+2]-=by;
  }
}
function smooth(s){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,n=S.N-1;
  const SE=S.segEye;
  for(let i=1;i<n;i++){
    if(IW[i]===0||SE[i-1]>=0||SE[i]>=0) continue;
    let ox=((X[i-1]+X[i+1])*0.5-X[i])*s, oy=((Y[i-1]+Y[i+1])*0.5-Y[i])*s;
    X[i]+=ox; Y[i]+=oy; PX[i]+=ox; PY[i]+=oy;
  }
}
function buildGrid(){   // rejilla de segmentos, colocados por su punto medio
  const cs=S.cs,gw=S.gw,gh=S.gh,cnt=S.cellStart,fill=S.cellFill,items=S.items,cid=S.cid,X=S.X,Y=S.Y,M=S.N-1;
  const cells=gw*gh;
  cnt.fill(0);
  for(let i=0;i<M;i++){
    let cx=Math.floor((X[i]+X[i+1])*0.5/cs)+1, cy=Math.floor((Y[i]+Y[i+1])*0.5/cs)+1;
    if(cx<0)cx=0; else if(cx>=gw)cx=gw-1;
    if(cy<0)cy=0; else if(cy>=gh)cy=gh-1;
    const c=cy*gw+cx; cid[i]=c; cnt[c+1]++;
  }
  for(let c=1;c<=cells;c++) cnt[c]+=cnt[c-1];
  fill.set(cnt.subarray(0,cells));
  for(let i=0;i<M;i++) items[fill[cid[i]]++]=i;
}
function contacts(fr){
  const md=S.minD,md2=md*md,gw=S.gw,gh=S.gh,cnt=S.cellStart,items=S.items;
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,N=S.N;
  const cs=S.cs;
  for(let i=0;i<N;i++){
    const wi=IW[i];
    let cx=Math.floor(X[i]/cs)+1, cy=Math.floor(Y[i]/cs)+1;
    if(cx<0)cx=0; else if(cx>=gw)cx=gw-1;
    if(cy<0)cy=0; else if(cy>=gh)cy=gh-1;
    for(let oy=-1;oy<=1;oy++){
      const yy=cy+oy; if(yy<0||yy>=gh) continue;
      for(let ox=-1;ox<=1;ox++){
        const xx=cx+ox; if(xx<0||xx>=gw) continue;
        const cc=yy*gw+xx;
        for(let k=cnt[cc],e=cnt[cc+1];k<e;k++){
          const sg=items[k];
          {
            if(sg>=i-2&&sg<=i+1) continue;
            const ax=X[sg],ay=Y[sg],ex=X[sg+1]-ax,ey=Y[sg+1]-ay;
            const L2=ex*ex+ey*ey||1e-9;
            let u=((X[i]-ax)*ex+(Y[i]-ay)*ey)/L2; u=u<0?0:u>1?1:u;
            let dx=X[i]-(ax+ex*u), dy=Y[i]-(ay+ey*u); const d2=dx*dx+dy*dy;
            if(d2>=md2) continue;
            const wa=IW[sg], wb=IW[sg+1], ua=1-u, den=wi+wa*ua*ua+wb*u*u; if(den===0) continue;
            let d=Math.sqrt(d2), nx, ny;
            if(d<1e-6){ const l=Math.sqrt(L2); nx=-ey/l; ny=ex/l; } else { nx=dx/d; ny=dy/d; }
            let lam=(md-d)/den; if(lam>CMAX) lam=CMAX;   // sin teletransportes: un solape grande se deshace en varios pasos
            const pi=wi*lam, pa=wa*ua*lam, pb=wb*u*lam;
            X[i]+=nx*pi; Y[i]+=ny*pi; PX[i]+=nx*pi; PY[i]+=ny*pi;
            X[sg]-=nx*pa; Y[sg]-=ny*pa; PX[sg]-=nx*pa; PY[sg]-=ny*pa;
            X[sg+1]-=nx*pb; Y[sg+1]-=ny*pb; PX[sg+1]-=nx*pb; PY[sg+1]-=ny*pb;
            // rozamiento y sin rebote: se frena la velocidad relativa
            const vix=X[i]-PX[i], viy=Y[i]-PY[i];
            const vqx=ua*(X[sg]-PX[sg])+u*(X[sg+1]-PX[sg+1]), vqy=ua*(Y[sg]-PY[sg])+u*(Y[sg+1]-PY[sg+1]);
            const rvx=vix-vqx, rvy=viy-vqy, vn=rvx*nx+rvy*ny;
            let jx=(rvx-vn*nx)*fr, jy=(rvy-vn*ny)*fr;
            if(vn<0){ jx+=vn*nx; jy+=vn*ny; }
            const ki=wi/den, ka=wa*ua/den, kb=wb*u/den;
            PX[i]+=jx*ki; PY[i]+=jy*ki;
            PX[sg]-=jx*ka; PY[sg]-=jy*ka; PX[sg+1]-=jx*kb; PY[sg+1]-=jy*kb;
          }
        }
      }
    }
  }
}
function collideBalls(){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,N=S.N;
  const rb=S.R+S.lw*0.5+1, rb2=rb*rb, mu=S.collapsing?0.35:0.2;
  const PASS=S.pass, clear=rb+26;
  for(let bi=0;bi<S.balls.length;bi++){ const B=S.balls[bi], bit=1<<bi;
    if(!B.on) continue;
    const bvx=B.wasOn?B.x-B.px:0, bvy=B.wasOn?B.y-B.py:0;
    const sp=Math.hypot(B.vx||0,B.vy||0), fl=B.held!==null?Math.max(0,Math.min(1,(sp-CFG.flingFrom)/3)):0;   // 0 = despacio · 1 = muy rápido
    for(let i=0;i<N;i++){
      if(IW[i]===0) continue;
      const dx=X[i]-B.x; if(dx>clear||dx<-clear) continue;
      if(PASS[i]&bit){ const dy0=Y[i]-B.y; if(dx*dx+dy0*dy0>clear*clear) PASS[i]&=~bit; continue; }   // la línea está pasando por detrás de la bola
      if(dx>rb||dx<-rb) continue;
      const dy=Y[i]-B.y; if(dy>rb||dy<-rb) continue;
      const d2=dx*dx+dy*dy; if(d2>=rb2) continue;
      const d=Math.sqrt(d2)||1e-6, nx=dx/d, ny=dy/d;
      const vx=X[i]-PX[i], vy=Y[i]-PY[i];
      X[i]=B.x+nx*rb; Y[i]=B.y+ny*rb;
      let rx=vx-bvx, ry=vy-bvy, vn=rx*nx+ry*ny;
      if(vn<0){ rx-=vn*nx; ry-=vn*ny; vn=0; }
      rx-=(rx-vn*nx)*mu; ry-=(ry-vn*ny)*mu;
      // golpe rápido: la línea sale despedida (rebota más rápido que la bola), como un latigazo
      const bn=bvx*nx+bvy*ny;
      if(bn>0 && fl>0){ const kick=bn*CFG.fling*fl; if(rx*nx+ry*ny<kick){ const add=kick-(rx*nx+ry*ny); rx+=nx*add; ry+=ny*add; } }
      PX[i]=X[i]-(bvx+rx); PY[i]=Y[i]-(bvy+ry);
    }
  }
}
// ojales: el tramo de línea más cercano a cada esquina se desplaza para pasar por ella; la línea puede correr por el ojal
function eyelets(){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,IW=S.IW,bx=S.bx,by=S.by,P=S.pegs,M=S.N-1,SE=S.segEye;
  for(let q=1;q<P.length-1;q++){
    if(!S.eyeOn[q]) continue;
    const cx=bx[P[q]], cy=by[P[q]];
    // busca el tramo más cercano alrededor del que tenía
    let k0=S.eyeSeg[q], best=k0, bu=0, bd=Infinity;
    for(let k=Math.max(0,k0-3);k<=Math.min(M-1,k0+3);k++){
      const ax=X[k],ay=Y[k],ex=X[k+1]-ax,ey=Y[k+1]-ay,L2=ex*ex+ey*ey||1e-9;
      let u=((cx-ax)*ex+(cy-ay)*ey)/L2; u=u<0?0:u>1?1:u;
      const dx=ax+ex*u-cx, dy=ay+ey*u-cy, d2=dx*dx+dy*dy;
      if(d2<bd){ bd=d2; best=k; bu=u; }
    }
    if(best!==k0){ SE[k0]=-1; SE[best]=q; S.eyeSeg[q]=best; }
    S.eyeU[q]=bu;
    const a=best, b=best+1, wa=IW[a], wb=IW[b], ua=1-bu, den=wa*ua*ua+wb*bu*bu; if(den===0) continue;
    // si el tirón es muy fuerte (la línea junto al ojal va muy estirada), la esquina se deshace
    const R=S.rest, sa=a>0?Math.hypot(X[a]-X[a-1],Y[a]-Y[a-1])/R[a-1]:1, sb=b<M?Math.hypot(X[b+1]-X[b],Y[b+1]-Y[b])/R[b]:1;
    const sab=Math.hypot(X[b]-X[a],Y[b]-Y[a])/R[a];
    if(sa>EYE_LET || sb>EYE_LET || sab>EYE_LET){ S.eyeOn[q]=0; SE[best]=-1; S.quiet=0; continue; }
    const px=X[a]*ua+X[b]*bu, py=Y[a]*ua+Y[b]*bu; let dx=cx-px, dy=cy-py;
    const ca=wa*ua/den, cb=wb*bu/den;
    X[a]+=dx*ca; Y[a]+=dy*ca; PX[a]+=dx*ca; PY[a]+=dy*ca;
    X[b]+=dx*cb; Y[b]+=dy*cb; PX[b]+=dx*cb; PY[b]+=dy*cb;
  }
}
// escurrirse: si la línea envuelve una bola más de media vuelta (la bola la arrastra como un dedo a una cuerda),
// la línea se le escapa por detrás: deja de chocar con esa bola hasta que esté lejos, y cae por su peso
function slipOff(){
  if((S.slipTick=(S.slipTick|0)+1)%6!==0) return;
  if(S.simT-(S.touchT||-1e9)>CFG.gravityHold) return;   // solo mientras alguien mueve una bola (y un poco después): el desplome natural sí se queda colgado de las bolas
  const X=S.X,Y=S.Y,N=S.N,PASS=S.pass,rb=S.R+S.lw*0.5+6, rb2=rb*rb, lim=CFG.slipWrap*Math.PI/180;
  for(let bi=0;bi<S.balls.length;bi++){ const B=S.balls[bi], bit=1<<bi; if(!B.on) continue;
    // tramos de línea en contacto con la bola, agrupados por tramos seguidos; cada grupo es un "hilo" que la envuelve
    let i=0;
    while(i<N){
      const dx=X[i]-B.x, dy=Y[i]-B.y;
      if(PASS[i]&bit || dx*dx+dy*dy>rb2){ i++; continue; }
      let j=i, a0=Math.atan2(dy,dx), amin=0, amax=0;   // ángulos relativos al primer punto, sin saltos de 360
      while(j+1<N){ const ex=X[j+1]-B.x, ey=Y[j+1]-B.y; if(ex*ex+ey*ey>rb2*1.3) break; j++;
        let d=Math.atan2(ey,ex)-a0; d=Math.atan2(Math.sin(d),Math.cos(d)); if(d<amin) amin=d; if(d>amax) amax=d; }
      if(amax-amin>lim){ for(let k=Math.max(0,i-3);k<=Math.min(N-1,j+3);k++) PASS[k]|=bit; S.quiet=0; }
      i=j+1;
    }
  }
}
function bounds(){
  const X=S.X,Y=S.Y,PX=S.PX,PY=S.PY,N=S.N,fx=S.floorX,lo=14,hi=S.H-14;
  for(let i=0;i<N;i++){
    if(X[i]>fx){ const vx=X[i]-PX[i], vy=Y[i]-PY[i]; X[i]=fx; PX[i]=fx-Math.min(vx,0); PY[i]=Y[i]-vy*0.5; }
    if(Y[i]<lo||Y[i]>hi){ const vx=X[i]-PX[i]; Y[i]=Y[i]<lo?lo:hi; PY[i]=Y[i]; PX[i]=X[i]-vx*0.7; }
  }
}

/* ---------- tamaño en pantalla ---------- */
function fit(){
  const aw=stage.clientWidth, ah=stage.clientHeight;
  // vertical: cubre toda la pantalla (si la barra del navegador cambia, recorta un poco el margen)
  const s=S.portrait?Math.max(aw/S.OUTW, ah/S.OUTH):Math.min(aw/S.OUTW, ah/S.OUTH);
  const cw=Math.floor(S.OUTW*s), ch=Math.floor(S.OUTH*s);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  S.k=cv.width/S.OUTW;
  S.dirty=true;
}

/* ---------- dedo / ratón ---------- */
function toDesign(e){
  const r=cv.getBoundingClientRect();
  const ox=(e.clientX-r.left)*S.OUTW/r.width, oy=(e.clientY-r.top)*S.OUTH/r.height;
  const u=ox-S.OUTW/2, v=oy-S.OUTH/2;
  return [v/S.rot+S.W/2, -u/S.rot+S.H/2];
}
function ballAt(x,y){
  let best=null, bd=S.R*1.7;   // zona de toque generosa para el dedo
  for(const b of S.balls){
    if(!b.landed||b.held!==null) continue;
    const d=Math.hypot(b.x-x,b.y-y); if(d<bd){ bd=d; best=b; }
  }
  return best;
}
cv.addEventListener('pointerdown',e=>{
  const [x,y]=toDesign(e), b=ballAt(x,y); if(!b) return;
  e.preventDefault();
  b.held=e.pointerId; b.tx=x; b.ty=y;
  S.touched=true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  S.settled=false;
  if(!S.collapsing) S.collapseAt=Infinity;
  cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  const [x,y]=toDesign(e);
  let any=false;
  for(const b of S.balls) if(b.held===e.pointerId){ b.tx=x; b.ty=y; any=true; }
  if(any){ S.settled=false; return; }
  if(e.pointerType==='mouse') cv.style.cursor=ballAt(x,y)?'grab':'default';
});
function release(e){
  for(const b of S.balls) if(b.held===e.pointerId){
    b.held=null;
    if(!S.collapsing && !S.balls.some(o=>o.held!==null)) S.collapseAt=S.simT+CFG.afterTouch;
  }
  cv.style.cursor='default';
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

/* ---------- bucle ---------- */
function start(){
  initPhysics();
  S.simT=0; S.acc=0; S.lastNow=null; S.dirty=true;
}

function frame(now){
  const ctx=S.ctx;
  if(S.lastNow==null) S.lastNow=now;
  const dt=now-S.lastNow; S.lastNow=now;
  const h=S.hMs, steps=dt<11?3:6; let n=0, stepped=false;   // ritmo fijo: si el aparato no llega, va más lento pero sin saltos
  while(n<steps){
    S.simT+=h; n++;
    const held=S.balls.some(b=>b.held!==null);
    const pegsPending=S.collapsing && S.released<S.pegs.length;
    const collapseDue=!S.collapsing && S.simT>=S.collapseAt;
    // en reposo y sin dedo: no se calcula nada (ahorra batería)
    if(S.allLanded && S.settled && !held && !pegsPending && !collapseDue) continue;
    step(S.simT,h); stepped=true;
  }

  const t=S.simT;
  const intro=t<S.drawStart+S.drawDur+100;
  if(stepped||intro||S.dirty){ draw(t); S.dirty=false; }
  requestAnimationFrame(frame);
}

function draw(t){
  const ctx=S.ctx, W=S.W, H=S.H;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const easeIO=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const fadeP=clamp(t/500,0,1);
  const drawP=easeIO(clamp((t-S.drawStart)/S.drawDur,0,1));

  ctx.setTransform(S.k,0,0,S.k,0,0);
  ctx.fillStyle=CFG.bg; ctx.fillRect(0,0,S.OUTW,S.OUTH);
  ctx.translate(S.OUTW/2,S.OUTH/2);
  ctx.rotate(Math.PI/2);
  ctx.scale(S.rot,S.rot);
  ctx.translate(-W/2,-H/2);

  const X=S.X,Y=S.Y,IW=S.IW,N=S.N;
  const count=Math.max(2,Math.floor(N*drawP)), last=count-1;
  ctx.save();
  ctx.lineJoin=S.collapsing?'round':'miter'; ctx.lineCap='butt';
  ctx.strokeStyle=CFG.lineColor; ctx.globalAlpha=fadeP; ctx.lineWidth=S.lw;
  ctx.beginPath(); ctx.moveTo(X[0],Y[0]);
  for(let i=1;i<last;i++){
    if(IW[i]===0){ ctx.lineTo(X[i],Y[i]); continue; }
    const q=S.segEye[i];
    if(q>=0){ const p=S.pegs[q]; ctx.lineTo(X[i],Y[i]); ctx.lineTo(S.bx[p],S.by[p]); ctx.lineTo(X[i+1],Y[i+1]); continue; }   // esquina: pico en el ojal
    ctx.quadraticCurveTo(X[i],Y[i],(X[i]+X[i+1])*0.5,(Y[i]+Y[i+1])*0.5);
  }
  ctx.lineTo(X[last],Y[last]);
  ctx.stroke(); ctx.restore();

  if(drawP<1 && fadeP>=1){
    ctx.save(); ctx.fillStyle=CFG.lineColor;
    ctx.beginPath(); ctx.arc(X[last],Y[last],S.lw*0.75,0,7); ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha=fadeP; ctx.fillStyle=CFG.circleColor;
  for(const b of S.balls){ if(!b.on) continue; ctx.beginPath(); ctx.arc(b.x,b.y,S.R,0,7); ctx.fill(); }
  ctx.restore();
}

document.getElementById('again').addEventListener('click',start);
function screenAspect(){
  const a=stage.clientHeight/Math.max(1,stage.clientWidth);
  return a>=1.2?{portrait:true,aspect:a}:{portrait:false,aspect:16/9};
}
function rebuild(){
  const L=screenAspect(); S.portrait=L.portrait; S.aspect=L.aspect;
  setup(); fit(); start();
}
window.addEventListener('resize',()=>{
  const L=screenAspect();
  // girar el móvil o cambiar mucho la ventana rehace la espiral; cambios pequeños solo reajustan
  if(L.portrait!==S.portrait || Math.abs(L.aspect/S.aspect-1)>0.15) rebuild(); else fit();
});
rebuild();
requestAnimationFrame(frame);
})();
</script>
</body></html>
